function findLetterByChar(ch){
  return VOWELS.concat(CONSONANTS, DOUBLE_CONSONANTS, DOUBLE_VOWELS).find(l => l.ch === ch);
}
/* =========================================================
   UNICODE-HANGUL-ZERLEGUNG/-ZUSAMMENSETZUNG
   Jeder vorkomponierte Hangul-Silbenblock (z. B. '가') lässt sich über
   eine feste Formel in Anfangskonsonant + Vokal (+ optionalen
   Schlusskonsonant) zerlegen bzw. aus diesen wieder zusammensetzen.
   Das ist die Grundlage der interaktiven "Silbenbau"-Übung weiter unten.
========================================================= */
const HANGUL_INITIALS = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const HANGUL_MEDIALS = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const HANGUL_FINALS = [null,'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function decomposeSyllable(char){
  if(!char) return null;
  const code = char.charCodeAt(0) - 0xAC00;
  if(code < 0 || code > 11171) return null;
  const finalIdx = code % 28;
  const medialIdx = Math.floor(code / 28) % 21;
  const initialIdx = Math.floor(code / (28 * 21));
  return { initial: HANGUL_INITIALS[initialIdx], medial: HANGUL_MEDIALS[medialIdx], final: HANGUL_FINALS[finalIdx] };
}
function composeSyllable(initial, medial, final){
  const i = HANGUL_INITIALS.indexOf(initial);
  const m = HANGUL_MEDIALS.indexOf(medial);
  const f = final ? HANGUL_FINALS.indexOf(final) : 0;
  if(i < 0 || m < 0 || f < 0) return null;
  return String.fromCharCode(0xAC00 + (i * 21 + m) * 28 + f);
}
/* 겹받침 ("Doppel-Batchim"): bei manchen Silben besteht der Schlusskonsonant
   nicht aus einem, sondern aus ZWEI nebeneinanderstehenden Konsonanten
   (z. B. ㄶ = ㄴ+ㅎ in 찮, ㄼ = ㄹ+ㅂ in 덟). decomposeSyllable() liefert dafür
   trotzdem nur EINEN zusammengesetzten Buchstaben (den offiziellen
   Unicode-Codepoint ㄶ) — für die Silbenbau-/Wortbau-Übungen muss dieser
   aber in seine zwei bereits UNTERRICHTETEN Einzelbuchstaben aufgeteilt
   werden, sonst würde ein nie eingeführtes Zeichen abgefragt (s. Prinzip
   "Kein Lektionsschritt darf einen nicht eingeführten Begriff abfragen"). */
const COMPOUND_FINALS = {
  'ㄳ':['ㄱ','ㅅ'], 'ㄵ':['ㄴ','ㅈ'], 'ㄶ':['ㄴ','ㅎ'],
  'ㄺ':['ㄹ','ㄱ'], 'ㄻ':['ㄹ','ㅁ'], 'ㄼ':['ㄹ','ㅂ'],
  'ㄽ':['ㄹ','ㅅ'], 'ㄾ':['ㄹ','ㅌ'], 'ㄿ':['ㄹ','ㅍ'],
  'ㅀ':['ㄹ','ㅎ'], 'ㅄ':['ㅂ','ㅅ']
};
function splitCompoundFinal(final){
  return COMPOUND_FINALS[final] || null;
}
function joinCompoundFinal(a, b){
  for(const combo in COMPOUND_FINALS){
    const parts = COMPOUND_FINALS[combo];
    if(parts[0] === a && parts[1] === b) return combo;
  }
  return null;
}
/* Liefert die für den Silbenbau relevanten "Bauteile" des Schlusskonsonanten
   einer decomposeSyllable()-Zerlegung: [] ohne 받침, [Buchstabe] bei
   einfachem 받침, [Buchstabe1, Buchstabe2] bei 겹받침 (Doppel-Batchim). */
function finalPartsOf(d){
  if(!d || !d.final) return [];
  return splitCompoundFinal(d.final) || [d.final];
}
/* Partikel-/Kopula-Angleichung (Feedback vom 22.08.2026, Vorlagen-System):
   Ob ein Wort auf Konsonant oder Vokal endet, bestimmt in vielen Fällen,
   welche Partikel-/Endungsform korrekt ist (은 vs. 는, 이 vs. 가, 이에요 vs.
   예요 — s. grammatik-konzept.md "Der Satz-Baukasten"). Bisher wurde diese
   Entscheidung bei jedem handgeschriebenen clozeExamples-Eintrag von Hand
   getroffen. Für die neue Vorlagen-Engine (s. TEMPLATES weiter unten) muss
   sie automatisch berechenbar sein, da das eingesetzte Wort erst zur
   Laufzeit zufällig feststeht. Nutzt die bereits vorhandene
   decomposeSyllable()-Zerlegung der letzten Silbe des Worts — 입니다
   (격식체) ist bewusst NICHT enthalten, da es sich nie mit der
   Konsonant/Vokal-Endung ändert. */
function hasFinalConsonant(word){
  const trimmed = (word || '').trim();
  if(!trimmed) return null;
  const lastChar = trimmed.slice(-1);
  const d = decomposeSyllable(lastChar);
  if(!d) return null;
  return !!d.final;
}
function topicParticle(word){ return hasFinalConsonant(word) ? '은' : '는'; }
function subjectParticle(word){ return hasFinalConsonant(word) ? '이' : '가'; }
function copulaCasual(word){ return hasFinalConsonant(word) ? '이에요' : '예요'; }
function objectParticle(word){ return hasFinalConsonant(word) ? '을' : '를'; }

/* Bewusst eine Funktion und keine Konstante: Die Paket-Lektionen werden
   aus den Buchstaben-Paketen ABGELEITET, sind also Logik und kein
   Inhalt. Als Funktion (die beim Aufruf ausgewertet wird, nicht beim
   Einlesen) darf sie im Quelltext hinter den Kursdaten stehen — sonst
   müsste sich Inhalt und Code abwechseln. */

  return HANGUL_PACKS.map((pack, i) => ({

    icon: '🔤',
    type: 'hangul',
    letters: pack.chars.map(findLetterByChar),
    words: pack.words
  }));
}





/* =========================================================
   INHALTS-KONSISTENZ-CHECK (nur Entwicklungshinweis, kein UI-Blocker)
   Zwei verschiedene koreanische Begriffe dürfen NIE dieselbe deutsche
   "de"-Bedeutung tragen (weder innerhalb derselben Lektion noch app-weit,
   denn Vokabeltrainer/Fehlertrainer mischen Begriffe lektionsübergreifend).
   Sonst wird bei Übungen wie "Wie sagt man X auf Deutsch/Koreanisch?"
   nicht mehr erkennbar, WELCHE der beiden Bedeutungen gerade gemeint ist
   (Beispiel: 안녕히 가세요 vs. 안녕히 계세요 – beide früher schlicht "Auf
   Wiedersehen"). Solche Fälle MÜSSEN durch einen klärenden Zusatz in "de"
   unterschieden werden, z. B. "Auf Wiedersehen (zu jemandem, der geht)".
   Diese Prüfung läuft bei jedem Laden einmal durch und meldet Verstöße nur
   in der Browser-Konsole (console.warn) — bewusst nicht blockierend, damit
   ein Datenfehler nicht die ganze App unbenutzbar macht. */
function checkDuplicateMeanings(){
  const entries = [];
  COURSE.forEach(l => {
    (l.vocab || []).forEach(v => entries.push({ de:v.de, kr:v.kr, lessonId:l.id }));
    (l.words || []).forEach(w => entries.push({ de:w.de, kr:w.kr, lessonId:l.id }));
  });
  const byDe = {};
  entries.forEach(e => { (byDe[e.de] = byDe[e.de] || []).push(e); });
  Object.entries(byDe).forEach(([de, list]) => {
    const uniqueKr = Array.from(new Set(list.map(x => x.kr)));
    if(uniqueKr.length > 1){
      console.warn(`[Inhalts-Check] Mehrdeutige Bedeutung "${de}" für ${uniqueKr.length} verschiedene Begriffe: ${uniqueKr.join(', ')} — bitte in "de" unterscheidbar machen (z. B. Zusatz in Klammern).`);
    }
  });
}
checkDuplicateMeanings();

function isDue(key){

/* Strengere Variante für die Anzeige "heute fällig" und die gezielte

   und deren Abstand jetzt abgelaufen ist. isDue() oben behandelt eine
   noch nie beantwortete Frage bewusst als fällig (sie soll bei der

   um neuen, noch gar nicht wiederholten Stoff handelt. */

  if(!key) return;
  const today = todayStr();
  const prev = questionMemory[key];
  const level = isCorrect ? Math.min((prev ? prev.level : 0) + 1, SRS_MAX_LEVEL) : 0;
  questionMemory[key] = { level, due: addDaysStr(today, SRS_INTERVALS[level]) };

/* Einmalige Migration für Spielstände aus der Zeit vor dem Gedächtnis-
   Modell: jede bereits gemeisterte Frage bekommt Level 1 und wird ab
   heute fällig. So startet niemand mit einem leeren Gedächtnis (was alle
   Fragen gleichzeitig als "nie geübt" behandeln würde), aber auch nicht
   mit künstlich hohen Leveln für Stoff, dessen echter Zustand unbekannt
   ist. Kein sofortiges saveState() nötig — der nächste reguläre
   Speichervorgang übernimmt das Ergebnis. */
(function migrateQuestionMemory(){
  if(!saved || saved.questionMemory) return;
  const today = todayStr();
  masteredQuestions.forEach(key => {
    if(questionMemory[key]) return;
    /* Nicht ALLES auf heute legen: bei einem fortgeschrittenen Spielstand
       wären sonst am Tag der Umstellung mehrere hundert Fragen gleichzeitig
       fällig — eine abschreckende Zahl auf der Übersicht und ein Berg, der
       sich nicht an einem Tag abtragen lässt. Stattdessen wird der
       Altbestand über die nächsten Tage verteilt, anhand einer einfachen,
       stabilen Quersumme des Schlüssels (kein Zufall, damit dieselbe Frage
       bei einer erneuten Migration dasselbe Datum bekäme). */
    let hash = 0;
    for(let i = 0; i < key.length; i++) hash = (hash + key.charCodeAt(i)) % 997;
    questionMemory[key] = { level:1, due: addDaysStr(today, hash % SRS_MIGRATION_SPREAD_DAYS) };
  });
})();

/* Abstand zweier Datums-Strings in Tagen. */
function daysBetweenStr(fromStr, toStr){
  if(!fromStr || !toStr) return Infinity;
  const a = new Date(fromStr + 'T00:00:00Z').getTime();
  const b = new Date(toStr + 'T00:00:00Z').getTime();
  if(isNaN(a) || isNaN(b)) return Infinity;
  return Math.round((b - a) / 86400000);
}
/* ISO-Kalenderwoche als "2026-W35" — Grundlage für „ein Ruhetag pro Woche". */
function isoWeekStr(dateStr){
  const d = new Date(dateStr + 'T00:00:00Z');
  const day = (d.getUTCDay() + 6) % 7;          // Montag = 0
  d.setUTCDate(d.getUTCDate() - day + 3);       // auf den Donnerstag der Woche
  const year = d.getUTCFullYear();
  const firstThursday = new Date(Date.UTC(year, 0, 4));
  const firstDay = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDay + 3);
  const week = 1 + Math.round((d - firstThursday) / (7 * 86400000));
  return `${year}-W${String(week).padStart(2, '0')}`;
}

/* =========================================================

   =========================================================
   dailyStats kennt nur HEUTE — das genügt für den Tagesziel-Ring, aber
   damit lässt sich am Sonntag nicht sagen, was die Woche gebracht hat.
   Deshalb ein winziges Tagebuch: pro Tag vier Zahlen, und nur die
   letzten 14 Tage. Mehr wäre Datensammlung ohne Zweck; 14 Tage reichen
   für „diese Woche" und „letzte Woche" und halten den Speicherstand
   klein (rund 60 Zeichen pro Tag).

   Alles bleibt auf dem Gerät — es wird nichts übertragen, und die
   Sicherungsdatei nimmt es einfach mit.
   ========================================================= */
const WEEKLOG_DAYS = 14;
let weekLog = (saved && saved.weekLog && typeof saved.weekLog === 'object') ? saved.weekLog : {};
function logDay(feld, wert){
  const today = todayStr();
  if(!weekLog[today]) weekLog[today] = { xp:0, fragen:0, richtig:0, lektionen:0 };
  weekLog[today][feld] = (weekLog[today][feld] || 0) + (wert || 0);
  pruneWeekLog();
}
function pruneWeekLog(){
  const today = todayStr();
  Object.keys(weekLog).forEach(d => {
    if(daysBetweenStr(d, today) > WEEKLOG_DAYS || daysBetweenStr(d, today) < 0) delete weekLog[d];
  });
}
/* Die letzten sieben Tage, ältester zuerst — auch die leeren, denn eine
   Lücke in der Woche ist selbst eine Aussage. */
function lastSevenDays(){
  const heute = new Date(todayStr() + 'T00:00:00Z');
  const tage = [];
  for(let i = 6; i >= 0; i--){
    const d = new Date(heute.getTime() - i * 86400000);
    const key = d.toISOString().slice(0, 10);
    const e = weekLog[key] || { xp:0, fragen:0, richtig:0, lektionen:0 };
    tage.push({ datum:key, wochentag:['So','Mo','Di','Mi','Do','Fr','Sa'][d.getUTCDay()], ...e });
  }
  return tage;
}
function weekSummary(){
  const tage = lastSevenDays();
  const summe = (f) => tage.reduce((a, t) => a + (t[f] || 0), 0);
  const aktiv = tage.filter(t => t.fragen > 0).length;
  const fragen = summe('fragen');
  return {
    tage, aktiv, fragen,
    richtig: summe('richtig'),
    xp: summe('xp'),
    lektionen: summe('lektionen'),
    quote: fragen ? Math.round(summe('richtig') / fragen * 100) : 0,
    bestesXp: Math.max(1, ...tage.map(t => t.xp || 0)),

}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
/* Wählt bis zu "total" Übungen aus "items" aus, garantiert dabei aber:
   JEDE in "items" vorkommende Übungsart (ex.kind) ist mindestens einmal
   dabei — sofern der Pool dafür überhaupt etwas hergibt. Ohne das könnte
   ein reines shuffle().slice(0,n) rein zufällig eine ganze Übungsart
   (z. B. "buildword") komplett auslassen, wenn andere Arten (z. B. "mc")
   zahlenmäßig überwiegen. Erst wird pro Art zufällig EIN Vertreter
   gezogen, danach werden die restlichen Plätze zufällig aus dem übrigen
   Pool aufgefüllt, und die gesamte Auswahl am Ende noch einmal gemischt
   (damit die "garantierten" Übungen nicht immer als Erstes drankommen). */
function pickWithKindCoverage(items, total, keyFn){
  if(items.length === 0) return [];
  const getKey = keyFn || (ex => ex.kind);
  const byKind = {};
  items.forEach(ex => { const k = getKey(ex); (byKind[k] = byKind[k] || []).push(ex); });
  const picked = Object.values(byKind).map(pool => shuffle(pool)[0]);
  const pickedIds = new Set(picked.map(ex => ex.id));
  const remaining = shuffle(items.filter(ex => !pickedIds.has(ex.id)));
  const targetTotal = Math.max(total, picked.length);
  while(picked.length < targetTotal && remaining.length){
    picked.push(remaining.shift());
  }
  return shuffle(picked);
}
function pickDistractors(pool, correctVal, key, n){
  const others = shuffle(pool.filter(p => p[key] !== correctVal)).slice(0, n);
  return others.map(o => o[key]);
}
/* Wie pickDistractors, aber garantiert (wenn irgend möglich) mindestens
   "n" Distraktoren: reicht der eigentliche (z. B. bereits gelernte) Pool
   nicht aus, wird mit einem größeren "fallbackPool" aufgefüllt (z. B. dem
   kompletten Buchstaben-/Wortschatz der App). So stehen auch ganz am
   Anfang, wenn erst wenige Buchstaben/Wörter gelernt wurden, immer
   mindestens 4 Antwortmöglichkeiten zur Auswahl — sonst wäre eine Frage
   mit nur 1–2 Optionen viel zu leicht erratbar. */
function pickDistractorsWithFallback(pool, fallbackPool, correctVal, key, n){
  let distractors = pickDistractors(pool, correctVal, key, n);
  if(distractors.length < n && fallbackPool){
    const have = new Set([correctVal, ...distractors]);
    const extra = shuffle(fallbackPool.filter(p => !have.has(p[key]))).slice(0, n - distractors.length);
    distractors = distractors.concat(extra.map(o => o[key]));
  }
  return distractors;
}
/* =========================================================

   Warum das ohne fremde Bibliothek geht: Hangul besteht aus 24 Grund-

   einem Kreis gebaut. Kein Vergleich zu chinesischen Zeichen.

   Und der eigentliche Trick: In einer Übung wissen wir, WELCHER
   Buchstabe gefragt war. Es ist also keine offene Erkennung ("was hat
   er gemalt?"), sondern eine Prüfung ("passt das zu ㄱ — und passt es
   besser zu ㄱ als zu allem anderen?"). Das ist um Größenordnungen
   einfacher und lässt sich sauber begründen.

   Verfahren, in drei Schritten:
     1. Das Gemalte wird auf ein Einheitsquadrat normiert — UNIFORM,
        also unter Beibehaltung des Seitenverhältnisses. Das ist keine
        Kleinigkeit: ㅡ (breit und flach) und ㅣ (hoch und schmal)
        unterscheiden sich fast NUR im Seitenverhältnis. Wer auf die

        trotzdem.

/* Die Doppelkonsonanten sind zwei Ausfertigungen desselben Buchstabens
   nebeneinander — die lassen sich aus dem Grundbuchstaben errechnen,
   statt sie ein zweites Mal von Hand einzutragen. */
['ㄱ','ㄷ','ㅂ','ㅅ','ㅈ'].forEach((basis, i) => {
  const doppelt = ['ㄲ','ㄸ','ㅃ','ㅆ','ㅉ'][i];
  const eins = JAMO_FORMEN[basis];
  const stauchen = (versatz) => eins.map(strich => {
    if(typeof strich === 'string'){
      const [cx, cy, r] = strich.slice(6).split(',').map(Number);
      return `KREIS:${(cx * 0.46 + versatz).toFixed(3)},${cy},${(r * 0.46).toFixed(3)}`;
    }
    return strich.map(([x, y]) => [x * 0.46 + versatz, y]);
  });
  JAMO_FORMEN[doppelt] = stauchen(0.02).concat(stauchen(0.52));
});

/* Kreise werden als Linienzug ausgerollt — der Erkenner kennt nur Punkte. */
function formZuStrichen(form){
  return form.map(strich => {
    if(typeof strich !== 'string') return strich;
    const [cx, cy, r] = strich.slice(6).split(',').map(Number);
    const punkte = [];
    for(let i = 0; i <= 24; i++){
      const w = (i / 24) * Math.PI * 2;
      punkte.push([cx + Math.cos(w) * r, cy + Math.sin(w) * r]);
    }
    return punkte;
  });
}

const RASTER = 22;          // Auflösung des Vergleichsrasters
const RASTER_RAND = 0.10;   // Rand, damit Striche am Bildrand nicht abgeschnitten werden

/* Normiert Striche auf das Einheitsquadrat — unter Beibehaltung des
   Seitenverhältnisses (s. Kommentar oben: ㅡ gegen ㅣ). */
function normiereStriche(striche){
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  striche.forEach(s => s.forEach(([x, y]) => {
    if(x < minX) minX = x; if(x > maxX) maxX = x;
    if(y < minY) minY = y; if(y > maxY) maxY = y;
  }));
  if(!isFinite(minX)) return [];
  const breite = Math.max(maxX - minX, 1e-6);
  const hoehe = Math.max(maxY - minY, 1e-6);
  /* Ein einzelner gerader Strich hat in einer Richtung die Ausdehnung
     null. Damit er nicht auf volle Breite gezerrt wird, bekommt die
     Skalierung eine Untergrenze: Wer nur eine dünne Linie malt, behält
     eine dünne Linie. */
  const spanne = Math.max(breite, hoehe);
  const nutz = 1 - 2 * RASTER_RAND;
  const f = nutz / spanne;
  const versatzX = RASTER_RAND + (nutz - breite * f) / 2;
  const versatzY = RASTER_RAND + (nutz - hoehe * f) / 2;
  return striche.map(s => s.map(([x, y]) => [
    (x - minX) * f + versatzX,
    (y - minY) * f + versatzY
  ]));
}

/* Malt Striche in RICHTUNGS-Raster.

   Warum nicht ein einzelnes Raster (so war es bis zum 26.08.2026):
   Rückmeldung aus dem Alltag — ein sauber gemaltes ㅁ wurde als ㅇ
   abgelehnt. Der Grund ist strukturell: Die Weichzeichnung, die die
   Toleranz schafft, zerstört genau die Ecken. Nach zwei Durchgängen
   sind Quadrat und Kreis beide ein Ring, und der Unterschied liegt nur
   noch im Rauschen.

   Die Abhilfe ist, den Strich nicht nur danach zu erfassen, WO er
   liegt, sondern auch, in WELCHE RICHTUNG er dort zeigt. Ein Quadrat
   besteht aus waagerechten und senkrechten Stücken; ein Kreis
   verteilt seine Richtungen gleichmäßig über alle vier Fächer. Dieser
   Unterschied übersteht die Weichzeichnung, weil er nicht in der
   Position steckt, sondern im Inhalt.

   Es entstehen also fünf Raster: eines für "hier ist Tinte" und vier
   für "hier ist Tinte, die waagerecht / diagonal / senkrecht / anders
   diagonal verläuft". Die Richtung wird zwischen den beiden nächsten
   Fächern aufgeteilt, damit ein Strich bei 30° nicht hart in ein Fach
   kippt.

   Richtungen sind ungerichtet (Winkel modulo 180°): Ein von links nach
   rechts gemalter Strich ist derselbe wie einer von rechts nach links.
   Wer anders herum malt, malt trotzdem denselben Buchstaben. */
const RICHTUNGEN = 4;
const RICHTUNGS_GEWICHT = 1.35;   // wie stark die Richtung gegenüber der reinen Lage zählt
const FENSTER = 3;                // über wie viele Abtastpunkte die Richtung gemittelt wird

/* Striche gleichmäßig neu abtasten. Ein Finger liefert je nach Tempo mal
   dichte, mal weit auseinanderliegende Punkte — für die Richtungs-
   messung ist gleichmäßiger Abstand die Voraussetzung. */
function neuAbtasten(punkte, abstand){
  if(punkte.length < 2) return punkte.slice();
  const raus = [punkte[0]];
  let rest = abstand;
  for(let i = 1; i < punkte.length; i++){
    let [x1, y1] = raus[raus.length - 1];
    const [x2, y2] = punkte[i];
    let d = Math.hypot(x2 - x1, y2 - y1);
    while(d >= rest){
      const f = rest / d;
      const nx = x1 + (x2 - x1) * f, ny = y1 + (y2 - y1) * f;
      raus.push([nx, ny]);
      x1 = nx; y1 = ny;
      d = Math.hypot(x2 - x1, y2 - y1);
      rest = abstand;
    }
    rest -= d;
  }
  return raus;
}

function rasterAus(striche){
  const n = RASTER;
  const lage = new Float32Array(n * n);
  const richtung = [];
  for(let r = 0; r < RICHTUNGEN; r++) richtung.push(new Float32Array(n * n));

  const setze = (feld, x, y, wert) => {
    const gx = Math.round(x * (n - 1));
    const gy = Math.round(y * (n - 1));
    if(gx < 0 || gy < 0 || gx >= n || gy >= n) return;
    const i = gy * n + gx;
    if(feld[i] < wert) feld[i] = wert;
  };

  striche.forEach(roh => {
    const s = neuAbtasten(roh, 1 / (n * 2));
    if(s.length === 1){ setze(lage, s[0][0], s[0][1], 1); return; }
    for(let i = 0; i < s.length; i++){
      const [x, y] = s[i];
      setze(lage, x, y, 1);
      /* Die Richtung wird NICHT zwischen zwei benachbarten Punkten
         gemessen, sondern über ein Fenster. Bei einem zittrigen Strich
         zeigen zwei Nachbarpunkte in beliebige Richtungen — erst über
         eine längere Strecke wird sichtbar, wohin der Strich wirklich
         läuft. Genau daran war die erste Fassung gescheitert. */
      const a = s[Math.max(0, i - FENSTER)];
      const b = s[Math.min(s.length - 1, i + FENSTER)];
      const dx = b[0] - a[0], dy = b[1] - a[1];
      if(dx === 0 && dy === 0) continue;
      let winkel = Math.atan2(dy, dx);
      if(winkel < 0) winkel += Math.PI;
      const stelle = (winkel / Math.PI) * RICHTUNGEN;
      const unten = Math.floor(stelle) % RICHTUNGEN;
      const oben = (unten + 1) % RICHTUNGEN;
      const anteil = stelle - Math.floor(stelle);
      setze(richtung[unten], x, y, 1 - anteil);
      setze(richtung[oben], x, y, anteil);
    }
  });

  const teile = [weichzeichnen(weichzeichnen(lage, n), n)];
  richtung.forEach(f => teile.push(weichzeichnen(weichzeichnen(f, n), n)));
  const gesamt = new Float32Array(n * n * (1 + RICHTUNGEN));
  teile.forEach((feld, k) => {
    const gewicht = k === 0 ? 1 : RICHTUNGS_GEWICHT;
    for(let i = 0; i < feld.length; i++) gesamt[k * n * n + i] = feld[i] * gewicht;
  });
  return gesamt;
}
function weichzeichnen(feld, n){
  const raus = new Float32Array(n * n);
  for(let y = 0; y < n; y++){
    for(let x = 0; x < n; x++){
      let summe = 0, zahl = 0;
      for(let dy = -1; dy <= 1; dy++){
        for(let dx = -1; dx <= 1; dx++){
          const nx = x + dx, ny = y + dy;
          if(nx < 0 || ny < 0 || nx >= n || ny >= n) continue;
          const gewicht = (dx === 0 && dy === 0) ? 2 : 1;
          summe += feld[ny * n + nx] * gewicht; zahl += gewicht;
        }
      }
      raus[y * n + x] = summe / zahl;
    }
  }
  return raus;
}
function kosinus(a, b){
  let ab = 0, aa = 0, bb = 0;
  for(let i = 0; i < a.length; i++){ ab += a[i] * b[i]; aa += a[i] * a[i]; bb += b[i] * b[i]; }
  if(aa === 0 || bb === 0) return 0;
  return ab / Math.sqrt(aa * bb);
}

/* Mehrere Proportionen je Buchstabe.

   Anlass (26.08.2026): Ein gut gemaltes ㅛ wurde abgelehnt. Der Grund
   lag nicht in der Form, sondern im Seitenverhältnis — die Zeichnung
   war fast quadratisch (1,15), die Vorlage breit und flach (2,20).
   Weil uniform normiert wird (und das muss so sein, sonst werden ㅡ
   und ㅣ ununterscheidbar), landeten beide als verschieden geformte
   Gebilde im Raster.

   Wie lang jemand die Striche eines ㅛ im Verhältnis zum Balken malt,
   ist aber schlicht Handschrift und kein Fehler. Deshalb bekommt jeder
   Buchstabe mehrere Vorlagen: dieselbe Form, in der Breite gestaucht
   bzw. gedehnt. Verglichen wird gegen alle, es zählt die beste. Das
   toleriert Proportionen, ohne die Form selbst aufzuweichen — ein
   gestauchtes ㅛ bleibt ein ㅛ und wird nicht zum ㅐ. */
const PROPORTIONEN = [1, 0.55, 0.75, 1.4, 1.9];

function dehneForm(striche, faktor){
  return striche.map(s => s.map(([x, y]) => [x * faktor, y]));
}

/* Zweitformen: dieselbe Form, aber mit bündigem Stamm.

   Anlass (26.08.2026): Ein gut lesbares ㅖ wurde als ㅔ abgewiesen.
   Der Unterschied lag nicht in der Zahl der Striche — die stimmte —,
   sondern darin, WIE WEIT die Senkrechten über die Ästchen
   hinausragen. In der Vorlage laufen sie oben und unten deutlich
   darüber hinaus; in der Zeichnung fing die Senkrechte genau am
   oberen Ästchen an. Weil auf die Gesamtausdehnung normiert wird,
   rutscht damit jede Position im Raster: Das obere Ästchen sitzt in
   der Vorlage bei 32 % der Höhe, in der Zeichnung bei 4 %.

   Wo jemand die Ästchen ansetzt, ist Handschrift und kein Fehler.
   Also bekommen die betroffenen Buchstaben zusätzliche Vorlagen, bei
   denen der Stamm oben, unten oder beidseitig bündig mit dem
   äußersten Ästchen endet.

   Betroffen sind genau die Buchstaben mit ZWEI Ästchen an einem
   durchgehenden Stamm (ㅑ ㅕ ㅒ ㅖ) — dort ist die Lage der Ästchen
   im Stamm mehrdeutig. Bei einem einzelnen Ästchen (ㅏ ㅓ ㅐ ㅔ) sitzt
   es ohnehin auf halber Höhe; dort wird nichts hinzugefügt, damit
   ㅔ dem ㅖ nicht die Zeichnung wegschnappt. Die Erkennung der Fälle
   passiert unten aus der Form selbst, nicht über eine Namensliste:
   Ein Ästchen ist ein waagerechter Strich, der an einem Ende auf
   einem Stamm sitzt und am anderen frei endet — daran scheitert
   z. B. ㅂ, dessen Querstriche beidseitig angebunden sind. */
function stammBuendig(form, obenBuendig, untenBuendig){
  const striche = form.filter(s => typeof s !== 'string');
  if(striche.length !== form.length) return null;   // Kreise: kein Stamm
  let yMin = Infinity, yMax = -Infinity;
  striche.forEach(s => s.forEach(([, y]) => { if(y < yMin) yMin = y; if(y > yMax) yMax = y; }));
  const hoehe = yMax - yMin;
  if(hoehe <= 0) return null;

  const enden = (s) => [s[0], s[s.length - 1]];
  const istStamm = (s) => {
    const [a, b] = enden(s);
    return Math.abs(b[0] - a[0]) < 0.06 && Math.abs(b[1] - a[1]) >= 0.7 * hoehe;
  };
  const staemme = striche.filter(istStamm);
  if(!staemme.length) return null;
  const aufStamm = (p) => staemme.some(st => Math.abs(st[0][0] - p[0]) < 0.06);

  const aeste = striche.filter(s => {
    if(istStamm(s)) return false;
    const [a, b] = enden(s);
    if(Math.abs(b[1] - a[1]) > 0.12 * hoehe) return false;      // muss waagerecht sein
    return aufStamm(a) !== aufStamm(b);                        // genau ein Ende angebunden
  });
  if(aeste.length < 2) return null;

  const astOben = Math.min(...aeste.map(s => s[0][1]));
  const astUnten = Math.max(...aeste.map(s => s[0][1]));
  const von = obenBuendig ? astOben : yMin;
  const bis = untenBuendig ? astUnten : yMax;
  return form.map(s => istStamm(s)
    ? s.map(([x, y]) => [x, Math.min(bis, Math.max(von, y))])
    : s);
}

let jamoVorlagen = null;
function vorlagen(){
  if(jamoVorlagen) return jamoVorlagen;
  jamoVorlagen = {};
  Object.keys(JAMO_FORMEN).forEach(ch => {
    const grund = formZuStrichen(JAMO_FORMEN[ch]);
    const formen = [grund];
    /* Nur EINE Seite bündig. Beidseitig bündig schrumpft den Stamm auf
       den Abstand der Ästchen zusammen — das Ergebnis ist so klein und
       so gedrungen, dass es nach der Normierung anderen Buchstaben
       ähnlicher wird als sich selbst (gemessen: ein ㅁ verlor dadurch
       zwei Drittel seines Vorsprungs, ㄷ fiel ganz durch). */
    [[true, false], [false, true]].forEach(([o, u]) => {
      const v = stammBuendig(grund, o, u);
      if(v) formen.push(v);
    });
    jamoVorlagen[ch] = [];
    formen.forEach(f0 => PROPORTIONEN.forEach(f =>
      jamoVorlagen[ch].push(rasterAus(normiereStriche(dehneForm(f0, f))))));
  });
  return jamoVorlagen;
}
function kannGemaltWerden(ch){ return !!JAMO_FORMEN[ch]; }

/* Liefert alle Buchstaben nach Ähnlichkeit sortiert. */
function erkenneJamo(striche){
  const gefiltert = (striche || []).filter(s => s && s.length > 1);
  if(!gefiltert.length) return [];
  const meins = rasterAus(normiereStriche(gefiltert));
  const v = vorlagen();
  return Object.keys(v)
    .map(ch => ({ ch, wert: v[ch].reduce((best, raster) => Math.max(best, kosinus(meins, raster)), 0) }))
    .sort((a, b) => b.wert - a.wert);
}

/* Das Urteil. Drei Bedingungen, und jede hat einen Grund:
   - Der gesuchte Buchstabe muss der ähnlichste sein.
   - Er muss eine Mindestähnlichkeit erreichen, sonst würde auch ein
     Gekritzel durchgehen, das zufällig am wenigsten unähnlich ist.
   - Verfehlt man ihn, aber ein anderer Buchstabe passt deutlich, ist
     das die nützlichste Rückmeldung überhaupt: "das sieht aus wie ㅓ". */
const MAL_SCHWELLE = 0.62;
function pruefeGemaltesJamo(striche, ziel){
  const liste = erkenneJamo(striche);
  if(!liste.length) return { richtig:false, leer:true };
  const beste = liste[0];
  const zielWert = (liste.find(e => e.ch === ziel) || { wert:0 }).wert;
  const richtig = beste.ch === ziel && zielWert >= MAL_SCHWELLE;
  return {
    richtig,
    leer: false,
    wert: zielWert,
    verwechseltMit: (!richtig && beste.ch !== ziel && beste.wert >= MAL_SCHWELLE) ? beste.ch : null
  };
}

/* =========================================================
   AUSSPRACHE (Einstellung "Aussprache")
   Nutzt die Web-Speech-API des Browsers, um koreanischen Text
   laut vorzulesen. Rein clientseitig, kein Download nötig.
========================================================= */
/* rate: Sprechgeschwindigkeit, 1 = normal. Für die Hörverstehen-Übung gibt
   es zusätzlich einen "Langsam & deutlich"-Knopf (Feedback vom 24.08.2026),
   der mit SPEAK_RATE_SLOW vorliest — bei ungewohnten Lauten ist normales
   Sprechtempo zum Heraushören oft zu schnell. */
const SPEAK_RATE_SLOW = 0.55;
/* Aufnahmen werden langsamer ABGESPIELT statt langsamer gesprochen. 0.55
   klingt bei einer echten Stimme schleppend und verwaschen; 0.72 ist
   deutlich langsamer und trotzdem noch Sprache. Browser halten die
   Tonhöhe dabei von sich aus konstant. */
const AUDIO_RATE_SLOW = 0.72;

/* =========================================================
   AUFNAHMEN (Phase 4)
   =========================================================
   Die Sprachsynthese des Geräts ist ein Notnagel: Auf iPhones ist ab
   Werk KEINE koreanische Stimme installiert, und dann passierte beim
   Tippen auf 🔊 lautlos nichts. Deshalb kann die App jetzt echte
   Aufnahmen abspielen, die neben ihr im Ordner `audio/` liegen.

   Wichtig für den Alltag: Der Ordner ist OPTIONAL. Fehlt er — etwa
   wenn die HTML-Datei per Doppelklick geöffnet wird —, verhält sich
   die App exakt wie vorher und nimmt die Gerätestimme. Es gibt also
   keine zwei Fassungen der App, nur eine, die mehr kann, wenn mehr
   da ist.

   Welche Datei zu welchem Text gehört, sagt `audio/index.json`. Die
   Dateinamen sind ein kurzer Streuwert (FNV-1a, 32 Bit) über den Text
   selbst — dieselbe Formel steckt im Erzeugungs-Skript
   (tools/audio-erzeugen.py), damit beide Seiten ohne Absprache auf
   denselben Namen kommen.
   ========================================================= */
const AUDIO_BASE = 'audio/';
let audioIndex = null;        // Set der vorhandenen Streuwerte, null = noch nichts geladen
let audioIndexInfo = null;    // { voice, format, count } — nur für die Einstellungen
let currentAudioEl = null;

function audioHash(text){
  /* FNV-1a über die UTF-8-Bytes. Bewusst keine Krypto-Funktion:
     crypto.subtle gibt es bei file:// gar nicht und es ist asynchron. */
  const bytes = new TextEncoder().encode(String(text).trim());
  let h = 0x811c9dc5;
  for(let i = 0; i < bytes.length; i++){
    h ^= bytes[i];
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return ('0000000' + h.toString(16)).slice(-8);
}
function hasRecording(text){
  return !!(audioIndex && text && audioIndex.has(audioHash(text)));
}
function recordingsAvailable(){
  return !!(audioIndex && audioIndex.size);
}
/* Ob überhaupt irgendetwas zu hören ist — Aufnahmen ODER Gerätestimme. */
function pronunciationAvailable(){

/* Einmal beim Start: Gibt es den Ordner? Bei file:// schlägt das fetch
   an der Sicherheitsregel des Browsers fehl, bei einer normalen Adresse
   ohne Ordner mit 404 — beides landet still im selben Zweig. */
function loadAudioIndex(){
  let url;
  try{ url = new URL(AUDIO_BASE + 'index.json', location.href).href; }
  catch(e){ return Promise.resolve(); }
  return fetch(url, { cache:'no-cache' })
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if(!data || !Array.isArray(data.items)) return;
      audioIndex = new Set(data.items.map(it => String(it.file).replace(/\.[a-z0-9]+$/i, '')));
      audioIndexInfo = { voice:data.voice || null, format:data.format || 'mp3', count:audioIndex.size };
      /* Mit Aufnahmen sind Hörübungen auch dann möglich, wenn das Gerät
         keine koreanische Stimme hat — das war bisher die Bedingung. */
      updateHeaderStats();
    })
    .catch(() => { /* keine Aufnahmen vorhanden — Gerätestimme genügt */ });
}
function stopSpeaking(){
  if(currentAudioEl){
    try{ currentAudioEl.pause(); }catch(e){ /* egal */ }
    currentAudioEl = null;
  }
  if('speechSynthesis' in window){
    try{ window.speechSynthesis.cancel(); }catch(e){ /* egal */ }
  }
}
/* rate: Sprechgeschwindigkeit, 1 = normal. Für die Hörverstehen-Übung gibt
   es zusätzlich einen "Langsam & deutlich"-Knopf (Feedback vom 24.08.2026),
   der langsamer vorliest — bei ungewohnten Lauten ist normales
   Sprechtempo zum Heraushören oft zu schnell. */
function speak(text, rate){
  if(!text) return;
  stopSpeaking();
  if(hasRecording(text)){
    try{
      const el = new Audio(AUDIO_BASE + audioHash(text) + '.' + (audioIndexInfo && audioIndexInfo.format || 'mp3'));
      el.playbackRate = rate && rate < 1 ? AUDIO_RATE_SLOW : 1;
      /* Sollte die Datei doch fehlen oder das Format nicht spielbar sein,
         übernimmt still die Gerätestimme. */
      el.onerror = () => { if(currentAudioEl === el){ currentAudioEl = null; speakWithVoice(text, rate); } };
      currentAudioEl = el;
      const started = el.play();
      if(started && started.catch) started.catch(() => {
        /* Manche Browser verlangen eine vorherige Nutzergeste. Die haben
           wir hier immer (der Knopf wurde ja getippt) — falls doch nicht,
           bleibt die Gerätestimme. */
        if(currentAudioEl === el){ currentAudioEl = null; speakWithVoice(text, rate); }
      });
      return;
    }catch(e){ /* weiter mit der Gerätestimme */ }
  }
  speakWithVoice(text, rate);
}
function speakWithVoice(text, rate){
  if(!('speechSynthesis' in window)) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';

    window.speechSynthesis.speak(u);
  }catch(e){ /* Sprachausgabe auf diesem Gerät nicht verfügbar */ }
}

/* =========================================================
   TON UND VIBRATION
   =========================================================
   Bis hierher war die einzige Rückmeldung auf eine Antwort die Farbe.
   Am Telefon ist ein kurzer Ton oder ein Impuls das billigste Stück
   Qualitätsgefühl, das es gibt — und bei 21 Übungen je Lektion die
   Rückmeldung, die man am häufigsten bekommt.

   Bewusst KEINE Tondateien: Zwei Töne wären zwei weitere Dateien, die
   geladen, zwischengespeichert und offline vorgehalten werden müssten.
   Der Browser kann Klänge selbst erzeugen — das kostet nichts, klingt
   überall gleich und funktioniert auch bei der losen HTML-Datei.

   Gestaltung: aufwärts für richtig, abwärts für falsch, beide leise und
   sehr kurz (unter einer Viertelsekunde). Der Falsch-Ton ist bewusst
   weich und tief statt schrill — er soll etwas melden, nicht schimpfen.
   Ein- und Ausblenden der Lautstärke verhindert das Knacken, das
   abrupt gestartete Töne sonst erzeugen.
   ========================================================= */
let audioCtx = null;
function getAudioCtx(){
  if(audioCtx) return audioCtx;
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    audioCtx = new Ctx();
  }catch(e){ return null; }
  return audioCtx;
}
function playTones(noten){
  if(!settings.sounds) return;
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    /* Nach dem Wegschalten der App liegt der Klang-Zusammenhang oft
       schlafend — hier stehen wir immer nach einem Fingertipp, also
       darf geweckt werden. */
    if(ctx.state === 'suspended') ctx.resume();
    const start = ctx.currentTime + 0.01;
    noten.forEach((n, i) => {
      const osz = ctx.createOscillator();
      const gain = ctx.createGain();
      osz.type = n.form || 'sine';
      osz.frequency.setValueAtTime(n.hz, start + n.ab);
      const spitze = n.laut != null ? n.laut : 0.13;
      gain.gain.setValueAtTime(0.0001, start + n.ab);
      gain.gain.exponentialRampToValueAtTime(spitze, start + n.ab + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + n.ab + n.dauer);
      osz.connect(gain).connect(ctx.destination);
      osz.start(start + n.ab);
      osz.stop(start + n.ab + n.dauer + 0.02);
    });
  }catch(e){ /* Klangausgabe hier nicht möglich — die Farbe bleibt */ }
}
function buzz(muster){
  if(!settings.haptics || !navigator.vibrate) return;
  try{ navigator.vibrate(muster); }catch(e){ /* nicht unterstützt */ }
}

function showChoiceDialog(opts){

  const stacked = opts.buttons.length > 2 || opts.stacked;

  // (Textfeld, Dateiauswahl) — gebraucht für die Fortschritts-Sicherung.
  box.innerHTML = `<h3>${opts.title}</h3><p>${opts.message}</p>${opts.extraHtml || ''}<div class="modal-actions${stacked ? ' stacked' : ''}"></div>`;
  const actionsWrap = box.querySelector('.modal-actions');
  opts.buttons.forEach(b => {
    const btnEl = document.createElement('button');
    btnEl.type = 'button';
    btnEl.className = 'btn ' + (b.className || 'btn-primary');
    btnEl.textContent = b.label;
    btnEl.onclick = () => { overlay.remove(); if(b.onClick) b.onClick(); };
    actionsWrap.appendChild(btnEl);

    /* Die Markierung braucht auch der Android-Zurück-Knopf: er darf nur
       Dialoge schließen, die man ohnehin wegtippen könnte. */
    overlay.dataset.dismissible = '1';

  }
  return overlay;
}

const BACKUP_FORMAT = 'koreanisch-lernen-sicherung';

function buildBackupObject(){
  const raw = localStorage.getItem(STORAGE_KEY);

  try{ state = raw ? JSON.parse(raw) : null; }catch(e){ state = null; }
  // Falls noch nie gespeichert wurde: aktuellen Stand erzwingen.
  if(!state){ saveState(); try{ state = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); }catch(e){ state = null; } }
  return { format: BACKUP_FORMAT, version: BACKUP_VERSION, savedAt: new Date().toISOString(), state: state || {} };
}
function backupSummary(state){
  const lessons = (state.completed || []).length;

}

/* Prüft eine eingelesene Sicherung, bevor irgendetwas überschrieben wird.
   Lieber eine klare Fehlermeldung als ein halb eingespielter Spielstand. */
function parseBackup(text){
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ return { error:'Das ist keine gültige Sicherungsdatei — der Text lässt sich nicht lesen.' }; }
  if(!data || typeof data !== 'object') return { error:'Das ist keine gültige Sicherungsdatei.' };
  // Auch eine roh kopierte Spielstand-Datei (ohne Hülle) akzeptieren.
  const state = data.format === BACKUP_FORMAT ? data.state : data;
  if(!state || typeof state !== 'object' || (!Array.isArray(state.completed) && !Array.isArray(state.masteredQuestions))){
    return { error:'Diese Datei enthält keinen Lernfortschritt dieser App.' };
  }
  return { state, savedAt: data.savedAt || null };
}
function applyBackup(state){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    setBackupNote('Der Fortschritt konnte nicht gespeichert werden — dieser Browser erlaubt keine Speicherung.', 'err');
    return;
  }
  // Neu laden statt Dutzende Variablen von Hand zu setzen: so laufen alle
  // Migrationen (s. migrateQuestionMemory, migrateTemplateMasteryKeys,
  // migrateMaxUnlockedUnit) exakt wie bei einem normalen Start.
  location.reload();
}

    extraHtml: `<input type="file" accept="application/json,.json,.txt" class="backup-file" id="backupFile">
      <textarea class="backup-box" id="backupPaste" placeholder="… oder den gesicherten Text hier einfügen"></textarea>`,
    onReady: (box) => {
      window.__backupPasted = '';
      const paste = box.querySelector('#backupPaste');
      paste.oninput = () => { window.__backupPasted = paste.value; };
      box.querySelector('#backupFile').onchange = (e) => {
        const file = e.target.files && e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = () => { paste.value = String(reader.result || ''); window.__backupPasted = paste.value; };
        reader.readAsText(file);
      };
    }
  });
}
/* Einfacher Bestätigungsdialog (Abbrechen/Bestätigen) für gefährliche
   Einzel-Aktionen (z. B. Fortschritt zurücksetzen), auf Basis von
   showChoiceDialog. */
function showConfirmDialog(title, message, confirmLabel, onConfirm){
  showChoiceDialog({

    ]

}
function speakBtnHtml(text){
  if(!settings.showPronunciation || !text) return '';
  return `<button type="button" class="speak-btn" data-speak="${escapeAttr(text)}" aria-label="Aussprache anhören">🔊</button>`;
}
function romanHtml(roman, className){
