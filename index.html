// Delegierter Klick-Handler: fängt Klicks auf JEDEN Lautsprecher-Button ab,
// egal wo (Übungskarte, Einführung, Rückblick-Liste, Fehlerliste, Antwort-Option)
// er eingefügt wurde. Läuft in der CAPTURE-Phase, damit ein Klick auf einen
// Lautsprecher INNERHALB einer Antwort-Option diese nicht zusätzlich auswählt.
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.speak-btn');
  if(btn){
    e.stopPropagation(); e.preventDefault();
    /* Stumm bleiben ist keine Antwort: Wer weder Aufnahmen noch eine
       Gerätestimme hat, bekommt einmalig gesagt, woran es liegt. */
    if(!pronunciationAvailable()){ explainMissingVoice(); return; }
    speak(btn.dataset.speak || '');
  }
}, true);
/* Wort-für-Wort-Übersetzung im "Richtig: ..."-Feedback einer falsch
   beantworteten Satzbau-Übung (Feedback vom 24.08.2026, s. .gloss-word/
   .gloss-tooltip-CSS und handleCheck()): Auf Mausgeräten reicht reines
   CSS (:hover), aber Touch-Geräte kennen kein Hover — dort übernimmt
   dieser delegierte Klick-Handler das Ein-/Ausblenden per Fingertipp.
   Ein Tipp auf ein .gloss-word schaltet dessen Tooltip um; ein Tipp
   irgendwo anders (oder auf ein anderes Wort) schließt alle übrigen
   offenen Tooltips, damit nie mehrere gleichzeitig offen stehen bleiben. */
document.addEventListener('click', (e) => {
  const word = e.target.closest('.gloss-word');
  const ownTip = word ? word.querySelector('.gloss-tooltip') : null;
  document.querySelectorAll('.gloss-tooltip.show').forEach(tip => {
    if(tip !== ownTip) tip.classList.remove('show');
  });
  if(ownTip){ e.stopPropagation(); ownTip.classList.toggle('show'); }
});
/* "Prüfen"/"Weiter" zusätzlich per Enter-Taste auslösen (Feedback vom
   16.08.2026). Ein einziger, globaler Handler statt je Übungsart eigener
   Enter-Logik: #checkBtn trägt bereits für JEDE Übungsart den jeweils
   richtigen Klick-Handler (handleCheck bei "Prüfen", nextExercise bei
   "Weiter") — Enter simuliert einfach einen Klick darauf, wirkt sich also
   automatisch korrekt aus, unabhängig vom aktuellen Übungstyp/Zustand.
   Zwei Sicherheitsbedingungen: (1) Der Button muss aktiv (nicht disabled)
   sein — genau wie ein echter Klick auf einen deaktivierten Button nichts
   bewirkt. (2) Der Lektions-Screen (#lesson) muss sichtbar sein
   (offsetParent !== null), sonst hätte Enter auch außerhalb einer Sitzung
   einen Effekt, z. B. im Wörterbuch-Suchfeld. preventDefault()
   unterdrückt dabei die native Enter-Aktivierung eines gerade fokussierten
   Buttons (z. B. einer angetippten MC-Antwort-Kachel), damit checkBtn
   nicht durch denselben Tastendruck zusätzlich ein zweites Mal ausgelöst
   wird. */
document.addEventListener('keydown', (e) => {
  if(e.key !== 'Enter') return;
  const btn = $('checkBtn');
  if(!btn || btn.disabled || !btn.offsetParent) return;
  e.preventDefault();
  btn.click();
});
/* =========================================================
   GEMEINSAME BAUSTEINE FÜR ABFRAGE-ÜBUNGEN (Lektion, Vokabel-
   trainer, Fehlertrainer) — jede erzeugte Übung trägt eine
   stabile "id" + "mistakeMeta", damit Fehler zuverlässig erfasst
   und beim Fehlertrainer wieder gezielt aufgelöst werden können.
========================================================= */
/* Alle jemals in der App vorkommenden Vokabeln/Hangul-Wörter — dienen als
   Auffüll-Pool, damit eine Frage nie mit weniger als 4 Antwortmöglichkeiten
   dasteht, selbst wenn bisher erst sehr wenig gelernt wurde. */
function getAllVocabEver(){
  return COURSE.filter(l => l.type === 'vocab').flatMap(l => l.vocab);
}
function getAllHangulWordsEver(){
  return COURSE.filter(l => l.type === 'hangul' && l.words).flatMap(l => l.words);
}
function makeVocabMcExercise(v, pool, direction, phase, lessonId, idOverride){
  const id = idOverride || `vocab:${lessonId || 'mixed'}:${v.kr}:${direction}`;
  const meta = { entryKind:'vocab', lessonId: lessonId || null, term:v.kr, roman:v.roman, de:v.de, direction };
  const fallback = getAllVocabEver();
  if(direction === 'term-to-meaning'){
    const distractors = pickDistractorsWithFallback(pool, fallback, v.de, 'de', 3);
    return { phase, kind:'mc', id, title:'Was bedeutet das?', prompt:v.kr, sub:v.roman, promptIsKr:true, optionsAreKr:false,
      options: shuffle([v.de, ...distractors]), correct: v.de, mistakeMeta: meta };
  }
  const distractors = pickDistractorsWithFallback(pool, fallback, v.kr, 'kr', 3);
  return { phase, kind:'mc', id, title:'Wie sagt man das auf Koreanisch?', prompt:v.de, sub:'', promptIsKr:false, optionsAreKr:true,
    options: shuffle([v.kr, ...distractors]), correct: v.kr, mistakeMeta: meta };
}
function makeHangulMcExercise(l, pool, direction, phase, lessonId, idOverride){
  const id = idOverride || `hangul:${lessonId || 'mixed'}:${l.ch}:${direction}`;
  const meta = { entryKind:'hangul', lessonId: lessonId || null, term:l.ch, roman:l.roman, de:'', direction };
  const fallback = l.kind === 'vowel' ? VOWELS.concat(DOUBLE_VOWELS) : CONSONANTS.concat(DOUBLE_CONSONANTS);
  if(direction === 'term-to-meaning'){
    const distractors = pickDistractorsWithFallback(pool, fallback, l.roman, 'roman', 3);
    return { phase, kind:'mc', id, title:'Welcher Laut passt zu diesem Zeichen?', prompt:l.ch, sub:'', promptIsKr:true, optionsAreKr:false,
      options: shuffle([l.roman, ...distractors]), correct: l.roman, mistakeMeta: meta };
  }
  const distractors = pickDistractorsWithFallback(pool, fallback, l.ch, 'ch', 3);
  return { phase, kind:'mc', id, title:'Welches Zeichen macht diesen Laut?', prompt:l.roman, sub:'', promptIsKr:false, optionsAreKr:true,
    options: shuffle([l.ch, ...distractors]), correct: l.ch, mistakeMeta: meta };
}
/* Abfrage zum Alltagswort einer Hangul-Lektion. Eigener "hangulword"-Typ,
   damit Fehler daraus sauber von echten Vokabel-Lektionen (entryKind
   "vocab") unterschieden werden können. */
function makeHangulWordMcExercise(w, pool, direction, phase, lessonId, idOverride){
  const id = idOverride || `hangulword:${lessonId || 'mixed'}:${w.kr}:${direction}`;
  const meta = { entryKind:'hangulword', lessonId: lessonId || null, term:w.kr, roman:w.roman, de:w.de, direction };
  const fallback = getAllHangulWordsEver();
  if(direction === 'term-to-meaning'){
    const distractors = pickDistractorsWithFallback(pool, fallback, w.de, 'de', 3);
    return { phase, kind:'mc', id, title:'Was bedeutet dieses Alltagswort?', prompt:w.kr, sub:w.roman, promptIsKr:true, optionsAreKr:false,
      options: shuffle([w.de, ...distractors]), correct: w.de, mistakeMeta: meta };
  }
  const distractors = pickDistractorsWithFallback(pool, fallback, w.kr, 'kr', 3);
  return { phase, kind:'mc', id, title:'Wie sagt man das auf Koreanisch?', prompt:w.de, sub:'', promptIsKr:false, optionsAreKr:true,
    options: shuffle([w.kr, ...distractors]), correct: w.kr, mistakeMeta: meta };
}
/* =========================================================
   HÖRVERSTEHEN ("listen", Feedback vom 24.08.2026)
   Bis dahin war die Sprachausgabe ausschließlich Beiwerk: ein 🔊-Knopf
   neben einem Wort, das ohnehin schon lesbar auf dem Bildschirm stand.
   Damit ließ sich nie prüfen, ob man Koreanisch auch VERSTEHT, wenn man
   es nur hört — für das Ziel "sich unterhalten können" aber die halbe
   Fähigkeit. Diese Übungsart spielt das Wort vor und zeigt ausschließlich
   die deutschen Antwortmöglichkeiten; das koreanische Schriftbild bleibt
   verborgen, bis man es über "Text anzeigen" selbst aufdeckt.

   Bewusst NUR in Wiederholungslektionen, Vokabeltrainer und der
   Fällig-Sitzung, nicht in den regulären Lektionen: die Fragen einer
   Lektion bilden über getLessonQuestionKeys/getUnitQuestionKeys die
   Grundgesamtheit für Fortschritts-Zähler und Einheiten-Freischaltung —
   dort neue Fragen zu ergänzen würde bei allen bestehenden Spielständen
   die angezeigten Zähler rückwirkend absacken lassen ("21/21" würde über
   Nacht zu "21/31"). Wiederholungen sind von dieser Zählung ausgenommen
   und kommen ab der Einheit „Begrüßungen“ nach jeder Lektion, das Hören wird dadurch
   trotzdem regelmäßig geübt.

   Die Übung nutzt entryKind 'vocab'/'hangulword' wie die zugehörige
   Lese-Abfrage und unterscheidet sich nur über direction:'listen'. Damit
   bleibt der Fehlertrainer-Schlüssel (ohne direction, s. recordMistake)
   derselbe wie beim geschriebenen Wort — ein Wort taucht also weiterhin
   nur EINMAL in der Fehlerliste auf, egal ob man es beim Lesen oder beim
   Hören verpatzt hat — während der Mastery-Key (mit direction, s.
   masteryKeyFor) beide Fähigkeiten getrennt zählt.
========================================================= */
/* Sprachstimmen meldet der Browser asynchron nach; getVoices() liefert
   direkt beim Laden auf vielen Geräten noch eine leere Liste. Deshalb
   wird das Ergebnis gecacht und bei 'voiceschanged' aktualisiert. Solange
   keine koreanische Stimme bekannt ist, werden gar keine Hörübungen
   erzeugt (statt stumme Karten zu zeigen). */
let koreanVoiceAvailable = false;
function refreshKoreanVoice(){
  if(!('speechSynthesis' in window)) return;
  try{
    const voices = window.speechSynthesis.getVoices() || [];
    if(voices.length) koreanVoiceAvailable = voices.some(v => (v.lang || '').toLowerCase().indexOf('ko') === 0);
  }catch(e){ /* Sprachausgabe auf diesem Gerät nicht verfügbar */ }
}
/* Ob das Gerät Ton wiedergeben KANN, sagt noch nichts darüber, ob man
   gerade zuhören kann — im Bus, im Büro, neben einem schlafenden Kind ist
   eine Hörübung keine Übung, sondern eine Sackgasse. Deshalb wird vor der
   ersten Hörübung eines App-Starts einmal nachgefragt (s. renderExercise).
   Beide Zustände gelten bewusst NUR für den laufenden App-Start und werden
   nicht gespeichert: die Antwort „gerade nicht" ist situationsbedingt und
   soll nicht dauerhaft eine ganze Übungsform abschalten — dafür gibt es
   den Regler in den Einstellungen. */
let listenAsked = false;
let listenAllowedThisRun = true;
function listenExercisesAvailable(){
  /* Seit Phase 4 genügen Aufnahmen — die koreanische Gerätestimme ist
     nur noch einer von zwei Wegen (s. pronunciationAvailable). */
  return !!settings.listenExercises && pronunciationAvailable() && listenAllowedThisRun;
}
/* Für EINEN bestimmten Text: Können wir ihn hörbar machen? Bei
   unvollständigem Audio-Ordner (z. B. während des Erzeugens) hat nicht
   jedes Wort eine Aufnahme — dann rettet nur die Gerätestimme, und wenn
   auch die fehlt, darf daraus keine stumme Hörübung werden. */
function canSpeak(text){
  return koreanVoiceAvailable || hasRecording(text);
}
function makeListenExercise(item, pool, entryKind, phase, lessonId, idOverride){
  const id = idOverride || `${entryKind}:${lessonId || 'mixed'}:${item.kr}:listen`;
  const meta = { entryKind, lessonId: lessonId || null, term:item.kr, roman:item.roman, de:item.de, direction:'listen' };
  const fallback = entryKind === 'hangulword' ? getAllHangulWordsEver() : getAllVocabEver();
  const distractors = pickDistractorsWithFallback(pool, fallback, item.de, 'de', 3);
  return { phase, kind:'listen', id, title:'Hör zu – was bedeutet das?',
    listenText:item.kr, listenRoman:item.roman,
    options: shuffle([item.de, ...distractors]), correct: item.de, mistakeMeta: meta };
}
/* =========================================================
   INTERAKTIVE SILBENBAU-ÜBUNG ("build")
   Neue, wiederverwendbare Übungsform: statt nur Multiple-Choice zu
   beantworten, setzt man eine koreanische Silbe aktiv aus einzelnen
   Buchstaben-Kacheln zusammen (Anfangskonsonant + Vokal [+ optionaler
   Schlusskonsonant]) — genau die Fähigkeit, die zum "Wörter aus
   gelernten Buchstaben bauen" nötig ist. Ziel-Silbe wird per
   decomposeSyllable() automatisch zerlegt, Distraktor-Kacheln kommen
   aus dem Pool bereits gelernter Buchstaben gleichen Typs. */
function makeBuildExercise(targetChar, targetRoman, consonantPool, vowelPool, phase, lessonId, idOverride, title){
  const d = decomposeSyllable(targetChar);
  if(!d) return null;
  const finalParts = finalPartsOf(d);
  const needsFinal = finalParts.length > 0;
  const needsDoubleFinal = finalParts.length === 2; // 겹받침 (Doppel-Batchim)
  const notTense = c => c.ch !== 'ㄸ' && c.ch !== 'ㅃ' && c.ch !== 'ㅉ';
  const validFinalPool = consonantPool.filter(notTense);
  const consonantFallback = CONSONANTS.concat(DOUBLE_CONSONANTS);
  const vowelFallback = VOWELS.concat(DOUBLE_VOWELS);
  const validFinalFallback = consonantFallback.filter(notTense);
  // Mindestens 3 Distraktoren pro Kachel-Gruppe (= mind. 4 Kacheln zur
  // Auswahl), notfalls aufgefüllt aus dem vollen Buchstaben-Set — auch
  // ganz am Kursanfang, wenn erst 2–3 Buchstaben bekannt sind.
  const initialDistractors = pickDistractorsWithFallback(consonantPool, consonantFallback, d.initial, 'ch', 3);
  const medialDistractors = pickDistractorsWithFallback(vowelPool, vowelFallback, d.medial, 'ch', 3);
  // Bei 겹받침 (zwei Schlusskonsonanten-Kacheln) müssen BEIDE Teile von den
  // Distraktoren ausgeschlossen werden, s. finalPartsOf()/pickMultiExcludeDistractors.
  const finalDistractors = needsFinal ? pickMultiExcludeDistractors(validFinalPool, validFinalFallback, finalParts, 3) : [];
  const consonantTiles = shuffle(Array.from(new Set(
    [d.initial, ...initialDistractors].concat(needsFinal ? [...finalParts, ...finalDistractors] : [])
  )));
  const vowelTiles = shuffle(Array.from(new Set([d.medial, ...medialDistractors])));
  const id = idOverride || `syllable:${lessonId || 'mixed'}:${targetChar}:build`;
  const meta = { entryKind:'syllable', lessonId: lessonId || null, term:targetChar, roman:targetRoman || '', de:'', direction:'build' };
  return {
    phase, kind:'build', id,
    title: title || 'Baue die Silbe',
    prompt: targetRoman || '', sub:'', promptIsKr:false,
    needsFinal, needsDoubleFinal, consonantTiles, vowelTiles,
    correct: targetChar, mistakeMeta: meta
  };
}
/* Hilfsfunktion für makeBuildWordExercise: wählt bis zu "n" Distraktoren,
   die NICHT in "excludeChars" enthalten sind — zuerst aus "pool" (bereits
   gelernte Buchstaben), bei Bedarf aufgefüllt aus "fallbackPool" (voller
   Buchstabensatz). Anders als pickDistractorsWithFallback (die genau EINEN
   "korrekten" Wert ausschließt) muss hier eine ganze Menge an bereits im
   Zielwort benötigten Buchstaben ausgeschlossen werden. */
function pickMultiExcludeDistractors(pool, fallbackPool, excludeChars, n){
  const exclude = new Set(excludeChars);
  let picked = shuffle(pool.filter(l => !exclude.has(l.ch))).slice(0, n).map(l => l.ch);
  if(picked.length < n && fallbackPool){
    const have = new Set([...exclude, ...picked]);
    const extra = shuffle(fallbackPool.filter(l => !have.has(l.ch))).slice(0, n - picked.length);
    picked = picked.concat(extra.map(l => l.ch));
  }
  return picked;
}
/* =========================================================
   INTERAKTIVE WORTBAU-ÜBUNG ("buildword")
   Erweitert die Silbenbau-Übung (makeBuildExercise, s. o.) auf ganze,
   mehrsilbige Wörter: ausgehend NUR von der lateinischen Umschrift baut
   man das Wort Silbe für Silbe aus einzelnen Buchstaben-Kacheln nach.
   Der entscheidende neue Teil gegenüber der einzelnen Silbenbau-Übung:
   pro Silbe muss man selbst festlegen, ob sie einen Doppel-Kontainer
   (Anfangskonsonant + Vokal) oder einen Tri-Kontainer (zusätzlich
   Schlusskonsonant/받침) braucht — die Übung gibt das NICHT automatisch
   vor. Die Silben werden in der vorgegebenen (korrekten) Reihenfolge des
   Wortes nebeneinander aufgebaut. Jede vorkomponierte Hangul-Silbe im
   Zielwort ist bereits ein eigener Unicode-Block, deshalb reicht
   word.kr.split('') plus decomposeSyllable() zur Zerlegung — eine eigene
   "syllables"-Liste mit Umschrift pro Silbe wird dafür nicht gebraucht. */
/* true, wenn JEDE Silbe des Wortes nur aus Anfangskonsonant+Vokal besteht
   (kein Schlusskonsonant/받침 nötig) — solche Wörter dürfen als
   Wortbau-Übung schon VOR "Zwei oder drei Blöcke?" auftauchen, weil dabei
   nie die (dort erst erklärte) Doppel-/Tri-Kontainer-Entscheidung
   abgefragt wird, s. buildHangulApplyExercises. */
function wordHasOnlyTwoBlockSyllables(word){
  const decomposed = word.kr.split('').map(decomposeSyllable);
  if(decomposed.some(d => !d)) return false;
  return decomposed.every(d => !d.final);
}
function makeBuildWordExercise(word, consonantPool, vowelPool, phase, lessonId, idOverride, title){
  const chars = word.kr.split('');
  if(chars.length < 2) return null; // einzelne Silben: siehe makeBuildExercise
  const decomposed = chars.map(decomposeSyllable);
  if(decomposed.some(d => !d)) return null;
  const consonantFallback = CONSONANTS.concat(DOUBLE_CONSONANTS);
  const vowelFallback = VOWELS.concat(DOUBLE_VOWELS);
  // Bei 겹받침 (z. B. ㄶ in 찮) liefert finalPartsOf() die zwei bereits
  // bekannten Einzelbuchstaben (ㄴ, ㅎ) statt des nie unterrichteten
  // Kombi-Zeichens — dadurch braucht diese Silbe automatisch 4 statt 3
  // Blöcke in der Wortbau-Übung (s. renderBuildWordStep).
  const neededConsonants = Array.from(new Set(decomposed.flatMap(d => [d.initial, ...finalPartsOf(d)]).filter(Boolean)));
  const neededVowels = Array.from(new Set(decomposed.map(d => d.medial)));
  const consonantDistractors = pickMultiExcludeDistractors(consonantPool, consonantFallback, neededConsonants, 3);
  const vowelDistractors = pickMultiExcludeDistractors(vowelPool, vowelFallback, neededVowels, 2);
  const consonantTiles = shuffle(neededConsonants.concat(consonantDistractors));
  const vowelTiles = shuffle(neededVowels.concat(vowelDistractors));
  const id = idOverride || `buildword:${lessonId || 'mixed'}:${word.kr}:build`;
  const meta = { entryKind:'buildword', lessonId: lessonId || null, term:word.kr, roman:word.roman || '', de:word.de || '', direction:'build' };
  return {
    phase, kind:'buildword', id,
    title: title || 'Baue das Wort',
    prompt: word.roman || '', sub: word.de || '', promptIsKr:false,
    syllableCount: chars.length, consonantTiles, vowelTiles,
    correct: word.kr, mistakeMeta: meta
  };
}
/* Umgekehrte Richtung zur Wortbau-Übung: statt aus der Umschrift Hangul zu
   bauen, bekommt man hier ein (mehrsilbiges) Wort in Hangul vorgelegt und
   tippt die lateinische Umschrift. Nutzt bewusst den bereits vorhandenen
   "type"-Übungstyp (freier Texteingabe-Vergleich, s. renderExercise/
   handleCheck) statt eines eigenen Kachel-UIs — hier reicht das, weil die
   Antwort ein einzelnes, eindeutiges Umschrift-Wort ist. */
function makeRomanizeWordExercise(word, phase, lessonId, idOverride, title){
  if(!word.kr || word.kr.length < 2 || !word.roman) return null; // einzelne Silben: siehe makeHangulWordMcExercise
  const id = idOverride || `buildword:${lessonId || 'mixed'}:${word.kr}:romanize`;
  const meta = { entryKind:'buildword', lessonId: lessonId || null, term:word.kr, roman:word.roman || '', de:word.de || '', direction:'romanize' };
  return {
    phase, kind:'type', id,
    title: title || 'Tippe die Umschrift',
    prompt: word.kr, sub:'', promptIsKr:true,
    correct: word.roman, mistakeMeta: meta
  };
}
/* =========================================================
   KUMULATIVE POOLS FÜR HANGUL-LEKTIONEN
   - "Cumulative" (nach COURSE-Reihenfolge): für die Übungs-Generierung
     EINER Lektion — schließt deren eigene neue Buchstaben/Wörter ein,
     unabhängig vom Abschluss-Status (man hat sie ja gerade gelernt).
   - "Learned" (nach tatsächlichem Fortschritt): für den Fehlertrainer —
     nur Inhalte aus wirklich abgeschlossenen Lektionen.
========================================================= */
function getCumulativeHangulLetters(lesson){
  const idx = COURSE.indexOf(lesson);
  let pool = [];
  for(let i=0;i<=idx;i++){
    // 'hangul'-Lektionen führen normalerweise neue Buchstaben ein — manche
    // 'concept'-Lektionen (z. B. "Das stumme ㅇ") ausnahmsweise auch.
    if((COURSE[i].type === 'hangul' || COURSE[i].type === 'concept') && COURSE[i].letters) pool = pool.concat(COURSE[i].letters);
  }
  return pool;
}
function getCumulativeHangulWords(lesson){
  const idx = COURSE.indexOf(lesson);
  let pool = [];
  for(let i=0;i<=idx;i++){
    if(COURSE[i].type === 'hangul' && COURSE[i].words) pool = pool.concat(COURSE[i].words);
  }
  return pool;
}
function getLearnedHangulLetters(){
  const pool = [];
  COURSE.forEach(l => { if((l.type === 'hangul' || l.type === 'concept') && l.letters && completed.has(l.id)) pool.push(...l.letters); });
  return pool;
}
function getLearnedHangulWords(){
  const pool = [];
  COURSE.forEach(l => { if(l.type === 'hangul' && l.words && completed.has(l.id)) pool.push(...l.words); });
  return pool;
}
/* Beispiel-Silben aus bereits abgeschlossenen "Konzept"-Lektionen (z. B.
   stummes ㅇ, 2-vs-3-Blöcke) — dienen dem Hangul-Trainer, damit er nicht
   nur einzelne Buchstaben, sondern auch die gelernten Kombinationsregeln
   zufällig abfragen kann. */
function getLearnedConceptExamples(){
  const examples = [];
  COURSE.forEach(l => {
    if(l.type === 'concept' && l.concept && l.concept.examples && completed.has(l.id)){
      l.concept.examples.forEach(e => examples.push({ kr:e.kr, roman:e.roman, lessonId:l.id }));
    }
  });
  return examples;
}
/* =========================================================
   FEHLERLISTE (Fehlertrainer)
   Jede falsch beantwortete Abfrage wird hier (dedupliziert) abgelegt.
   Erst eine richtige Antwort IM FEHLERTRAINER entfernt sie wieder.
========================================================= */
/* Dedup-Schlüssel bewusst OHNE "direction": Ein Vokabel-/Hangul-Wort wird
   pro Lektion sowohl term-to-meaning als auch meaning-to-term abgefragt
   (zwei separate Übungsschritte). Würde "direction" mit in den Schlüssel
   einfließen, könnte dasselbe Wort bei Fehlern in beiden Richtungen ZWEI
   Einträge im Fehlertrainer erzeugen, obwohl es sich fachlich um dieselbe
   Vokabel handelt (Feedback vom 16.08.2026: "gleiche Fehler sollen nur
   einmal auftauchen"). Bei cloze/sentence/grammar ist "term" ohnehin
   bereits pro Übung eindeutig (Satzinhalt bzw. Beispielsatz), da bleibt
   die Zusammenfassung folgenlos richtig. Die erste falsch beantwortete
   Richtung "gewinnt" und wird im Fehlertrainer erneut abgefragt. */
function recordMistake(meta){
  if(!meta) return;
  const id = `${meta.entryKind}:${meta.lessonId || 'mixed'}:${meta.term}`;
  const existing = mistakes.find(m => m.id === id);
  if(existing){
    // Erneut falsch: der bisher gesammelte Fortschritt in Richtung
    // "wieder aus der Liste raus" verfällt komplett.
    existing.correctStreak = 0;
    existing.lastCorrectSession = null;
    saveState();
    updatePracticeIndicator();
    return;
  }
  mistakes.push({ id, ...meta, correctStreak: 0, lastCorrectSession: null });
  saveState();
  updatePracticeIndicator();
}
function clearMistake(id){
  const before = mistakes.length;
  mistakes = mistakes.filter(m => m.id !== id);
  if(mistakes.length !== before){ saveState(); updatePracticeIndicator(); }
}
/* Wie viele richtige Antworten nötig sind, damit ein Fehler wieder aus
   der Liste verschwindet (Feedback vom 24.08.2026). Vorher genügte EINE
   richtige Antwort — die kam aber unmittelbar nachdem die Lösung gerade
   eingeblendet worden war und beweist daher kaum, dass der Inhalt sitzt.
   Jetzt sind zwei nötig, und die zweite zählt frühestens in einer
   SPÄTEREN Sitzung: innerhalb derselben Sitzung dieselbe Frage zweimal
   richtig zu beantworten (etwa weil sie zweimal gezogen wurde) reicht
   also bewusst nicht. */
const MISTAKE_CLEAR_STREAK = 2;
function registerMistakeSuccess(id){
  const m = mistakes.find(x => x.id === id);
  if(!m) return;
  if(m.lastCorrectSession && m.lastCorrectSession === currentSessionId) return;
  m.correctStreak = (m.correctStreak || 0) + 1;
  m.lastCorrectSession = currentSessionId;
  if(m.correctStreak >= MISTAKE_CLEAR_STREAK){
    clearMistake(id);
    return;
  }
  saveState();
  updatePracticeIndicator();
}
/* Billige Fassung von getDuePracticeExercises() für die reine Anzeige:
   baut KEINE Übungsobjekte, sondern setzt die Mastery-Schlüssel direkt
   zusammen und schlägt sie im Gedächtnis nach. Nötig, weil der Indikator
   nach jeder einzelnen Antwort aktualisiert wird — den vollen Übungsvorrat
   dafür jedes Mal neu zu erzeugen (mehrere hundert Objekte samt Auswahl
   der Ablenker) wäre unverhältnismäßig teuer. Die Schlüssel folgen exakt
   demselben Muster wie in buildPracticeExercisePool, damit Indikator und
   die Zahl „heute fällig" in der Übersicht nicht auseinanderlaufen. */
function hasDuePracticeItems(){
  const withListen = listenExercisesAvailable();
  const anyDue = (entryKind, item) =>
    isDueForReview(`${entryKind}:${item.kr}:term-to-meaning`) ||
    isDueForReview(`${entryKind}:${item.kr}:meaning-to-term`) ||
    (withListen && isDueForReview(`${entryKind}:${item.kr}:listen`));
  return getLearnedVocabPool().some(v => anyDue('vocab', v))
    || getLearnedHangulWords().some(w => anyDue('hangulword', w));
}
/* Markiert den "Üben"-Reiter, solange dort etwas auf einen wartet
   (Feedback vom 24.08.2026). Zwei Anlässe, bewusst gleichwertig
   behandelt: offene Fehler UND heute fällige Wiederholungen — beides
   heißt „hier liegt Arbeit für heute". Vorher stand an der Stelle eine
   rote Fehlerzahl; die wuchs mit jedem Fehler und las sich wie eine
   Mahnung. Jetzt pulsiert stattdessen das Feld hinter Symbol und
   Beschriftung blütenrosé (s. .nav-btn.needs-practice). Die konkreten
   Zahlen stehen im title-Attribut und ausführlich im Üben-Reiter selbst. */
function updatePracticeIndicator(){
  const btn = $('navPracticeBtn');
  if(!btn) return;
  const open = mistakes.length;
  const due = hasDuePracticeItems();
  btn.classList.toggle('needs-practice', open > 0 || due);
  const parts = [];
  if(open > 0) parts.push(`${open} offene ${open === 1 ? 'Frage' : 'Fragen'} im Fehlertrainer`);
  if(due) parts.push('Wiederholungen für heute fällig');
  btn.title = parts.join(' · ');
}
/* =========================================================
   SCHRITT-GENERIERUNG (intro -> reinforce -> apply)
========================================================= */
/* Getippte deutsche Übersetzung zu einer Vokabel (kind:'type'). Eigene
   Funktion (statt wie bisher inline in buildVocabApplyExercises), damit
   sie auch von den Wiederholungslektionen wiederverwendet werden kann
   (s. buildReviewApplyExercises, Feedback vom 22.08.2026). */
function makeVocabTypeExercise(v, lessonId, idOverride){
  const id = idOverride || `vocab:${lessonId || 'mixed'}:${v.kr}:term-to-meaning`;
  return {
    phase:'apply', kind:'type', id,
    // "accept" (optional, s. acceptableAnswers): zusätzliche gleichwertige
    // Schreibweisen der Übersetzung — bei Zahlen z. B. die reine Ziffer.
    title:'Tippe die deutsche Übersetzung', prompt:v.kr, sub:v.roman, promptIsKr:true, correct: v.de, accept: v.accept || null,
    mistakeMeta: { entryKind:'vocab', lessonId: lessonId || null, term:v.kr, roman:v.roman, de:v.de, direction:'term-to-meaning' }
  };
}
/* Baut die VOLLSTÄNDIGE Liste der Übungs-Fragen einer Vokabel-Lektion auf
   (ohne Zufalls-Kürzung). Wird sowohl für die eigentliche Lektion (dort
   ggf. auf 16 gekürzt) als auch für die Fortschritts-Zählung ("Fragen
   pro Einheit") verwendet — Letztere braucht die ungekürzte Gesamtzahl. */
function buildVocabApplyExercises(lesson){
  const vocab = lesson.vocab;
  const applyExs = [];
  // Alle Buchstaben sind längst bekannt, sobald überhaupt eine Vokabel-
  // Einheit erreichbar ist (die Hangul-Einheit inkl. "Zwei oder drei Blöcke?" muss
  // vollständig gemeistert sein, bevor Einheit „Begrüßungen“ freigeschaltet wird) —
  // deshalb hier (anders als bei buildHangulApplyExercises) das VOLLE
  // Buchstaben-Set als Kachel-Pool statt eines kumulativen Teil-Pools.
  const allConsonants = CONSONANTS.concat(DOUBLE_CONSONANTS);
  const allVowels = VOWELS.concat(DOUBLE_VOWELS);
  vocab.forEach((v, i) => {
    applyExs.push(makeVocabMcExercise(v, vocab, 'term-to-meaning', 'apply', lesson.id));
    applyExs.push(makeVocabMcExercise(v, vocab, 'meaning-to-term', 'apply', lesson.id));
    if(i < 3){
      applyExs.push(makeVocabTypeExercise(v, lesson.id));
    }
    // Neu: jedes Vokabelwort bekommt zusätzlich eine Silben-/Wortbau-
    // Übung (Latein -> Hangul, per Buchstaben-Kacheln inkl. Blockanzahl-
    // Entscheidung bei mehrsilbigen Wörtern) sowie die umgekehrte
    // Umschrift-Übung (Hangul -> Latein per Tastatureingabe).
    const kr = v.kr || '';
    const isClean = kr.length > 0 && !/\s/.test(kr); // reine Wörter ohne Leerzeichen
    if(isClean && kr.length >= 2){
      const buildWordEx = makeBuildWordExercise(v, allConsonants, allVowels, 'apply', lesson.id, null, `Baue das Wort „${v.roman}"`);
      if(buildWordEx) applyExs.push(buildWordEx);
    } else if(isClean && kr.length === 1){
      const buildEx = makeBuildExercise(kr, v.roman, allConsonants, allVowels, 'apply', lesson.id, null, `Baue die Silbe „${v.roman}"`);
      if(buildEx) applyExs.push(buildEx);
    }
    // Die Umschrift-Übung braucht kein Block-UI und funktioniert deshalb
    // auch bei mehrteiligen Redewendungen mit Leerzeichen (z. B.
    // "안녕히 가세요") — nur bei einzelnen Silben lässt makeRomanizeWordExercise
    // bewusst aus (siehe dortiger Kommentar).
    const romanizeEx = makeRomanizeWordExercise(v, 'apply', lesson.id);
    if(romanizeEx) applyExs.push(romanizeEx);
  });
  // Optionale Bonus-Übungen: Lückentext-/Satzbau-Vorlagen, die die Lektion
  // über "templateIds" deklariert (s. TEMPLATES/buildTemplateApplyExercises
  // weiter unten) — ersetzt das frühere feste "sentenceExamples"-Feld.
  applyExs.push(...buildTemplateApplyExercises(lesson));
  return applyExs;
}
function buildVocabSteps(lesson){
  const vocab = lesson.vocab;
  const steps = [];
  vocab.forEach(v => {
    steps.push({ phase:'intro', kind:'info', direction:'kr-first',
      kr:v.kr, roman:v.roman, de:v.de, ctx:v.ctx || '', sageuk:v.sageuk || null, isHangul:false,
      breakdown:v.breakdown || null });
  });
  steps.push({ phase:'reinforce', kind:'recap', items: shuffle(vocab), isHangul:false });
  const applyExs = buildVocabApplyExercises(lesson);
  // "type"-Übungen gibt es hier zweierlei: deutsche Übersetzung tippen UND
  // (neu) Umschrift tippen (romanize) — pickWithKindCoverage soll beide
  // als eigene Kategorien behandeln, statt nur zufällig eine der beiden zu
  // wählen, sonst würde die neue Umschrift-Übung leicht untergehen.
  const coverageKey = ex => (ex.kind === 'type' && ex.mistakeMeta && ex.mistakeMeta.direction === 'romanize') ? 'type-romanize' : ex.kind;
  steps.push(...pickSessionExercises(applyExs, 16, coverageKey));
  return steps;
}
/* Wählt bis zu "cap" Übungen für EINE Sitzung aus einem größeren Pool aus
   und bevorzugt dabei IMMER noch nicht gemeisterte Fragen (s.
   masteredQuestions/masteryKeyFor) vor bereits gemeisterten. Ohne das
   konnte eine rein zufällige Auswahl (pickWithKindCoverage allein) bei
   Lektionen mit mehr Fragen als Sitzungs-Obergrenze (z. B. 21 Fragen bei
   Kappung auf 16) durch Pech IMMER wieder dieselbe offene Frage auslassen,
   obwohl alles andere schon richtig beantwortet wurde — der Fortschritts-
   zähler (X/Y neben der Lektion) blieb dann auch bei perfekten
   Durchläufen dauerhaft unter 100% hängen (Feedback vom 16.08.2026,
   Lektion "Ich, Du, Wir": 20/21 trotz zweimal alles richtig). Reichen die
   offenen Fragen allein schon für die Sitzung, werden ausschließlich sie
   gezeigt (weiterhin mit Kind-Coverage); reichen sie nicht, füllen
   bereits gemeisterte Fragen als Wiederholung auf. So ist nach spätestens
   ceil(Gesamtzahl / cap) fehlerfreien Durchläufen garantiert 100%
   erreicht, statt nur zufällig irgendwann. */
function pickSessionExercises(applyExs, cap, coverageKey){
  if(applyExs.length <= cap) return shuffle(applyExs);
  const isOpen = ex => { const k = masteryKeyFor(ex); return !k || !masteredQuestions.has(k); };
  const open = applyExs.filter(isOpen);
  const done = applyExs.filter(ex => !isOpen(ex));
  if(open.length >= cap) return pickWithKindCoverage(open, cap, coverageKey);
  // Aufgefüllt wird mit bereits gemeisterten Fragen — und zwar bevorzugt
  // mit den laut Gedächtnis-Modell FÄLLIGEN (Feedback vom 24.08.2026).
  // Vorher war die Auffüllung reiner Zufall; jetzt landet zuerst der
  // Stoff in der Sitzung, der gerade am ehesten vergessen wird.
  const dueDone = done.filter(ex => isDue(masteryKeyFor(ex)));
  const restDone = done.filter(ex => !isDue(masteryKeyFor(ex)));
  const need = cap - open.length;
  const fillFromDone = dueDone.length >= need
    ? pickWithKindCoverage(dueDone, need, coverageKey)
    : shuffle(dueDone).concat(pickWithKindCoverage(restDone, need - dueDone.length, coverageKey));
  return shuffle(open.concat(fillFromDone.slice(0, need)));
}
/* Analog zu buildVocabApplyExercises: die vollständige, ungekürzte Liste
   der Übungs-Fragen einer Hangul-Lektion (Buchstaben-MC, Wort-MC,
   Silbenbau). Hier wird ohnehin nicht gekürzt, die Funktion dient primär
   der Wiederverwendung für die Fortschritts-Zählung. */
function buildHangulApplyExercises(lesson){
  const letters = lesson.letters;
  const words = lesson.words || [];
  const cumulative = getCumulativeHangulLetters(lesson);
  const cumulativeConsonants = cumulative.filter(l => l.kind === 'consonant');
  const cumulativeVowels = cumulative.filter(l => l.kind === 'vowel');
  const cumulativeWords = getCumulativeHangulWords(lesson);
  const applyExs = [];
  letters.forEach(l => {
    const samKindPool = cumulative.filter(x => x.kind === l.kind);
    applyExs.push(makeHangulMcExercise(l, samKindPool, 'term-to-meaning', 'apply', lesson.id));
    applyExs.push(makeHangulMcExercise(l, samKindPool, 'meaning-to-term', 'apply', lesson.id));
  });
  words.forEach(w => {
    applyExs.push(makeHangulWordMcExercise(w, cumulativeWords, 'term-to-meaning', 'apply', lesson.id));
    applyExs.push(makeHangulWordMcExercise(w, cumulativeWords, 'meaning-to-term', 'apply', lesson.id));
    (w.syllables || []).forEach((syl, i) => {
      const ex = makeBuildExercise(syl.ch, syl.roman, cumulativeConsonants, cumulativeVowels, 'apply', lesson.id, null,
        `Baue Silbe ${i+1} von ${w.kr} (${w.de})`);
      if(ex) applyExs.push(ex);
    });
    // Ganze mehrsilbige Wörter bauen ist schon VOR "Zwei oder drei
    // Blöcke?" erlaubt — aber NUR für Wörter, deren Silben ausschließlich
    // aus Anfangskonsonant+Vokal bestehen (kein Schlusskonsonant/받침).
    // Sonst würde die Übung schon die Doppel-/Tri-Kontainer-Entscheidung
    // abfragen, bevor dieses Konzept überhaupt erklärt wurde (Prinzip:
    // erst einführen, dann abfragen). Wörter MIT 받침 (z. B. 딸기,
    // 짜장면, 병원) bekommen ihre Wortbau-Übung erst bei BATCHIM_LESSON
    // selbst bzw. später im freien Hangul-Training.
    if(wordHasOnlyTwoBlockSyllables(w)){
      const buildWordEx = makeBuildWordExercise(w, cumulativeConsonants, cumulativeVowels, 'apply', lesson.id, null, `Baue das Wort „${w.roman}"`);
      if(buildWordEx) applyExs.push(buildWordEx);
    }
    // Die Umschrift zu tippen braucht dagegen kein 받침-Konzeptwissen —
    // nur die schon in der Einführung gezeigte Aussprache — und ist daher
    // ab der ersten mehrsilbigen Wort-Lektion immer sicher möglich.
    const romanizeEx = makeRomanizeWordExercise(w, 'apply', lesson.id);
    if(romanizeEx) applyExs.push(romanizeEx);
  });
  return applyExs;
}
function buildHangulSteps(lesson){
  const letters = lesson.letters;
  const words = lesson.words || [];
  const steps = [];
  // Erst ALLE neuen Buchstaben einführen ...
  letters.forEach(l => {
    steps.push({ phase:'intro', kind:'info', direction:'kr-first',
      kr:l.ch, roman:l.roman, de:'', ctx:'', isHangul:true });
  });
  // ... danach das/die Wort(er), die sich daraus (und aus zuvor gelernten
  // Buchstaben) zusammensetzen lassen — z. B. "man lernt g, a, i, was dann
  // zu 'gagi' zusammengesetzt wird".
  words.forEach(w => {
    steps.push({ phase:'intro', kind:'info', direction:'kr-first',
      kr:w.kr, roman:w.roman, de:w.de, ctx:w.ctx || '', sageuk:w.sageuk || null, isHangul:false });
  });
  steps.push({ phase:'reinforce', kind:'recap', items: shuffle(letters.concat(words)), isHangul:true });
  const applyExs = buildHangulApplyExercises(lesson);
  steps.push(...shuffle(applyExs));
  return steps;
}
/* Aussprache-Regel-Übung (s. HANGUL_SOUND_CHANGE_LESSON): stellt die
   wörtliche Lesung (z. B. "알겠습니다") der tatsächlichen Aussprache (z. B.
   "알겟씀니다") als Multiple-Choice gegenüber — beide als Hangul-Text,
   damit man sie sich vorlesen lassen kann (speakBtnHtml). */
function makeSoundChangeMcExercise(entry, lessonId, idOverride){
  if(!entry.written || !entry.spoken) return null;
  const id = idOverride || `soundchange:${lessonId || 'mixed'}:${entry.written}`;
  const meta = { entryKind:'soundchange', lessonId: lessonId || null, term:entry.written, roman:entry.spokenRoman || '', de:entry.de || '', direction:'pronounce', literal:entry.written, spoken:entry.spoken };
  return {
    phase:'apply', kind:'mc', id,
    title:'Wie wird das wirklich ausgesprochen?', prompt:entry.written, sub:entry.writtenRoman, promptIsKr:true, optionsAreKr:true,
    options: shuffle([entry.spoken, entry.written]), correct: entry.spoken, mistakeMeta: meta
  };
}
/* Positions-Regel-Übung (s. HANGUL_POSITION_LESSON): zwei Umschriften
   einer Silbe zur Auswahl — die richtige und die naive, die den
   Konsonanten so überträgt, wie er am Silbenanfang klänge ("bab" statt
   "bap", "sar" statt "sal"). Genau diese Verwechslung soll die Lektion
   ausräumen, deshalb ist der Distraktor bewusst fest vorgegeben statt
   zufällig gezogen. Das "rule"-Feld landet als Begründung im
   Falsch-Feedback (generisches explain-Feld, s. handleCheck). */
function makeRomanChoiceMcExercise(entry, lessonId, idOverride){
  if(!entry.kr || !entry.correct || !entry.wrong) return null;
  const id = idOverride || `romanchoice:${lessonId || 'mixed'}:${entry.kr}`;
  const meta = { entryKind:'romanchoice', lessonId: lessonId || null, term:entry.kr,
    roman:entry.correct, de:entry.rule || '', direction:'roman-position',
    correctRoman:entry.correct, wrongRoman:entry.wrong };
  return {
    phase:'apply', kind:'mc', id,
    title:'Welche Umschrift stimmt?', prompt:entry.kr, sub:'', promptIsKr:true, optionsAreKr:false,
    options: shuffle([entry.correct, entry.wrong]), correct: entry.correct,
    explain: entry.rule || '', mistakeMeta: meta
  };
}
/* "Konzept"-Lektionen erklären in erster Linie eine Schreibregel (z. B.
   das stumme ㅇ). Manche (wie "Das stumme ㅇ") führen dabei ZUSÄTZLICH
   auch ein paar neue Buchstaben ein (lesson.letters) — z. B. weil die
   Regel erst mit diesen Buchstaben sinnvoll erklärt werden kann. In dem
   Fall gilt dasselbe Prinzip wie bei normalen Hangul-Lektionen: erst die
   rohen Zeichen kennenlernen, DANN die Regel, die ihr Verhalten
   beschreibt — nie umgekehrt. */
function buildConceptApplyExercises(lesson){
  const c = lesson.concept;
  const cumulative = getCumulativeHangulLetters(lesson);
  const consonants = cumulative.filter(l => l.kind === 'consonant');
  const vowels = cumulative.filter(l => l.kind === 'vowel');
  const applyExs = [];
  if(lesson.letters){
    lesson.letters.forEach(l => {
      const sameKindPool = cumulative.filter(x => x.kind === l.kind);
      applyExs.push(makeHangulMcExercise(l, sameKindPool, 'term-to-meaning', 'apply', lesson.id));
      applyExs.push(makeHangulMcExercise(l, sameKindPool, 'meaning-to-term', 'apply', lesson.id));
    });
  }
  const hint = c.buildHint ? ` – ${c.buildHint}` : '';
  c.examples.forEach(e => {
    const ex = makeBuildExercise(e.kr, e.roman, consonants, vowels, 'apply', lesson.id, null, `Baue die Silbe „${e.roman}"${hint}`);
    if(ex) applyExs.push(ex);
  });
  // Ganze mehrsilbige Wörter nachbauen (siehe makeBuildWordExercise) —
  // aktuell nur bei "Zwei oder drei Blöcke?" (lesson.buildWordExamples),
  // direkt im Anschluss an die Regel, die diese Übung braucht. Dazu je
  // Wort auch die umgekehrte Richtung: Hangul lesen und die Umschrift
  // tippen (makeRomanizeWordExercise).
  if(lesson.buildWordExamples){
    const cumulativeWords = getCumulativeHangulWords(lesson);
    lesson.buildWordExamples.forEach(kr => {
      const w = cumulativeWords.find(x => x.kr === kr);
      if(!w) return;
      const buildEx = makeBuildWordExercise(w, consonants, vowels, 'apply', lesson.id, null, `Baue das Wort „${w.roman}"`);
      if(buildEx) applyExs.push(buildEx);
      const romanizeEx = makeRomanizeWordExercise(w, 'apply', lesson.id);
      if(romanizeEx) applyExs.push(romanizeEx);
    });
  }
  // Aussprache-Regeln (s. HANGUL_SOUND_CHANGE_LESSON): pro Beispiel eine
  // "wie klingt das wirklich?"-Multiple-Choice zwischen der wörtlichen
  // Lesung (falsch) und der tatsächlichen Aussprache (richtig).
  if(lesson.soundChangeExamples){
    lesson.soundChangeExamples.forEach(e => {
      const ex = makeSoundChangeMcExercise(e, lesson.id);
      if(ex) applyExs.push(ex);
    });
  }
  // Positions-Regel (s. HANGUL_POSITION_LESSON): "bap" oder "bab"?
  if(lesson.romanChoiceExamples){
    lesson.romanChoiceExamples.forEach(e => {
      const ex = makeRomanChoiceMcExercise(e, lesson.id);
      if(ex) applyExs.push(ex);
    });
  }
  return applyExs;
}
function buildConceptSteps(lesson){
  const c = lesson.concept;
  const steps = [];
  // Neue Buchstaben (falls vorhanden) IMMER zuerst, bevor die Regel
  // erklärt wird, die sie betrifft.
  if(lesson.letters){
    lesson.letters.forEach(l => {
      steps.push({ phase:'intro', kind:'info', direction:'kr-first',
        kr:l.ch, roman:l.roman, de:'', ctx:'', isHangul:true });
    });
  }
  // Anzeige-Beispiele für die Konzept-Karte + den Rückblick: normalerweise
  // c.examples (einzelne Silben, s. makeBuildExercise). Lektionen ohne
  // eigene Silben-Beispiele (z. B. HANGUL_SOUND_CHANGE_LESSON, deren
  // Beispiele mehrsilbige Wörter sind) zeigen stattdessen ihre
  // soundChangeExamples — dort die tatsächliche AUSSPRACHE, mit Badge.
  const displayExamples = (c.examples && c.examples.length) ? c.examples
    : (lesson.soundChangeExamples || []).map(e => ({ kr:e.spoken, roman:e.spokenRoman, de:e.de, badge:'gesprochen', badgeClass:'badge-polite' }));
  steps.push({ phase:'intro', kind:'concept', heading:c.heading, text:c.text, examples:displayExamples });

/* Satzbau-Übung ("sentence"): aus einem Wortpool (richtige Wörter +

function makeSentenceExercise(data, lessonId, idOverride, key){
  const { direction, promptText, promptRoman, correctTokens, pool, explain, poolRoman, poolGloss, templateId, variantKey } = data;
  if(!correctTokens || !correctTokens.length) return null;
  const term = key || correctTokens.join('_');
  const id = idOverride || `sentence:${lessonId || 'mixed'}:${term}:${direction}`;
  const correct = correctTokens.join(' ');
  const meta = { entryKind:'sentence', lessonId: lessonId || null, term, direction,
    promptText, promptRoman: promptRoman || '', correctTokens, pool, explain: explain || '',
    poolRoman: poolRoman || null, poolGloss: poolGloss || null,
    templateId: templateId || null, variantKey: variantKey || '' };

    phase:'apply', kind:'sentence', id,
    title: direction === 'de-kr' ? 'Baue den koreanischen Satz' : 'Baue den deutschen Satz',
    direction, promptText, promptRoman: promptRoman || '', promptIsKr: direction === 'kr-de',
    targetIsKr: direction === 'de-kr',
    correctTokens, correct, explain: explain || '', pool: shuffle(pool.slice()),
    poolRoman: poolRoman || null, poolGloss: poolGloss || null,
    mistakeMeta: meta

/* =========================================================

   Ersetzt die bisherigen festen "clozeExamples"/"sentenceExamples"-
   Datenfelder durch ein einheitliches System: jede Lektion trägt statt
   fertiger Satzdaten nur noch eine Liste von "templateIds". Jede Vorlage
   in TEMPLATES ist eine FORMEL (build-Funktion), die bei jedem Aufruf neu
   entscheidet, welcher konkrete Satz herauskommt — bei den "offenen"
   Vorlagen (role-*, country-origin-sentence, pronoun-topic-particle,
   who-is-that-sentence) durch zufälliges Ziehen aus einer kategorisierten

   bisherigen festen Bestand übernommenen) Vorlagen aus einer kleinen,
   geschlossenen Tabelle mit genau einer Zeile (closedTemplate) — dort

   Vielfalt (z. B. nur ein einziger bekannter Name "사라"), die Vorlage
   liefert aber trotzdem denselben Inhalt wie bisher, jetzt nur über
   denselben Mechanismus statt über ein zweites, paralleles System.
   Dieselbe Vorlage wird sowohl für die EIGENE Lektion (buildGrammar-/
   buildVocabApplyExercises, s. buildTemplateApplyExercises) als auch für
   spätere Wiederholungen genutzt (s. buildReviewApplyExercises) — bei
   jedem Lektions-/Wiederholungs-Aufbau wird sie neu instanziiert, liefert
   bei den offenen Vorlagen also potenziell jedes Mal einen anderen Satz.

   späterer Wiederverwendung) — getKnownCategoryItems zählt "bereits

/* "category" darf seit dem 25.08.2026 auch eine LISTE sein: ein Wort kann
   in mehreren Rollen auftauchen — 사과 ist sowohl etwas Zählbares

   먹어요). Genau solche Doppelrollen sind der Kern des Prinzips
   "bereits gelernten Wortschatz wiederverwenden". */
function hasCategory(item, category){
  if(!item || !item.category) return false;
  return Array.isArray(item.category) ? item.category.indexOf(category) !== -1 : item.category === category;
}
function getKnownCategoryItems(category, uptoLesson){
  const uptoIdx = COURSE.indexOf(uptoLesson);
  const items = [];
  for(let i = 0; i <= uptoIdx; i++){
    const l = COURSE[i];
    if((l.type === 'vocab' || l.type === 'grammar') && l.vocab){
      l.vocab.forEach(v => { if(hasCategory(v, category)) items.push(v); });
    }
    // Erweiterung vom 25.08.2026 (Einheiten 4/5): auch die Alltagswörter
    // der Hangul-Lektionen (Feld "words" statt "vocab", z. B. 사과, 배,
    // 빵) zählen als bereits gelehrter Wortschatz und dürfen deshalb in
    // offenen Vorlagen auftauchen — genau das verlangt das Prinzip
    // "Bereits gelernten Wortschatz in späteren Einheiten wiederverwenden"
    // (s. grammatik-konzept.md): die Zähleinheiten-Übungen der Einheit „Zahlen (nativ)“

    // neue, unverbundene Beispielwörter zu erfinden.

function instantiateTemplate(id, uptoLesson){
  const tpl = TEMPLATES[id];
