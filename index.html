<style>
  /* Alle Farben laufen über diese Variablen — für den "Joseon-Stil"
     (siehe Einstellungen) reicht es, sie unter body.theme-joseon neu
     zu definieren; die Standardwerte hier entsprechen exakt dem
     bisherigen (modernen) Layout. */
  :root{
    --green:#58cc02; --green-dark:#58a700; --blue:#1cb0f6; --blue-dark:#1899d6;
    --red:#ff4b4b; --red-dark:#ea2b2b; --yellow:#ffc800; --yellow-dark:#e0a800; --gray:#e5e5e5;
    --gray-dark:#afafaf; --text:#3c3c3c; --bg:#fff; --page-bg:#f7f7f7; --card-bg:#f7f7f7;
    --purple:#8b5cf6; --purple-dark:#6d28d9; --slate:#6b7280; --amber:#f59e0b;
    --streak-color:#ff9600; --xp-color:#ffab00;
    --info-bg:#f0f8ff; --option-hover-bg:#f0faff; --option-selected-bg:#ddf4ff;
    --correct-bg:#d7ffb8; --wrong-bg:#ffdfe0; --build-active-bg:#eaf9ff;
    --phase-intro-bg:#e5f8ff; --phase-reinforce-bg:#fff4d6; --phase-reinforce-text:#a66a00;
    --phase-apply-bg:#eaffd6; --phase-hangultrainer-bg:#f1e8ff; --phase-mistakes-bg:#ffe1e1;
    --overlay-bg:rgba(0,0,0,.5); --font-main:"Segoe UI", -apple-system, Roboto, Arial, sans-serif;
    /* Blütenrosé — Signalfarbe für „im Fehlertrainer liegt etwas bereit",
       abgestimmt auf die 🌸 in den Bannern. */
    --blossom-bg:#ffd7e6;
    /* Breite der Lesespalte. Auf dem Telefon füllt sie den Bildschirm,
       auf Tablets darf sie mitwachsen — aber nur so weit, dass Zeilen
       lesbar kurz bleiben (s. Medienabfragen weiter unten). */
    --app-w:480px;
  }
  *{box-sizing:border-box;}
  /* touch-action vererbt sich nicht. Der Browser rechnet zwar die
     Vorfahren mit ein, aber auf den Elementen, die tatsächlich getippt
     werden, steht die Absicht am richtigen Ort — und gilt auch dann,
     wenn eines davon später einmal in einem eigenen Bildlauf-Bereich
     landet. */
  button, label, summary, a, [role="button"]{ touch-action:manipulation;}
  :root{ color-scheme:light;}
  /* Zweite Absicherung zur color-scheme-Angabe im <head>: Formularelemente
     erben ihre Textfarbe NICHT vom Elternelement, sondern bekommen sie aus
     dem Browser-Standard (`buttontext`/`fieldtext`) — und der kippt im
     Systemdunkelmodus auf Weiß. Da unsere Hintergründe fest hell gesetzt
     sind, entstand dabei heller Text auf hellem Grund. Diese Regel bindet
     alle Bedienelemente an unsere eigene Textfarbe; jede spezifischere
     Klassenregel (z. B. .btn-primary mit color:#fff auf grünem Grund oder
     .sentence-token auf blauem Grund) überschreibt sie wie gewohnt, da ein
     Klassen-Selektor stärker wiegt als ein Element-Selektor. */
  button, input, select, textarea{ color:var(--text);}
  /* Textfelder brauchen zusätzlich einen eigenen Hintergrund: die Regel
     oben legt nur die Schriftfarbe fest, der Grund käme sonst weiterhin
     aus dem Browser-Standard (`field`) und wäre im Systemdunkelmodus
     dunkel — also dunkle Schrift auf dunklem Grund. Ankreuzfelder und
     Schalter sind bewusst ausgenommen, ihr Aussehen kommt aus eigenen
     Regeln (s. .switch). */
  input[type="text"], input[type="search"], input:not([type]), textarea, select{
    background:var(--bg);
  }
  body{
    /* Doppeltipp-Zoom abschalten, Aufziehen mit zwei Fingern behalten
       (Rückmeldung vom 26.08.2026: "beim schnellen Tippen auf Prüfen
       kann es passieren, dass man reinzoomt").

       Der Browser kann bei einem Fingertipp nicht sofort wissen, ob ein
       zweiter folgt. Er wartet deshalb rund 300 ms ab — und wertet zwei
       schnelle Tipps als "hineinzoomen". Beim zügigen Durchklicken von
       21 Übungen passiert das zwangsläufig.

       touch-action:manipulation sagt: Wischen und Aufziehen ja,
       Doppeltipp-Zoom nein. Das ist ausdrücklich NICHT die Rückkehr zu
       user-scalable=no — wer die Ansicht vergrößern will, kann das
       weiterhin mit zwei Fingern, und die Systemschriftgröße gilt
       ohnehin. Es verschwindet nur die Vergrößerung, die niemand
       wollte. */
    touch-action:manipulation;
    margin:0; font-family:var(--font-main);
    background:var(--page-bg); color:var(--text); display:flex; justify-content:center;
  }
  #app{ width:100%; max-width:var(--app-w); min-height:100vh; min-height:100dvh; background:var(--bg);
    display:flex; flex-direction:column; position:relative; box-shadow:0 0 24px rgba(0,0,0,.06);}
  /* ---- Header ---- */
  header{ position:sticky; top:0; background:var(--bg); z-index:5; border-bottom:2px solid var(--gray);}
  .header-row{ display:flex; align-items:center; justify-content:space-between;
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;}
  .gate-roof, .gate-frieze, .gate-rosettes, .gate-blossoms{ display:none;}
  /* Kopfzeile zeigt seit dem 24.08.2026 wieder eine Rückmeldung — aber
     nicht mehr die alte XP-/Diamanten-Zahl (die nur wuchs und nie etwas
     forderte), sondern ein TAGESZIEL als Ring plus die Streak-Flamme.
     Der Ring beantwortet die einzige Frage, die täglich zählt: "Bin ich
     für heute durch?". Die Herzen bleiben hier bewusst weg — sie gelten
     immer nur für die laufende Sitzung und werden dort in der
     Lektions-Kopfzeile angezeigt (.hearts-mini). */
  .header-stats{ display:flex; align-items:center; gap:14px;}
  .daily-goal{ position:relative; width:36px; height:36px;}
  .daily-goal svg{ width:36px; height:36px; transform:rotate(-90deg);}
  .daily-goal circle{ fill:none; stroke-width:4;}
  .ring-track{ stroke:var(--gray);}
  .ring-fill{ stroke:var(--green); stroke-linecap:round;
    stroke-dasharray:97.4; stroke-dashoffset:97.4; transition:stroke-dashoffset .35s ease;}
  .daily-goal.reached .ring-fill{ stroke:var(--yellow);}
  .daily-goal-text{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:0.625rem; font-weight:800; color:var(--text); font-variant-numeric:tabular-nums;}
  .daily-goal.reached .daily-goal-text{ font-size:0.875rem;}
  .stat{ display:flex; align-items:center; gap:4px; font-weight:800; font-size:0.9375rem;}
  .stat.streak{color:var(--streak-color);} .stat.gems{color:var(--blue);} .stat.hearts{color:var(--red);}
  .brand{font-weight:800; font-size:1.125rem; color:var(--green-dark); display:flex; gap:6px; align-items:center;}
  .brand-joseon-plaque{ display:none;}
  /* ---- Home / Übung / Fehler / Einstellungen (Top-Level-Screens) ---- */
  /* flex:1 (wie schon bei #lesson/.center-screen) sorgt dafür, dass jeder
     Screen mindestens die volle verbleibende #app-Höhe einnimmt — sonst
     wäre sein eigener (undurchsichtiger) Hintergrund bei kurzem Inhalt
     (z. B. "Bald verfügbar" auf der Grammatik-Seite) kürzer als der
     Viewport, und darunter würde im Joseon-Stil der eigentlich nur für
     #home gedachte Lernpfad-Hintergrund durchscheinen. */
  #home, #practice, #grammar, #settings, #dictionary{ padding:24px 16px 110px; display:flex; flex-direction:column; align-items:center; gap:0; flex:1;}
  /* Der Übungsbildschirm ist eine Folge gleichrangiger Blöcke — Wochen-
     rückblick, Stand, Trainer. Die sollen alle gleich weit auseinander-
     stehen. Solange jeder Block seinen eigenen Rand mitbrachte, taten
     sie das nicht: Die Wochenkarte hatte gar keinen und klebte am
     Banner „Dein Stand", während weiter unten 46px Luft standen
     (Rückmeldung vom 26.08.2026). Jetzt bestimmt der Bildschirm den
     Abstand, einmal für alle — die Ränder der einzelnen Blöcke werden
     dafür hier ausgeschaltet. Nur hier: Im Lernpfad haben dieselben
     Schriftrollen weiterhin ihren eigenen Rhythmus. */
  #practice{ gap:28px;}
  #practice > *{ margin-top:0; margin-bottom:0;}
  .unit-banner{ width:100%; background:var(--green); color:#fff; padding:14px 18px; border-radius:14px;
    margin-bottom:28px; font-weight:800; position:relative;}
  .unit-banner small{display:block; font-weight:500; opacity:.9; margin-top:2px;}
  .banner-text{ display:block; position:relative; z-index:2;}
  .banner-blossoms{ display:none;}
  /* Trennbanner zwischen Kurseinheiten im Lernpfad (z. B. "die Hangul-Einheit: Hangul") */
  .unit-section-banner{ background:var(--purple); margin-top:4px;}
  .unit-counter{ font-size:0.8125rem; font-weight:800; background:rgba(255,255,255,.25);
    padding:2px 10px; border-radius:10px; white-space:nowrap;}
  /* Vorkenntnis-Karte im Lernpfad (zwischen grünem Titel-Kasten und
     die Hangul-Einheit): volle Karte vor der Antwort, danach eine kleine
     ausgegraute Zusammenfassung im selben Format wie ein Einheiten-
     Banner. */
  .onboarding-card{ margin-bottom:20px;}
  .onboarding-summary{ background:var(--gray) !important; color:var(--gray-dark) !important;
    text-align:center; margin-top:4px; margin-bottom:20px;}
  /* ---- Trainer-Karten (Übungsbildschirm / Fehlertrainer) ---- */
  .trainer-card{ width:100%; background:var(--card-bg); border-radius:16px; padding:32px 22px; text-align:center;}
  .trainer-emoji{ font-size:3rem; margin-bottom:12px;}
  /* Dieselben Textstile gelten für den Inhalt einer Trainer-Schriftrolle
     (s. .scroll-trainer-body weiter unten) — dort sitzt derselbe Inhalt,
     nur ohne die flache Karte drumherum. */
  .trainer-card h3, .scroll-trainer-body h3{ margin:0 0 8px; font-size:1.125rem;}
  .trainer-card p, .scroll-trainer-body p{ margin:0; color:var(--gray-dark); font-size:0.875rem; line-height:1.4;}
  /* ---- Einstellungen ---- */
  .setting-row{ display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 0; border-bottom:1px solid var(--gray); flex-wrap:wrap;}
  .setting-row:last-child{ border-bottom:none;}
  .setting-row .setting-text{ flex:1 1 200px; min-width:0;}
  .segmented{ display:flex; border-radius:10px; overflow:hidden; border:2px solid var(--gray); flex-shrink:0;}
  /* Die Farbwelt hat vier Möglichkeiten — mehr, als neben den Text passen.
     Sie darf deshalb umbrechen und notfalls eine eigene Zeile bekommen. */
  #themeSegmented{ flex-shrink:1; flex-wrap:wrap;}
  #themeSegmented .segmented-btn{ padding:8px 10px;}
  .segmented-btn{ border:none; background:var(--bg); padding:8px 12px; font-size:0.8125rem; font-weight:700;
    color:var(--gray-dark); cursor:pointer;}
  .segmented-btn.active{ background:var(--green); color:#fff;}
  .setting-text h3{ margin:0 0 4px; font-size:0.9375rem;}
  .setting-text p{ margin:0; font-size:0.8125rem; color:var(--gray-dark); line-height:1.4;}
  .switch{ position:relative; display:inline-block; width:48px; height:28px; flex-shrink:0;}
  .switch input{ opacity:0; width:0; height:0;}
  .switch .slider{ position:absolute; inset:0; background:var(--gray); border-radius:28px; cursor:pointer; transition:.2s;}
  .switch .slider::before{ content:""; position:absolute; height:22px; width:22px; left:3px; bottom:3px;
    background:#fff; border-radius:50%; transition:.2s;}
  .switch input:checked + .slider{ background:var(--green);}
  .switch input:checked + .slider::before{ transform:translateX(20px);}
  /* ---- Aussprache-Button (nur sichtbar, wenn in den Einstellungen aktiviert) ---- */
  .prompt-kr-row{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
  .prompt-kr-row .prompt-kr{ margin-bottom:0;}
  .speak-btn{ background:none; border:none; font-size:1.25rem; line-height:1; cursor:pointer; padding:2px 4px;}
  .speak-btn:active{ transform:scale(0.9);}
  .recap-kr .speak-btn{ font-size:0.9375rem; vertical-align:middle; margin-left:2px; padding:0 2px;}
  /* ---- Wörterbuch ---- */
  .dict-group-title{ width:100%; font-weight:800; font-size:0.8125rem; color:var(--green-dark);
    text-transform:uppercase; letter-spacing:.5px; margin:20px 0 8px;}
  .dict-group-title:first-child{ margin-top:0;}
  .dict-entry{ width:100%; background:var(--card-bg); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
  .dict-main{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .dict-kr{ font-weight:800; font-size:1rem; display:flex; align-items:center; gap:2px;}
  .dict-de{ font-size:0.875rem; color:var(--text); text-align:right;}
  .dict-roman{ font-size:0.75rem; color:var(--gray-dark); font-style:italic; margin-top:2px;}
  .dict-sageuk{ margin-top:8px; padding-top:8px; border-top:1px dashed #c9a86a;
    font-family:Georgia,'Times New Roman',serif; color:#5a4425;}
  .dict-sageuk .label{ display:block; font-weight:800; font-size:0.625rem; text-transform:uppercase;
    letter-spacing:.5px; color:#8a6d3b; margin-bottom:3px;}
  .dict-sageuk .phrase{ display:flex; align-items:center; gap:6px; font-size:0.875rem; font-weight:700;}
  .dict-sageuk .roman{ display:block; font-size:0.75rem; font-style:italic; color:#8a6d3b; margin-top:1px;}
  .dict-sageuk .de{ display:block; font-size:0.8125rem; font-family:"Segoe UI", -apple-system, Roboto, Arial, sans-serif;
    color:#5a4425; margin-top:3px;}
  /* ---- Lesson / Trainer-Session-Screen (gemeinsam genutzt) ---- */
  #lesson{ display:none; flex-direction:column; flex:1; padding:16px; }
  .progress-bar{ height:14px; background:var(--gray); border-radius:8px; overflow:hidden; flex:1; margin:0 12px;}
  .progress-fill{ height:100%; background:var(--green); width:0%; transition:width .3s;}
  .lesson-top{ display:flex; align-items:center; }
  .close-btn{ background:none; border:none; font-size:1.375rem; color:var(--gray-dark); cursor:pointer;}
  .hearts-mini{ color:var(--red); font-weight:800; display:flex; align-items:center; gap:3px;}
  .exercise{ flex:1; display:flex; flex-direction:column; margin-top:24px;}
  .exercise h2{ font-size:1.25rem; margin:0 0 20px;}
  /* Phasen-Badge: macht den Lernschritt (Einführung/Wiederholung/Übung/Training) sichtbar */
  .phase-badge{ display:inline-block; align-self:flex-start; font-size:0.75rem; font-weight:800;
    text-transform:uppercase; letter-spacing:.5px; padding:5px 12px; border-radius:20px; margin-bottom:14px;}
  .phase-intro{ background:var(--phase-intro-bg); color:var(--blue-dark);}
  .phase-reinforce{ background:var(--phase-reinforce-bg); color:var(--phase-reinforce-text);}
  .phase-apply{ background:var(--phase-apply-bg); color:var(--green-dark);}
  .phase-practice{ background:var(--phase-intro-bg); color:var(--blue-dark);}
  .phase-due{ background:var(--phase-reinforce-bg); color:var(--phase-reinforce-text);}
  .phase-hangultrainer{ background:var(--phase-hangultrainer-bg); color:var(--purple-dark);}
  .phase-mistakes{ background:var(--phase-mistakes-bg); color:var(--red-dark);}
  .prompt-card{ background:var(--card-bg); border-radius:16px; padding:20px; text-align:center; margin-bottom:22px;}
  .prompt-kr{ font-size:clamp(20px,7vw,34px); font-weight:800; margin-bottom:6px; line-height:1.25; word-break:keep-all;}
  .prompt-roman{ font-size:0.875rem; color:var(--gray-dark); font-style:italic;}
  /* Info-Karten (Einführung / Wiederholung): zeigen Bedeutung + Kontext, keine Abfrage */
  .info-reveal{ text-align:center; font-size:1.0625rem; margin-bottom:10px;}
  .info-reveal strong{ color:var(--green-dark);}
  .info-context{ background:var(--info-bg); border-radius:12px; padding:12px 16px; font-size:0.875rem;
    color:var(--text); line-height:1.4; margin-top:6px;}
  /* Wort-Bausteine: rein informative Phrasen-Zerlegung (nie abgefragt),
     s. Kommentar in renderInfoStep. Bewusst zurückhaltend gestaltet, damit
     sie als Randnotiz wirkt und nicht wie eine weitere Pflichtinfo. */
  .info-breakdown{ text-align:center; font-size:0.8125rem; color:var(--gray-dark); margin:2px 0 8px; line-height:1.6;}
  .info-breakdown .breakdown-part{ font-weight:800; color:var(--text);}
  .info-breakdown .breakdown-meaning{ font-style:italic; margin-left:3px;}
  .info-breakdown .breakdown-plus{ margin:0 6px; opacity:.5;}
  /* Sageuk-Stil (Einstellung "Sageuk-Modus"): stimmungsvolle, an historische
     Dramen angelehnte Zusatzkarte — bewusst im Pergament-Look abgesetzt. */
  .info-sageuk{ background:#f3e9d2; border:1px solid #c9a86a; border-radius:12px; padding:12px 16px;
    margin-top:8px; font-family:Georgia,'Times New Roman',serif; color:#5a4425;}
  .info-sageuk .label{ display:block; font-weight:800; font-size:0.6875rem; text-transform:uppercase;
    letter-spacing:.5px; color:#8a6d3b; margin-bottom:4px;}
  .info-sageuk .phrase{ display:flex; align-items:center; justify-content:center; gap:6px;
    font-size:1.0625rem; font-weight:700; text-align:center;}
  .info-sageuk .roman{ display:block; text-align:center; font-size:0.8125rem; font-style:italic; color:#8a6d3b; margin-top:2px;}
  .info-sageuk .de{ display:block; text-align:center; font-size:0.875rem; font-family:"Segoe UI", -apple-system, Roboto, Arial, sans-serif;
    color:#5a4425; margin-top:6px; padding-top:6px; border-top:1px dashed #c9a86a;}
  /* Rückblick-Liste (Wiederholung auf Lektionsebene / Fehler-Vorschau) */
  .recap-hint{ color:var(--gray-dark); font-size:0.875rem; margin:-12px 0 16px;}
  .recap-list{ display:flex; flex-direction:column; gap:8px; max-height:52vh; overflow-y:auto; padding-right:2px;}
  .recap-row{ display:flex; justify-content:space-between; align-items:center; background:var(--card-bg);
    border-radius:12px; padding:10px 14px;}
  .recap-kr{ font-weight:800; font-size:1rem;}
  .recap-kr small{ display:block; font-weight:500; color:var(--gray-dark); font-size:0.75rem;}
  .recap-de{ font-weight:600; font-size:0.875rem; text-align:right; max-width:45%;}
  .options{ display:flex; flex-direction:column; gap:10px;}
  .option{ border:2px solid var(--gray); border-radius:14px; padding:14px 16px; background:var(--bg);
    font-size:1rem; font-weight:600; text-align:left; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .option .option-text{ flex:1; text-align:left;}
  .option .speak-btn{ flex-shrink:0;}
  .option:hover{ background:var(--option-hover-bg); border-color:var(--blue);}
  .option.selected{ border-color:var(--blue); background:var(--option-selected-bg);}
  .option.correct{ border-color:var(--green); background:var(--correct-bg); color:var(--green-dark);}
  .option.wrong{ border-color:var(--red); background:var(--wrong-bg); color:var(--red-dark);}
  /* Hintergrund und Schriftfarbe hier ausdrücklich setzen: ohne beides
     nimmt das Eingabefeld die Browser-Standardfarben (`field`/`fieldtext`),
     und die kippen im Systemdunkelmodus auf dunklen Grund — zusammen mit
     der jetzt fest dunklen Schrift (s. Regel bei button/input weiter oben)
     ergäbe das dunkel auf dunkel. Gilt für die Tipp-Übung UND das
     Suchfeld im Wörterbuch, die sich dieselbe Klasse teilen. */
  .type-input{ width:100%; font-size:1.125rem; padding:14px; border:2px solid var(--gray); border-radius:14px;
    outline:none; background:var(--bg); color:var(--text); font-family:inherit;}
  .type-input::placeholder{ color:var(--gray-dark); opacity:1;}
  .type-input:focus{ border-color:var(--blue);}
  /* Konzept-Karte (z. B. "Das stumme ㅇ") */
  .concept-text{ font-size:0.9375rem; line-height:1.5; color:var(--text); margin-bottom:16px; text-align:left;}
  /* Struktur-Elemente INNERHALB von Konzept-/Grammatik-Erklärtexten (Feedback
     vom 16.08.2026: lange Fließtexte sollen in Absätze, Nummerierungen und
     Bulletpoints gegliedert werden können, statt als ein einziger Block).
     Gilt für "concept-text" (Übungsschritt-Einführungskarte) ebenso wie für
     "grammar-card-intro" (Referenzansicht im Grammatik-Tab), da beide
     denselben HTML-fähigen Text (concept.text/grammar.intro) anzeigen. */
  .concept-text p, .grammar-card-intro p{ margin:0 0 10px;}
  .concept-text p:last-child, .grammar-card-intro p:last-child{ margin-bottom:0;}
  .concept-text ol, .concept-text ul, .grammar-card-intro ol, .grammar-card-intro ul{
    margin:0 0 10px; padding-left:22px; display:flex; flex-direction:column; gap:6px;}
  .concept-text ol:last-child, .concept-text ul:last-child,
  .grammar-card-intro ol:last-child, .grammar-card-intro ul:last-child{ margin-bottom:0;}
  .concept-text li, .grammar-card-intro li{ line-height:1.5;}
  .concept-text li > ul, .concept-text li > ol,
  .grammar-card-intro li > ul, .grammar-card-intro li > ol{ margin-top:6px; margin-bottom:0;}
  .grammar-card-intro{ font-size:0.875rem; line-height:1.5; color:var(--text); margin-bottom:12px; text-align:left;}
  .concept-examples{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  .concept-example-row{ background:var(--info-bg); border-radius:12px; padding:10px 16px; display:flex;
    flex-direction:column; align-items:center; gap:2px; min-width:64px;}
  .concept-example-kr{ font-size:1.375rem; font-weight:800; display:flex; align-items:center; gap:4px;}
  .concept-example-roman{ font-size:0.75rem; color:var(--gray-dark); font-style:italic;}
  /* Höflichkeitsregister-Badge (s. Grammatik-Lektionen, z. B. "격식체"/"해요체") */
  .concept-example-badge{ margin-top:2px; padding:2px 8px; border-radius:20px; font-size:0.5625rem; font-weight:800;
    text-transform:uppercase; letter-spacing:.02em; white-space:nowrap;}
  .concept-example-badge.badge-formal{ background:#fde2e2; color:#b3261e;}
  .concept-example-badge.badge-polite{ background:#dcefe0; color:#1e7a3c;}
  /* Silbenbau-Übung ("build"): Kacheln zu einer Ziel-Silbe zusammensetzen */
  .build-slots{ display:flex; justify-content:center; gap:10px; margin-bottom:10px;}
  .build-slot{ width:52px; height:52px; border:2px dashed var(--gray-dark); border-radius:12px;
    background:var(--bg); font-size:1.5rem; font-weight:800; cursor:pointer; color:var(--text);}
  .build-slot.active{ border-color:var(--blue); border-style:solid; background:var(--build-active-bg);}
  .build-slot.filled{ border-style:solid; border-color:var(--gray-dark);}
  .build-slot:disabled{ cursor:not-allowed;}
  .build-preview{ text-align:center; font-size:2.75rem; font-weight:800; min-height:60px;
    display:flex; align-items:center; justify-content:center; color:var(--green-dark); margin-bottom:6px;}
  .build-preview.correct{ color:var(--green-dark);}
  .build-preview.wrong{ color:var(--red-dark);}
  .build-reset-btn{ display:block; margin:0 auto 20px; background:none; border:none;
    color:var(--blue-dark); font-weight:700; font-size:0.8125rem; cursor:pointer; text-decoration:underline;}
  .build-palette-group{ margin-bottom:14px;}
  .build-palette-label{ font-size:0.75rem; font-weight:800; text-transform:uppercase; letter-spacing:.5px;
    color:var(--gray-dark); margin-bottom:8px;}
  .build-tiles{ display:flex; flex-wrap:wrap; gap:8px;}
  .build-tile{ min-width:48px; height:48px; padding:0 12px; border:2px solid var(--gray); border-radius:12px;
    background:var(--bg); font-size:1.25rem; font-weight:700; cursor:pointer;}
  .build-tile:hover:not(:disabled){ border-color:var(--blue); background:var(--option-hover-bg);}
  .build-tile:disabled{ opacity:.5; cursor:not-allowed;}
  /* Wortbau-Übung ("buildword"): mehrsilbige Wörter aus der Umschrift
     nachbauen, pro Silbe inkl. Entscheidung Doppel- vs. Tri-Kontainer. */
  .buildword-syllables{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:16px;}
  .buildword-syllable{ display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:10px 8px 8px; border:2px solid var(--gray); border-radius:14px; background:var(--bg); min-width:80px;}
  .buildword-syllable-num{ font-size:0.625rem; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--gray-dark);}
  .buildword-block-toggle{ display:flex; flex-wrap:wrap; gap:4px; justify-content:center;}
  .buildword-block-btn{ padding:3px 6px; border:1px solid var(--gray-dark); border-radius:8px;
    background:var(--bg); font-size:0.625rem; font-weight:700; cursor:pointer; color:var(--text);}
  .buildword-block-btn.active{ background:var(--blue); border-color:var(--blue); color:#fff;}
  .buildword-block-btn:disabled{ cursor:not-allowed; opacity:.6;}
  .buildword-slots{ display:flex; gap:5px;}
  .buildword-slot{ width:36px; height:36px; border:2px dashed var(--gray-dark); border-radius:10px;
    background:var(--bg); font-size:1rem; font-weight:800; cursor:pointer; color:var(--text);}
  .buildword-slot.active{ border-color:var(--blue); border-style:solid; background:var(--build-active-bg);}
  .buildword-slot.filled{ border-style:solid; border-color:var(--gray-dark);}
  .buildword-slot:disabled{ cursor:not-allowed;}
  .buildword-preview{ font-size:1.5rem; font-weight:800; min-height:30px;
    display:flex; align-items:center; justify-content:center; color:var(--gray-dark);}
  .buildword-preview.correct{ color:var(--green-dark);}
  .buildword-preview.wrong{ color:var(--red-dark);}
  /* Lückentext-Übung ("cloze"): ein Satz mit genau einer Lücke, die aus
     einem Wortpool (Chips, s. .build-tile) gefüllt wird. */
  .cloze-context{ font-size:0.8125rem; color:var(--gray-dark); text-align:center; margin-bottom:14px; font-style:italic;}
  .cloze-sentence{ font-size:1.25rem; font-weight:700; text-align:center; margin-bottom:4px; line-height:2.1;}
  .cloze-slot{ display:inline-flex; align-items:center; justify-content:center; min-width:70px; height:42px;
    padding:0 12px; border:2px dashed var(--gray-dark); border-radius:10px; background:var(--bg);
    font-size:1.125rem; font-weight:800; vertical-align:middle; margin:0 4px; cursor:pointer; color:var(--text);}
  .cloze-slot.filled{ border-style:solid; border-color:var(--blue); background:var(--build-active-bg);}
  .cloze-slot.correct{ border-style:solid; border-color:var(--green); background:var(--correct-bg); color:var(--green-dark);}
  .cloze-slot.wrong{ border-style:solid; border-color:var(--red); background:var(--wrong-bg); color:var(--red-dark);}
  .cloze-slot:disabled{ cursor:not-allowed;}
  /* Umschrift-Zeile unter dem Lückentext-Satz (Feedback vom 18.08.2026):
     folgt exakt derselben Lücken-Logik wie die koreanische Zeile darüber —
     zeigt "___" bis eine Kachel gewählt ist, danach deren Umschrift, nie
     vorab die Lösung. Nur sichtbar bei settings.showRoman. */
  .cloze-sentence-roman{ font-size:0.875rem; color:var(--gray-dark); font-style:italic; text-align:center; margin-bottom:16px;}
  /* Wortpool-Kacheln mit Umschrift (dieselbe .build-tile-Basis wie Silben-/
     Wortbau, aber zweizeilig: koreanisches Wort + kleine Umschrift darunter). */
  .build-tile.cloze-tile{ height:auto; min-height:48px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px; padding:6px 14px;}
  .build-tile.cloze-tile .tile-roman{ font-size:0.6875rem; font-weight:500; font-style:italic; color:var(--gray-dark);}
  /* Satzbau-Übung ("sentence"): Wortpool zu einem ganzen Satz in der
     richtigen Reihenfolge zusammensetzen, bidirektional DE↔KR. */
  .sentence-prompt-row{ text-align:center; margin-bottom:18px;}
  .sentence-prompt-text{ font-size:1.375rem; font-weight:800; display:inline-flex; align-items:center; gap:6px;}
  .sentence-prompt-roman{ font-size:0.8125rem; color:var(--gray-dark); font-style:italic; margin-top:4px;}
  .sentence-answer-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center;
    min-height:56px; padding:10px; border:2px dashed var(--gray); border-radius:14px; margin-bottom:18px;}
  .sentence-answer-row.correct{ border-style:solid; border-color:var(--green); background:var(--correct-bg);}
  .sentence-answer-row.wrong{ border-style:solid; border-color:var(--red); background:var(--wrong-bg);}
  .sentence-token{ padding:9px 14px; border:none; border-radius:10px; background:var(--blue); color:#fff;
    font-size:1rem; font-weight:700; cursor:pointer; display:inline-flex; flex-direction:column;
    align-items:center; gap:2px;}
  .sentence-token:disabled{ opacity:.6; cursor:not-allowed;}
  /* Umschrift unter platzierten Satzbau-Kacheln (Feedback vom 24.08.2026):
     dieselbe .tile-roman-Klasse wie bei den Lückentext-Pool-Kacheln (s.
     .build-tile.cloze-tile oben), nur mit hellerer Farbe, da .sentence-token
     einen dunklen (blauen) statt hellen Hintergrund hat. */
  .sentence-token .tile-roman{ font-size:0.625rem; font-weight:500; font-style:italic; color:rgba(255,255,255,.85);}
  .sentence-pool{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
  /* Wort-für-Wort-Übersetzung per Hover/Tap im "Richtig: ..."-Feedback
     einer falsch beantworteten Satzbau-Übung (Feedback vom 24.08.2026):
     .gloss-word ist eine gepunktet unterstrichene Wort-Spanne, die ihr
     .gloss-tooltip-Kind per CSS :hover (Maus) UND per Klick-Handler
     (Fingertipp, s. document.addEventListener('click', ...)) einblendet. */
  .gloss-word{ position:relative; border-bottom:1px dotted currentColor; cursor:help;}
  .gloss-tooltip{ position:absolute; left:50%; bottom:calc(100% + 6px); transform:translateX(-50%);
    background:var(--text); color:var(--bg); font-size:0.75rem; font-weight:600; font-style:normal;
    padding:4px 9px; border-radius:8px; white-space:nowrap; opacity:0; visibility:hidden;
    transition:opacity .12s ease; pointer-events:none; z-index:20;}
  .gloss-word:hover .gloss-tooltip, .gloss-tooltip.show{ opacity:1; visibility:visible;}
  .footer-bar{ position:sticky; bottom:0; background:var(--bg); padding:14px 16px calc(20px + env(safe-area-inset-bottom));}
  /* "Ich weiß es nicht": bewusst zurückhaltend als Textknopf gestaltet —
     er soll erreichbar sein, aber nie attraktiver aussehen als ein
     ehrlicher Rateversuch. */
  .reveal-btn{ display:block; margin:0 auto 10px; border:none; background:none; cursor:pointer;
    font-family:inherit; font-size:0.875rem; font-weight:700; color:var(--gray-dark);
    text-decoration:underline; text-underline-offset:3px; padding:6px 10px;}
  .reveal-btn:hover{ color:var(--text);}
  /* Hörverstehen-Karte */
  .listen-card{ display:flex; flex-direction:column; align-items:center; gap:10px;}
  .listen-play{ width:96px; height:96px; border-radius:50%; border:none; cursor:pointer;
    background:var(--blue); color:#fff; font-size:2.5rem; line-height:1;
    display:flex; align-items:center; justify-content:center;}
  .listen-play:active{ transform:scale(.96);}
  .listen-slow-btn{ border:2px solid var(--gray); background:var(--bg); border-radius:999px;
    padding:6px 14px; font-family:inherit; font-size:0.8125rem; font-weight:700; cursor:pointer;
    color:var(--text);}
  .listen-slow-btn:hover{ border-color:var(--blue); background:var(--option-hover-bg);}
  .listen-hint{ font-size:0.8125rem; color:var(--gray-dark); font-weight:600;}
  .listen-reveal{ display:flex; flex-direction:column; align-items:center; gap:2px;}
  .listen-reveal[hidden]{ display:none;}
  .listen-kr{ font-size:clamp(20px,7vw,32px); font-weight:800; line-height:1.25; word-break:keep-all;}
  .listen-roman{ font-size:0.875rem; font-style:italic; color:var(--gray-dark);}
  .listen-text-btn{ border:none; background:none; cursor:pointer; font-family:inherit;
    font-size:0.8125rem; font-weight:700; color:var(--gray-dark); text-decoration:underline;
    text-underline-offset:3px; padding:2px 6px;}
  .listen-text-btn:hover{ color:var(--text);}
  .feedback{ display:none; padding:14px 16px; border-radius:14px; margin-bottom:12px; font-weight:800; align-items:center; gap:10px;}
  .feedback.show{display:flex;}
  .feedback.correct{ background:var(--correct-bg); color:var(--green-dark);}
  .feedback.wrong{ background:var(--wrong-bg); color:var(--red-dark);}
  .feedback .sub{ display:block; font-weight:500; font-size:0.8125rem; margin-top:2px;}
  .btn{ width:100%; padding:15px; border:none; border-radius:14px; font-size:1rem; font-weight:800;
    letter-spacing:.5px; cursor:pointer; text-transform:uppercase;}
  .btn-primary{ background:var(--green); color:#fff; box-shadow:0 4px 0 var(--green-dark);}
  .btn-primary:disabled{ background:var(--gray); box-shadow:0 4px 0 var(--gray-dark); cursor:not-allowed;}
  .btn-primary:active:not(:disabled){ transform:translateY(3px); box-shadow:0 1px 0 var(--green-dark);}
  .btn-blue{ background:var(--blue); color:#fff; box-shadow:0 4px 0 var(--blue-dark);}
  .btn-blue:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--blue-dark);}
  .btn-red{ background:var(--red); color:#fff; box-shadow:0 4px 0 var(--red-dark);}
  /* Zurückhaltende Zweitwahl in Dialogen (z. B. "Nein, gerade nicht" bei
     der Ton-Rückfrage) — sichtbar, aber ohne den Sog des Hauptknopfes. */
  .btn-secondary{ background:var(--bg); color:var(--text); border:2px solid var(--gray);}
  .btn-secondary:active{ transform:translateY(2px);}
  /* ---- Complete / fail screens ---- */
  .center-screen{ display:none; flex-direction:column; align-items:center; justify-content:center;
    flex:1; padding:32px 24px; text-align:center;}
  .center-screen .big-emoji{ font-size:4.5rem; margin-bottom:10px;}
  .center-screen h1{ margin:0 0 6px;}
  .results-row{ display:flex; gap:16px; margin:24px 0;}
  .result-card{ background:var(--card-bg); border-radius:14px; padding:16px 22px; font-weight:800; min-width:100px;}
  .result-card .val{ font-size:1.375rem;}
  .result-card.gems .val{color:var(--blue);}
  .result-card.xp .val{color:var(--xp-color);}
  .daily-note{ margin:0 0 20px; font-size:0.875rem; font-weight:700; color:var(--gray-dark);}
  /* Fortschritts-Übersicht im Üben-Reiter */
  .stat-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:14px;}
  .stat-tile{ background:var(--bg); border:2px solid var(--gray); border-radius:14px; padding:12px 6px;}
  .stat-val{ font-size:1.5rem; font-weight:900; color:var(--green-dark); font-variant-numeric:tabular-nums;}
  .stat-cap{ font-size:0.6875rem; font-weight:700; color:var(--gray-dark); margin-top:2px;}
  .stat-note{ font-size:0.8125rem; color:var(--gray-dark); font-weight:600; margin:0 0 14px; text-align:left;}
  .hidden{display:none !important;}
  /* ---- Untere Navigation: Lernpfad / Üben / Fehler ---- */
  #bottomNav{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:var(--app-w);
    display:flex; background:var(--bg); border-top:2px solid var(--gray);
    padding-bottom:env(safe-area-inset-bottom); z-index:10;}
  /* Die fünf Felder teilen sich die Breite zu gleichen Teilen. Damit bei
     großer System-Schriftgröße "Einstellungen" nicht seitlich aus dem
     Bild läuft, sind Symbol und Beschriftung zusätzlich an die Bildbreite
     gekoppelt (min(): es gilt der kleinere der beiden Werte). */
  .nav-btn{ flex:1 1 0; min-width:0; background:none; border:none; padding:10px 2px 8px; display:flex;
    flex-direction:column; align-items:center; gap:2px; font-size:min(1.375rem, 6.4vw);
    color:var(--gray-dark); cursor:pointer; position:relative;}
  /* line-height mit Luft: sonst schneidet das overflow:hidden die
     Umlautpunkte von "Üben" ab. */
  .nav-btn span{ font-size:min(0.6875rem, 2.6vw); font-weight:700; max-width:100%; letter-spacing:-.01em;
    line-height:1.45; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .nav-btn.active{ color:var(--green-dark);}
  /* Liegt etwas zum Üben bereit (offene Fehler oder heute fällige
     Wiederholungen), pulsiert das Feld hinter Symbol und Beschriftung
     langsam von durchsichtig zu zartem Blütenrosé — dieselbe Farbe wie
     die 🌸 in den Bannern. Ein Winken statt einer Mahnung mit wachsender
     Fehlerzahl. Als ::before mit inset gezeichnet, damit das Feld
     abgerundet in der Leiste sitzt, statt bis an die Nachbarreiter zu
     stoßen; z-index:-1 legt es hinter Symbol und Text, aber vor den
     Hintergrund der Leiste. Beschriftung und Symbol behalten bewusst ihre
     normale Farbe — pulsierte die Schrift mit, wäre sie in der
     durchsichtigen Phase kaum zu lesen. */
  .nav-btn.needs-practice::before{
    content:''; position:absolute; inset:4px 3px; border-radius:12px;
    background:var(--blossom-bg); z-index:-1;
    /* 6,4 s statt 3,2 s (Feedback vom 25.08.2026): halbes Tempo — das
       Feld soll winken, nicht blinken. */
    animation:blossom-pulse 6.4s ease-in-out infinite;
  }
  @keyframes blossom-pulse{
    0%, 100%{ opacity:0;}
    50%{ opacity:1;}
  }
  /* Wer Bewegungen im System abbestellt hat, bekommt das Feld ruhig und
     dauerhaft eingefärbt — die Information bleibt, das Blinken entfällt. */
  @media (prefers-reduced-motion: reduce){
    .nav-btn.needs-practice::before{ animation:none; opacity:1;}
  }
  /* ---- Größere Bildschirme: Tablet und Querformat ----
     Die App war bisher für genau eine Bildschirmform gebaut: ein Telefon
     im Hochformat. Auf einem Tablet stand die 480-Pixel-Spalte verloren
     in der Mitte, im Querformat fraßen Kopfzeile und untere Leiste die
     halbe Höhe. Beides regeln die folgenden drei Abfragen — und zwar
     nur über Maße, nicht über eigene Bausteine: es gibt weiterhin genau
     EINE Ansicht, die sich dehnt. */
  @media (min-width:700px){
    :root{ --app-w:600px;}
    #app{ border-left:1px solid var(--gray); border-right:1px solid var(--gray);}
  }
  @media (min-width:1100px){
    :root{ --app-w:680px;}
  }
  /* Telefon im Querformat: flacher Kopf, flache Leiste, Symbol und
     Beschriftung nebeneinander statt untereinander. */
  @media (orientation:landscape) and (max-height:560px){
    .header-row{ padding-top:calc(6px + env(safe-area-inset-top)); padding-bottom:6px;}
    .nav-btn{ flex-direction:row; gap:6px; padding:6px 4px;}
    .nav-btn span{ font-size:min(0.6875rem, 2.2vw);}
    #app{ min-height:100vh; min-height:100dvh;}
  }
  /* ---- Eigener Bestätigungsdialog (statt window.confirm, das in
     eingebetteten/sandboxed Ansichten blockiert sein kann und dann
     lautlos nichts tut) ---- */
  .modal-overlay{ position:fixed; inset:0; background:var(--overlay-bg); display:flex;
    align-items:center; justify-content:center; z-index:100; padding:24px;}
  .modal-box{ background:var(--bg); border-radius:16px; padding:26px 22px; max-width:340px; width:100%; text-align:center;}
  .modal-box h3{ margin:0 0 10px; font-size:1.125rem;}
  .modal-box p{ margin:0 0 22px; font-size:0.875rem; color:var(--gray-dark); line-height:1.4;}
  .modal-actions{ display:flex; gap:10px;}
  .modal-actions .btn{ width:auto; flex:1; margin:0;}
  .modal-actions.stacked{ flex-direction:column;}
  .modal-actions.stacked .btn{ width:100%; flex:none;}
  .btn-gray{ background:var(--gray); color:var(--text); box-shadow:0 4px 0 var(--gray-dark);}
  .btn-gray:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--gray-dark);}

  /* ---- "Joseon-Stil": stimmungsvolle Ergänzung im Look eines alten Schriftstücks.
     Überschreibt nur die Variablen aus :root — der Rest der App bleibt unverändert
     und übernimmt die neue Palette automatisch, weil alle Farben oben über var()
     laufen. Die Lichtstimmung sitzt in body.theme-night (s. weiter unten). ---- */
  body.theme-joseon{
    --green:#4b7a63; --green-dark:#375a49; --blue:#3d5a80; --blue-dark:#2c4159;
    --red:#a3312a; --red-dark:#7c231d; --yellow:#c9a227; --yellow-dark:#a2801c;
    --gray:#d8c9a3; --gray-dark:#9c8a63; --text:#2b2620; --bg:#f7f0de;
    --page-bg:#e9dcc0; --card-bg:#efe4c9;
    --purple:#6b4a7a; --purple-dark:#4f3559; --slate:#5c5346; --amber:#b8842e;
    --streak-color:#b8642e; --xp-color:#b8842e;
    --info-bg:#e3d9bd; --option-hover-bg:#efe4c9; --option-selected-bg:#d8c9a3;
    --correct-bg:#cfe0c6; --wrong-bg:#e6c6c2; --build-active-bg:#e3d9bd;
    --phase-intro-bg:#d7dfe8; --phase-reinforce-bg:#e8dcb8; --phase-reinforce-text:#8a6318;
    --phase-apply-bg:#d9e3d2; --phase-hangultrainer-bg:#e0d3e6; --phase-mistakes-bg:#e8d3d1;
    --overlay-bg:rgba(43,38,32,.6);
    --blossom-bg:#e8c9d1;
    font-family:"Noto Serif KR", Georgia, 'Times New Roman', serif;
    background:
      radial-gradient(circle at 15% 15%, rgba(139,111,60,.08), transparent 55%),
      radial-gradient(circle at 85% 75%, rgba(139,111,60,.08), transparent 55%),
      var(--page-bg);
  }
  body.theme-joseon #app{
    background:transparent;
    box-shadow:0 0 0 1px var(--gray), 0 0 28px rgba(43,38,32,.18);
  }
  /* Der Fluss-/Hügel-Hintergrund (#joseonBg) scheint nur dort durch, wo
     #app selbst transparent ist (s. o.) — #home bleibt daher absichtlich
     ohne eigene Hintergrundfarbe. Alle anderen Bereiche (Üben, Wörter-
     buch, Grammatik, Einstellungen UND vor allem die eigentlichen
     Übungen/Aufgaben in #lesson sowie die Ergebnis-Screens) bekommen
     wieder die alte einfarbige Pergament-Fläche — der Landschafts-
     Hintergrund ist bewusst nur dem Lernpfad mit den Schriftrollen
     vorbehalten. */
  body.theme-joseon #practice,
  body.theme-joseon #grammar,
  body.theme-joseon #settings,
  body.theme-joseon #dictionary,
  body.theme-joseon #lesson,
  body.theme-joseon #completeScreen,
  body.theme-joseon #failScreen{
    background:var(--bg);
  }
  body.theme-joseon .unit-banner,
  body.theme-joseon .trainer-card,
  body.theme-joseon .modal-box{
    border:1px solid rgba(43,38,32,.14);
  }
  /* Grüner Titel-Kasten ("한국어 배우기") bekommt im Joseon-Stil ebenfalls
     ein paar vereinzelte Pfirsichblüten in unterschiedlichen Größen. */
  body.theme-joseon .unit-banner{ overflow:hidden;}
  body.theme-joseon .banner-blossoms{
    display:block; position:absolute; inset:0; overflow:hidden;
    pointer-events:none; z-index:1;
  }
  body.theme-joseon .banner-blossoms span{
    position:absolute; line-height:1;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));
    opacity:.85;
  }
  body.theme-joseon .banner-blossoms span:nth-child(1){ top:8px; left:8%; font-size:0.9375rem; transform:rotate(-14deg);}
  body.theme-joseon .banner-blossoms span:nth-child(2){ bottom:8px; right:12%; font-size:1.625rem; transform:rotate(12deg);}
  body.theme-joseon .banner-blossoms span:nth-child(3){ top:10px; right:32%; font-size:0.625rem; transform:rotate(8deg);}

  /* ---- Kopfzeile im Joseon-Stil: Torbau-Optik angelehnt an ein
     Hanmun-Palasttor/Tempeltor — helle Dachziegel-Reihe mit runden,
     bläulichen Traufziegel-Enden, eine Reihe kleiner Blüten-Medaillons
     (Yeonhwamun), ein Fries mit den dunkelroten/jadegrünen Kranbalken-
     Klötzen (Gongpo), darunter eine rote Wand mit einer schwarz
     lackierten Namenstafel mit goldener Schrift in der Mitte. Die
     Streak-/XP-/Herzen-Zähler sind (wie jetzt überall in der App)
     ausgeblendet. ---- */
  /* Kopfzeile im Joseon-Stil: kein Dach, keine Ziegel, kein gemusterter
     Fries mehr — nur noch ein schlichter, dunkel türkisfarbener Balken,
     auf dem die schwarz lackierte Namenstafel sitzt. */
  body.theme-joseon header{
    border-bottom:none;
    background:linear-gradient(180deg, #7ab89e, #64a68c);
    box-shadow:0 3px 6px rgba(0,0,0,.45);
  }
  /* .gate-roof (Dachziegel-Reihe) und .gate-rosettes (buntes Kassetten-Band)
     bleiben bewusst ausgeblendet (Basisregeln oben: display:none) — auf
     Wunsch entfernt. .gate-blossoms streut ein paar vereinzelte
     Pfirsichblüten in unterschiedlichen Größen über den Balken. */
  body.theme-joseon .gate-blossoms{
    display:block; position:absolute; inset:0; overflow:hidden;
    pointer-events:none; z-index:1;
  }
  body.theme-joseon .gate-blossoms span{
    position:absolute; line-height:1;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));
    opacity:.9;
  }
  body.theme-joseon .gate-blossoms span:nth-child(1){ top:8px; left:9%; font-size:0.8125rem; transform:rotate(-15deg);}
  body.theme-joseon .gate-blossoms span:nth-child(2){ top:14px; left:80%; font-size:1.375rem; transform:rotate(10deg);}
  body.theme-joseon .gate-blossoms span:nth-child(3){ bottom:10px; left:22%; font-size:1.0625rem; transform:rotate(18deg);}
  body.theme-joseon .gate-blossoms span:nth-child(4){ bottom:6px; left:90%; font-size:0.625rem; transform:rotate(-8deg);}
  /* Drei Spalten statt zentriertem Flex: leere Spalte | Namenstafel |
     Status. Die Tafel bleibt dadurch mittig, Streak und Tagesziel-Ring
     laufen aber im normalen Fluss mit — ein früherer Versuch, sie absolut
     zu positionieren, ließ sie bei kurzer Kopfzeile unten aus dem grünen
     Balken herausragen, sodass der Lernpfad darunter durchscrollte.
     minmax(0,1fr) auf beiden Außenspalten verhindert, dass eine breite
     Statusanzeige die Tafel aus der Mitte drückt. Die obere Sicherheits-
     zone (Notch) muss hier mit angegeben werden, da diese Regel das
     Standard-Padding der Kopfzeile vollständig ersetzt. */
  body.theme-joseon .header-row{
    position:relative; z-index:2;
    display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center;
    padding:calc(14px + env(safe-area-inset-top, 0px)) 12px 14px;
  }
  body.theme-joseon .brand{ grid-column:2; width:auto; display:flex; justify-content:center;}
  /* Im Joseon-Stil ist die Kopfzeile ein dekorativer Balken mit
     zentrierter Namenstafel und darüber gestreuten Blüten. Streak und
     Tagesziel-Ring werden deshalb absolut an den rechten Rand gesetzt
     (statt als Flex-Element die zentrierte Tafel zu verschieben) und
     bekommen ein zurückhaltendes Pergament-Feld als Untergrund, damit
     sie vor den Blüten und dem grünen Balken lesbar bleiben. */
  body.theme-joseon .header-stats{
    grid-column:3; justify-self:end;
    gap:8px; padding:3px 8px; border-radius:999px;
    background:rgba(247,241,227,.86); box-shadow:0 1px 3px rgba(0,0,0,.18);
  }
  body.theme-joseon .ring-track{ stroke:rgba(43,38,32,.18);}
  body.theme-joseon .brand-joseon-plaque{
    display:inline-block; position:relative; padding:6px 24px;
    background:linear-gradient(180deg, #201d1a, #0c0b0a);
    border:3px solid #8a3226; border-radius:2px;
    color:#e7dcb8; font-family:"Noto Serif KR", serif; font-weight:900;
    font-size:1.1875rem; letter-spacing:8px;
    box-shadow:0 3px 7px rgba(0,0,0,.5), inset 0 0 0 1px rgba(212,175,55,.35);
  }
  body.theme-joseon .brand-joseon-plaque::before,
  body.theme-joseon .brand-joseon-plaque::after{
    content:''; position:absolute; top:3px; width:5px; height:5px; background:#d4af37;
    box-shadow:0 calc(100% - 8px) 0 #d4af37;
  }
  body.theme-joseon .brand-joseon-plaque::before{ left:3px;}
  body.theme-joseon .brand-joseon-plaque::after{ right:3px;}

  /* ---- Schriftrollen ("scroll-unit"): ersetzen im Joseon-Stil pro
     Lerneinheit den Einheiten-Banner samt Lektions-Kacheln durch eine
     einzelne, aufrollbare Schriftrolle im Stil eines echten koreanischen
     Hänge-Schriftstücks (족자): ein gemustertes Seidenbrokat-Passepartout
     (gedeckte Gold-/Ockertöne mit gewebtem Rautenmuster) umrahmt ein
     helles, cremefarbenes Rechteck — dort steht der eigentliche Text
     (Titel, Zähler, Lektionsliste). Unten schließt eine dunkle
     Holz-Wickelrolle mit runden Endknäufen ab, oben hängt eine kleine
     Kordel-Öse. Nur die renderHomeJoseon-Funktion erzeugt diese Klassen,
     daher sind sie automatisch auf den Joseon-Stil beschränkt und müssen
     nicht extra unter body.theme-joseon stehen. ---- */
  .scroll-unit{ width:100%; margin:26px 0 20px; position:relative;}
  .scroll-cord{ position:absolute; top:-11px; left:50%; transform:translateX(-50%);
    width:11px; height:11px; border-radius:50%; border:2px solid #6b4a2a;
    background:#d9c8a0; z-index:1;}
  .scroll-frame{ padding:12px; border-radius:10px 10px 3px 3px;
    border:1px solid rgba(43,38,32,.3); box-shadow:0 3px 10px rgba(43,38,32,.22);
    background:
      repeating-linear-gradient(45deg, rgba(90,66,32,.16) 0 2px, transparent 2px 11px),
      repeating-linear-gradient(-45deg, rgba(90,66,32,.13) 0 2px, transparent 2px 11px),
      #c3a76c;}
  .scroll-inner{ background:var(--bg); border:1px solid rgba(90,66,32,.4);
    border-radius:3px; overflow:hidden;}
  .scroll-roller{ height:16px; flex-shrink:0; position:relative; border-radius:0 0 8px 8px;
    background:linear-gradient(180deg, #96693d, #5a3a1e 55%, #6f4a28);}
  .scroll-roller::before, .scroll-roller::after{ content:''; position:absolute; top:-4px;
    width:16px; height:24px; border-radius:8px; background:linear-gradient(180deg, #b0855a, #4a2f18);
    box-shadow:0 1px 4px rgba(0,0,0,.45);}
  .scroll-roller::before{ left:-9px;}
  .scroll-roller::after{ right:-9px;}
  .scroll-header{ padding:14px 16px; cursor:pointer; display:flex; flex-direction:column;
    gap:3px; color:var(--text); -webkit-tap-highlight-color:transparent;}
  .scroll-header-row{ display:flex; justify-content:space-between; align-items:baseline;
    gap:10px; font-weight:800; font-size:1rem;}
  .scroll-header-row .unit-counter{ background:rgba(43,38,32,.12); color:var(--text);}
  .scroll-header small{ opacity:.75; font-size:0.7812rem;}
  .scroll-hint{ font-size:0.6875rem; font-style:italic; opacity:.6; margin-top:2px;}
  .scroll-toggle-icon{ display:inline-block; transition:transform .3s ease; margin-right:4px;}
  .scroll-unit.expanded .scroll-toggle-icon{ transform:rotate(180deg);}
  .scroll-unit.locked .scroll-header{ cursor:not-allowed; opacity:.6;}
  .scroll-lessons{ max-height:0; overflow:hidden; opacity:0; padding:0 6px;
    transition:max-height .45s ease, opacity .35s ease, padding .45s ease;}
  .scroll-unit.expanded .scroll-lessons{ max-height:3000px; opacity:1; padding:2px 6px 12px;}
  .scroll-lesson-row{ display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:10px 10px; border:none; border-top:1px dashed rgba(43,38,32,.22); background:none;
    font-family:inherit; font-size:0.875rem; color:var(--text); cursor:pointer;}
  .scroll-lesson-row:first-child{ border-top:none;}
  .scroll-lesson-row:disabled{ opacity:.45; cursor:not-allowed;}
  .scroll-lesson-icon{ font-size:1.125rem; flex-shrink:0; width:22px; text-align:center;}
  .scroll-lesson-title{ flex:1; font-weight:700; line-height:1.25;}
  .scroll-lesson-counter{ font-size:0.7188rem; font-weight:700; opacity:.65; flex-shrink:0;}
  /* Eingefärbte Schriftrollen für die Trainer im Üben-Reiter (Feedback vom
     24.08.2026): gleiche Machart wie die Einheiten-Schriftrollen im
     Lernpfad, aber das Brokat-Passepartout trägt statt der Gold-/Ockertöne
     die Farbe des jeweiligen Trainers (blau/lila/rot) — die Farbe kommt
     über die Eigenschaft --scroll-tint vom erzeugten Element selbst. Das
     gewebte Rautenmuster bleibt, nur eben in Hell/Dunkel über dem
     Farbton statt in Braun, damit die Rollen als dasselbe „Material"
     erkennbar bleiben. Die Wickelrolle unten bleibt Holz. */
  .scroll-unit.scroll-tinted .scroll-frame{
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.17) 0 2px, transparent 2px 11px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.13) 0 2px, transparent 2px 11px),
      var(--scroll-tint, #c3a76c);
    border-color:rgba(0,0,0,.22);
  }
  /* ---- Sektor-Trenner im Lernpfad (Feedback vom 25.08.2026) ----
     Der Kurs zerfällt in zwei Teile, die nichts miteinander zu tun haben:
     Einheit 0 bringt die SCHRIFT bei, alles danach die SPRACHE. Bis dahin
     standen beide als gleichwertige Einheiten untereinander. Jetzt trennt
     eine Linie sie, deren Beschriftung mittig in ihr sitzt — dieselbe
     Geste wie eine Kapitelüberschrift in einem Buch. */
  .path-section{ display:flex; align-items:center; gap:12px; width:100%;
    margin:30px 0 14px; user-select:none;}
  .path-section:first-child{ margin-top:6px;}
  .path-section::before, .path-section::after{ content:''; flex:1; height:2px; border-radius:2px;
    background:linear-gradient(90deg, transparent, rgba(120,110,100,.45), transparent);}
  /* Die Beschriftung sitzt auf einem eigenen kleinen Feld — im
     Joseon-Stil läuft hinter dem Lernpfad ein gemustertes Berg-Panorama,
     auf dem blanke Schrift kaum lesbar wäre. */
  .path-section > span{ flex-shrink:0; font-size:0.75rem; font-weight:800; letter-spacing:.16em;
    text-transform:uppercase; color:rgba(90,84,76,.9); white-space:nowrap;
    padding:5px 14px; border-radius:999px; background:rgba(255,255,255,.88);
    box-shadow:0 1px 3px rgba(0,0,0,.12);}
  body.theme-joseon .path-section::before, body.theme-joseon .path-section::after{
    background:linear-gradient(90deg, transparent, rgba(247,240,224,.9), transparent);}
  body.theme-joseon .path-section > span{ color:#3a3128; letter-spacing:.2em;
    background:rgba(247,240,224,.94); border:1px solid rgba(43,38,32,.28);
    box-shadow:0 2px 6px rgba(0,0,0,.22);}
  /* Die Hangul-Einheit trägt als einzige einen hell rosa Rahmen — sie
     gehört sichtbar zu einem anderen Kapitel als die Sprach-Einheiten. */
  .unit-banner.unit-basis{ background:#f0cdd8; color:#5a3a44;}
  .unit-banner.unit-basis small{ color:rgba(90,58,68,.85);}
  /* ---- Merkliste im Wörterbuch ---- */
  .dict-favbar{ display:flex; gap:8px; width:100%; margin-bottom:12px; flex-wrap:wrap;}
  .chip{ border:2px solid var(--gray); background:var(--bg); color:var(--text);
    border-radius:999px; padding:8px 14px; font-family:inherit; font-size:0.8125rem; font-weight:700;
    cursor:pointer; min-height:40px;}
  .chip.on{ border-color:var(--green); background:var(--correct-bg);}
  .dict-fav{ border:none; background:none; cursor:pointer; font-size:1.1875rem; line-height:1;
    color:var(--gray-dark); padding:2px 4px; position:relative; -webkit-tap-highlight-color:transparent;}
  .dict-fav.on{ color:#e0a52b;}
  .dict-fav::after{ content:''; position:absolute; inset:-12px;}
  /* ---- Trefferflächen (Feedback vom 25.08.2026) ----
     Gemessen waren Laterne 29x21 und Lautsprecher 33x24 — Apple verlangt
     44x44 pt, Google 48x48 dp. Die Fläche wächst über ein unsichtbares
     ::after-Feld, damit das AUSSEHEN unverändert bleibt: sichtbar zu
     große Knöpfe hätten die Kopfzeilen auseinandergezogen. */
  .culture-btn, .speak-btn{ position:relative;}
  .culture-btn::after, .speak-btn::after{ content:''; position:absolute; inset:-12px;}
  .scroll-lesson-row{ min-height:48px;}
  .culture-close{ min-width:44px; min-height:44px;}
  /* ---- Sicherung des Fortschritts ---- */
  .backup-actions{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .backup-actions .btn{ flex:1 1 150px; margin:0;}
  .backup-note{ margin-top:12px; font-size:0.8125rem; line-height:1.5; min-height:1px;}
  /* Zustandszeile unter einer Einstellung — sagt, was gerade tatsächlich
     passiert (z. B. ob die Aussprache aus Aufnahmen oder aus der
     Gerätestimme kommt). */
  .setting-status{ margin:6px 0 0 !important; font-size:0.75rem !important; line-height:1.45;
    color:var(--gray-dark); font-weight:600;}
  /* ---- Leiste "neue Fassung geladen" ----
     Sitzt über der unteren Navigation und drängt sich bewusst nicht auf:
     Ein Neustart mitten in der Lektion wäre ärgerlich, deshalb wird
     gefragt statt gehandelt. */
  #updateBar{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(64px + env(safe-area-inset-bottom));
    width:calc(100% - 24px); max-width:calc(var(--app-w) - 24px); z-index:40;
    display:none; align-items:center; gap:10px; padding:10px 12px; border-radius:14px;
    background:var(--green-dark); color:#fff; box-shadow:0 6px 18px rgba(0,0,0,.28);
    font-size:0.75rem; font-weight:700;}
  #updateBar.show{ display:flex;}
  #updateBar span{ flex:1; line-height:1.35;}
  #updateBar button{ border:none; border-radius:999px; padding:7px 13px; font-family:inherit;
    font-size:0.75rem; font-weight:800; cursor:pointer; background:#fff; color:var(--green-dark);
    white-space:nowrap; flex-shrink:0;}
  #updateBar button.later{ background:transparent; color:#fff; padding:7px 2px; opacity:.85;}
  /* ---- Sprung-Knopf und Einheiten-Liste ---- */
  /* Der Abstand nach unten hängt an der GEMESSENEN Höhe der Leiste
     (--nav-h, gesetzt in updateJumpBtn). Vorher stand dort ein fester
     Wert plus env(safe-area-inset-bottom) — und weil die Leiste diesen
     Geräterand bereits in ihrer eigenen Höhe trägt, wurde er auf
     Telefonen mit Home-Indikator doppelt gezählt und der Knopf saß zu
     hoch. Gemessen stimmt es auf jedem Gerät und in jeder Lage.

     Das Verhältnis ist bewusst festgelegt: Der Abstand zur Menüleiste
     ist die Hälfte des Abstands zum Bildrand. */
  #jumpBtn{ --jump-rand:20px;
    position:fixed; right:var(--jump-rand);
    bottom:calc(var(--nav-h, 60px) + var(--jump-rand) / 2);
    z-index:30; display:none;
    padding:8px 14px; border-radius:999px; border:2px solid var(--gray);
    background:var(--bg); color:var(--text); font-family:inherit;
    font-size:0.75rem; font-weight:800; cursor:pointer; white-space:nowrap;
    box-shadow:0 4px 14px rgba(0,0,0,.18);}
  #jumpBtn.show{ display:block;}
  #jumpBtn:active{ transform:translateY(1px);}
  .jump-list{ text-align:left; max-height:56vh; overflow-y:auto; margin:0 0 16px;
    display:flex; flex-direction:column; gap:4px;}
  .jump-row{ display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:9px 10px; border:none; border-radius:10px; background:var(--card-bg);
    font-family:inherit; color:var(--text); cursor:pointer;}
  .jump-row:disabled{ opacity:.45; cursor:default;}
  .jump-row.now{ background:var(--option-selected-bg); box-shadow:inset 0 0 0 2px var(--green);}
  .jump-mark{ width:18px; text-align:center; font-size:0.8125rem; flex-shrink:0;}
  .jump-name{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
  .jump-name strong{ font-size:0.8125rem;}
  .jump-name small{ font-size:0.6875rem; color:var(--gray-dark); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;}
  .jump-count{ font-size:0.6875rem; font-weight:700; color:var(--gray-dark);
    font-variant-numeric:tabular-nums; flex-shrink:0;}
  /* ---- Wochenrückblick ---- */
  /* Die Balken standen direkt auf den Wochentagen — ohne Luft dazwischen
     klebte alles aneinander (Rückmeldung vom 26.08.2026). Jetzt haben sie
     Abstand und eine zarte Grundlinie, auf der sie stehen. */
  .week-chart{ display:flex; gap:6px; align-items:flex-end; margin:20px 0 4px; height:86px;}
  .week-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:9px; height:100%;}
  .week-bar-slot{ flex:1; width:100%; display:flex; align-items:flex-end;
    border-bottom:1px solid var(--gray); padding-bottom:5px;}
  .week-bar{ width:100%; border-radius:5px 5px 2px 2px; background:var(--green);
    transition:height .3s ease;}
  .week-bar.today{ background:var(--yellow);}
  .week-bar.empty{ background:var(--gray);}
  .week-col span{ font-size:0.625rem; font-weight:700; color:var(--gray-dark);}
  .week-figures{ display:flex; gap:6px; margin-top:12px; border-top:1px solid var(--gray); padding-top:12px;}
  .week-figures div{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;}
  .week-figures strong{ font-size:1.0625rem; font-variant-numeric:tabular-nums;}
  .week-figures span{ font-size:0.625rem; font-weight:700; color:var(--gray-dark);}
  /* Gruppen-Überschrift im Einstellungen-Bildschirm — klein, in
     Versalien, damit sie gliedert, ohne mit den Regler-Titeln zu
     konkurrieren. */
  .settings-group-title{ margin:24px 4px 8px; font-size:0.6875rem; font-weight:800;
    letter-spacing:.14em; text-transform:uppercase; color:var(--gray-dark);}
  .settings-group-title:first-of-type{ margin-top:16px;}
  /* Kleingedrucktes am Fuß des Lernpfads — dort, wo man es sucht, wenn
     man wissen will, welche Fassung man vor sich hat. */
  .path-footer{ margin:26px 0 4px; text-align:center; font-size:0.6875rem; line-height:1.6;
    color:var(--gray-dark); font-weight:600;}
  .path-footer button{ border:none; background:none; padding:2px 4px; font-family:inherit;
    font-size:0.6875rem; font-weight:700; color:inherit; cursor:pointer;
    text-decoration:underline; text-underline-offset:2px;}
  .path-footer-inner{ display:inline-block;}
  /* Im Joseon-Stil liegt die Fußzeile auf der Landschaft, nicht auf
     Papier. Ein Textschatten allein genügt dort nicht: Wo der helle
     Fluss durchläuft, verschwände die Zeile trotzdem. Deshalb ein
     schmales dunkles Feld, das genau so breit ist wie der Text. */
  body.theme-joseon .path-footer-inner{ color:#e7dcb8; background:rgba(20,30,25,.5);
    border-radius:12px; padding:8px 14px;}
  /* ---- Mal-Übung ---- */
  .draw-field{ display:flex; justify-content:center; margin:6px 0 4px;}
  .draw-canvas{ border-radius:16px; background:var(--card-bg);
    box-shadow:inset 0 0 0 2px var(--gray); cursor:crosshair;
    /* Ohne das scrollt jeder Malstrich die Seite statt zu zeichnen. */
    touch-action:none;}
  .draw-actions{ display:flex; justify-content:center; margin-bottom:6px;}
  .about-line{ margin:0 0 6px; font-size:0.8125rem; color:var(--gray-dark); font-weight:600;}
  .about-line strong{ color:var(--text);}
  .legal-box{ text-align:left; font-size:0.8125rem; line-height:1.55; max-height:52vh; overflow-y:auto;
    margin:0 0 18px; padding-right:4px; color:var(--text);}
  .modal-box p:empty{ display:none;}
  .legal-box h4{ margin:16px 0 4px; font-size:0.875rem;}
  .legal-box h4:first-child{ margin-top:0;}
  .legal-box p{ margin:0 0 8px;}
  .legal-box code{ font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:0.75rem;}
  .backup-note.ok{ color:var(--green-dark); font-weight:700;}
  .backup-note.err{ color:var(--red-dark); font-weight:700;}
  .backup-box{ width:100%; min-height:110px; margin-top:12px; padding:10px; border-radius:10px;
    border:2px solid var(--gray); background:var(--bg); color:var(--text);
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:0.6875rem; resize:vertical;}
  .backup-file{ display:block; width:100%; margin-top:12px; font-size:0.8125rem;}
  /* ---- Ausblick-Schriftrolle (Feedback vom 25.08.2026) ---- */
  /* Die Trainer-Karten sind zentriert gesetzt — für eine Liste aus acht
     Sektoren mit je zehn Einheiten wäre das unlesbar. */
  .outlook-intro, .outlook-item, .outlook-foot{ text-align:left;}
  .outlook-intro{ font-size:0.875rem; line-height:1.55; margin:0 0 14px;}
  .outlook-item{ padding:12px 0; border-top:1px dashed rgba(43,38,32,.28);}
  .outlook-item:first-of-type{ border-top:none; padding-top:4px;}
  .outlook-head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .outlook-num{ font-size:0.6875rem; font-weight:800; letter-spacing:.08em; opacity:.6;
    text-transform:uppercase; flex-shrink:0;}
  .outlook-title{ font-weight:800; font-size:0.9375rem;}
  .outlook-level{ font-size:0.625rem; font-weight:800; letter-spacing:.06em; padding:2px 7px;
    border-radius:999px; background:rgba(163,49,42,.14); color:#8c2a24; flex-shrink:0;}
  .outlook-goal{ font-size:0.8125rem; line-height:1.5; opacity:.88; margin:5px 0 7px;}
  .outlook-units{ font-size:0.75rem; line-height:1.7; opacity:.72;}
  .outlook-units b{ font-weight:700; opacity:.9;}
  .outlook-foot{ margin-top:16px; padding-top:12px; border-top:1px dashed rgba(43,38,32,.28);
    font-size:0.8125rem; line-height:1.55;}
  /* ---- Kultur-Schriftrolle (Feedback vom 24.08.2026) ----
     Liegt über einem grauen Schleier und nutzt bewusst dieselben
     Bausteine wie eine Einheiten-Schriftrolle (Kordel, Brokatrahmen,
     cremefarbenes Feld, Wickelrolle), damit sie als dasselbe Objekt
     erkennbar ist — nur eben ganzflächig aufgerollt. */
  /* Laterne und Fortschritts-Zähler stehen nebeneinander in EINER Zeile,
     die Laterne bewusst VOR der Zahl (Feedback vom 25.08.2026) — vorher
     untereinander (Spalte), wodurch das Symbol unter dem Zähler hing. */
  .scroll-header-right{ display:flex; flex-direction:row; align-items:center; gap:8px; flex-shrink:0;}
  /* Tabelle in der Positions-Regel-Lektion (Anfang vs. Ende). */
  .pos-table{ width:100%; border-collapse:collapse; margin:10px 0; font-size:0.875rem;}
  .pos-table th, .pos-table td{ text-align:left; padding:6px 8px; border-bottom:1px solid rgba(0,0,0,.1);}
  .pos-table th{ font-weight:800; font-size:0.75rem; text-transform:uppercase; letter-spacing:.04em; opacity:.7;}
  .culture-btn{ border:none; background:none; cursor:pointer; font-size:1.0625rem; line-height:1;
    padding:2px 4px; border-radius:8px; -webkit-tap-highlight-color:transparent;}
  .culture-btn:hover{ background:rgba(43,38,32,.1);}
  /* Der Schleier scrollt als Ganzes, damit auch eine lange Rolle auf
     kleinen Bildschirmen vollständig erreichbar bleibt.
     Der Geräterand oben MUSS mitgerechnet werden: Als installierte App
     liegt die Statusleiste über der Seite, und ohne diesen Zuschlag
     rutscht die obere Kante der Rolle — samt Schließen-Knopf —
     darunter. Unten stand er von Anfang an, oben fehlte er
     (Rückmeldung vom 26.08.2026). */
  .culture-overlay{ align-items:flex-start; justify-content:center; overflow-y:auto;
    padding:calc(34px + env(safe-area-inset-top, 0px)) 18px calc(30px + env(safe-area-inset-bottom));}
  .culture-scroll{ width:100%; max-width:400px; margin:auto;}
  /* Der Schließen-Knopf steht FEST im Bild, nicht an der Rolle.

     Grund: Fünf der sechs Kulturrollen sind höher als ein Telefon-
     bildschirm. Wer sie zu Ende liest, hat den Knopf längst nach oben
     hinausgeschoben — gemessen 129 px über der Kante. Übrig bleibt zum
     Schließen nur der Schleier links und rechts, und genau das war die
     Rückmeldung: „das X funktioniert nicht, man muss ins Schattierte
     drücken."

     Die Rechnung rechts hält ihn dabei an derselben Stelle wie vorher:
     an der rechten Kante der (höchstens 400 px breiten, mittigen)
     Rolle, mindestens aber 10 px vom Bildrand. Oben derselbe Wert wie
     die Rolle selbst, Geräterand eingerechnet. */
  .culture-close{ position:fixed; z-index:3;
    top:calc(24px + env(safe-area-inset-top, 0px));
    right:max(10px, calc(50% - 208px));
    width:34px; height:34px; border-radius:50%; border:2px solid rgba(43,38,32,.35);
    background:var(--bg); color:var(--text); font-size:0.9375rem; font-weight:800; cursor:pointer;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.3);}
  .culture-body{ padding:20px 18px 24px; text-align:left;}
  .culture-eyebrow{ font-size:0.6875rem; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
    color:var(--gray-dark); margin-bottom:6px;}
  .culture-title{ margin:0 0 10px; font-size:1.1875rem; line-height:1.25;}
  .culture-intro{ margin:0 0 6px; font-size:0.9062rem; line-height:1.5; font-style:italic; color:var(--gray-dark);}
  .culture-fact{ margin-top:15px; padding-top:13px; border-top:1px dashed rgba(43,38,32,.22);}
  .culture-fact h4{ margin:0 0 4px; font-size:0.9062rem;}
  .culture-fact p{ margin:0; font-size:0.875rem; line-height:1.5;}
  .culture-phrase{ margin-top:20px; padding:13px 12px; border-radius:10px; background:var(--card-bg);
    display:flex; flex-direction:column; align-items:center; gap:3px; text-align:center;}
  .culture-phrase-kr{ font-size:1.25rem; font-weight:800; display:inline-flex; align-items:center; gap:6px;}
  .culture-phrase-roman{ font-size:0.8125rem; font-style:italic; color:var(--gray-dark);}
  .culture-phrase-de{ font-size:0.8438rem; font-weight:700;}
  .scroll-trainer-body{ text-align:center;}
  .scroll-unit.expanded .scroll-trainer-body{ padding:4px 16px 18px;}
  .scroll-trainer-body .trainer-emoji{ margin-top:6px;}
  .scroll-trainer-body .recap-list{ margin-top:14px;}

  /* ---- Joseon-Landschafts-Hintergrund: ein sich vertikal endlos
     wiederholendes Bild-Panel (Nachthimmel, Sonne, Berge, Kiefer,
     Wasserfall, Wellenmuster) im Stil eines Irwolobongdo-Hofschirms —
     siehe #joseonBg weiter unten im <body>. Liegt fix hinter der ganzen
     App und wird per JS beim Scrollen SEHR VIEL LANGSAMER verschoben als
     der Vordergrund (Parallax). Nur im Joseon-Stil sichtbar. ---- */
  #joseonBg{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; display:none;}
  body.theme-joseon #joseonBg{ display:block;}

  /* ---- "Abendlicht": derselbe Joseon-Stil bei Lampenlicht ----
     Kein zweites Layout, sondern dieselben Variablen noch einmal — nur
     mit umgedrehten Helligkeiten: dunkles Papier, warme Tinte. Weil
     body.theme-night IMMER zusammen mit body.theme-joseon gesetzt wird
     (s. applyTheme), erbt das Abendlicht sämtliche Joseon-Bausteine und
     überschreibt hier ausschließlich Farben.
     Zwei Regeln haben die Auswahl bestimmt:
     - Nichts ist reines Schwarz oder reines Weiß. Papier bleibt Papier,
       nur eben im Schatten; Text ist gebrochenes Elfenbein, damit er
       abends nicht blendet.
     - Die Signalfarben (richtig/falsch, Blütenrosé) behalten ihren
       Farbton und verlieren nur an Helligkeit — sonst müsste man ihre
       Bedeutung neu lernen. ---- */
  body.theme-night{
    --green:#5c8f74; --green-dark:#3f6a55; --blue:#5b7fa6; --blue-dark:#415f7f;
    --red:#c05046; --red-dark:#93332b; --yellow:#c9a227; --yellow-dark:#a2801c;
    --gray:#3d3527; --gray-dark:#a2916f; --text:#efe4c9; --bg:#211c15;
    --page-bg:#15120d; --card-bg:#2a2419;
    --purple:#8b6a9c; --purple-dark:#66507a; --slate:#7d7364; --amber:#c8933f;
    --streak-color:#d8813f; --xp-color:#d0a34a;
    --info-bg:#2b2519; --option-hover-bg:#332c1f; --option-selected-bg:#3d3527;
    --correct-bg:#2c3f2b; --wrong-bg:#432724; --build-active-bg:#2b2519;
    --phase-intro-bg:#25303b; --phase-reinforce-bg:#3a3120; --phase-reinforce-text:#e0bd6a;
    --phase-apply-bg:#28331f; --phase-hangultrainer-bg:#2f2739; --phase-mistakes-bg:#3b2724;
    --overlay-bg:rgba(8,6,4,.72);
    --blossom-bg:#5c3243;
    background:
      radial-gradient(circle at 15% 12%, rgba(201,162,39,.07), transparent 55%),
      radial-gradient(circle at 85% 78%, rgba(201,162,39,.05), transparent 55%),
      var(--page-bg);
  }
  /* Die Landschaft im Hintergrund ist bereits in dunklen Jadetönen
     gemalt — sie muss nur zurücktreten, nicht umgefärbt werden. */
  /* Bewusst KEIN filter: Ein Filter auf dem Elternteil müsste bei jeder
     Verschiebung des Hintergrunds neu angewandt werden — genau die Art
     Arbeit pro Bild, die das Zittern verursacht hat. Ein ruhender
     Schleier darüber kostet nichts und wirkt genauso. */
  body.theme-night #joseonBg::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:rgba(10,15,12,.55);
  }

/* =========================================================

  {id:'basics2Grammar1', title:'Grammatik: 은/는 und das Verb „sein"', icon:'🧩', type:'grammar', topic:'basics2', topicTitle:'Ich & Du',
    grammar:{
      heading:'Der Satz-Baukasten: 은/는 und das Verb „sein"',
      intro:'<p>Zwei Bausteine machen aus einzelnen Wörtern einen Satz.</p>'
        + '<ol>'
        + '<li><strong>Die Themenpartikel 은/는</strong> hängt direkt ans Wort, über das der Satz spricht, und bedeutet ungefähr „was … betrifft". Die Wahl richtet sich nach dem letzten Laut:'
        + '<ul><li>Endet das Wort auf einen <strong>Konsonanten</strong> (받침) → <strong>은</strong> (z. B. 이름 → 이름은)</li>'
        + '<li>Endet das Wort auf einen <strong>Vokal</strong> → <strong>는</strong> (z. B. 저 → 저는)</li></ul>'
        + 'Das ist dieselbe Konsonant/Vokal-Logik wie bei den Höflichkeitsformen aus der Einheit „Begrüßungen“.'
        + '</li>'
        + '<li><strong>Das Verb „sein" (이다)</strong> hängt ebenfalls direkt an ein Nomen und hat dieselben zwei Register wie jedes andere Verb:'
        + '<ul><li>격식체 <strong>입니다</strong> (förmlich)</li>'
        + '<li>해요체 <strong>-이에요/예요</strong> (alltäglich — -이에요 nach Konsonant, -예요 nach Vokal)</li></ul>'
        + '</li>'

    grammar:{
      heading:'Sino-koreanisch oder einheimisch?',
      intro:'<p>Beide Reihen sind jetzt bekannt. Die entscheidende Frage im Alltag lautet deshalb nicht mehr „wie heißt die Zahl", sondern <strong>„welche Reihe gehört hierhin"</strong>. Die Antwort hängt nicht an der Zahl, sondern an dem <strong>Wort, das dahinter steht</strong>:</p>'
        + '<ul>'
        + '<li><strong>Einheimisch</strong> (하나, 둘, 셋 …) vor <strong>개, 명, 살, 시</strong> — also überall dort, wo etwas gezählt wird: Dinge, Menschen, Lebensjahre, Stunden.</li>'
        + '<li><strong>Sino-koreanisch</strong> (일, 이, 삼 …) vor <strong>원, 분</strong> und bei Nummern, Datum und allem ab hundert — also überall dort, wo etwas gemessen oder benannt wird.</li>'

        + '<ol>'

        + '<li><strong>Geld, Nummer oder Minute? → sino-koreanisch.</strong> 이천 원, 삼십 분, 공일공.</li>'

        + '<p>Und nicht vergessen: vor einem Zählwort werden 하나, 둘, 셋, 넷 zu <strong>한, 두, 세, 네</strong>.</p>',

  /* Grammatik-Lektion der Einheit „Familie“ (Roadmap-Thema "Besitz anzeigen").

  {id:'familyGrammar1', title:'Grammatik: die Partikel 의', icon:'🧬', type:'grammar', topic:'family', topicTitle:'Familie',
    grammar:{
      heading:'Wem gehört was? Die Partikel 의',
      intro:'<p>Für „mein", „dein" oder „der Vater von Sara" gibt es im Koreanischen keine eigenen Wörter — es gibt <strong>eine einzige Partikel</strong>, und die hängt man an den Besitzer:</p>'
        + '<p style="text-align:center"><strong>Besitzer + 의 + Besitz</strong> — 사라의 어머니 („Saras Mutter")</p>'
        + '<p>Die Reihenfolge ist also wie im Englischen <em>Sara’s mother</em>, nicht wie im Deutschen „die Mutter von Sara". Wer besitzt, steht vorn.</p>'
        + '<p><strong>Aussprache-Falle:</strong> 의 wird als Partikel fast immer wie <strong>에</strong> (e) gesprochen, nicht wie „ui" — geschrieben bleibt es trotzdem 의.</p>'
        + '<p><strong>Die drei Zusammenziehungen</strong>, die du dauernd brauchst:</p>'
        + '<ul>'
        + '<li>저 + 의 → <strong>제</strong> („mein", höflich)</li>'
        + '<li>나 + 의 → <strong>내</strong> („mein", locker)</li>'
        + '<li>너 + 의 → <strong>네</strong> („dein", locker)</li>'
        + '</ul>'
        + '<p>Damit löst sich rückwirkend ein Rätsel aus der Einheit „Ich & Du“: <strong>제 이름은 사라예요</strong> heißt Baustein für Baustein „<em>meiner</em> Name betreffend ist Sara" — das 제 war die ganze Zeit 저 + 의.</p>'
        + '<p><strong>Oft fällt 의 einfach weg.</strong> Im Alltag sagt man meist 아버지 이름 statt 아버지의 이름. Bei zwei Nomen nebeneinander ist der Besitz auch ohne Partikel klar.</p>'
        + '<p><strong>Und die wichtigste Ausnahme:</strong> Über die eigene Familie spricht man mit <strong>우리</strong> („unser"), nicht mit 제. Es heißt <strong>우리 어머니</strong>, auch wenn nur eine Person spricht und im Deutschen „meine Mutter" stünde. Dasselbe gilt für 우리 가족, 우리 집, sogar 우리 나라. Die Familie gehört sprachlich immer der Gruppe, nie einer einzelnen Person.</p>',
      examples:[
        {kr:'제 이름', roman:'je ireum', de:'mein Name — 저 + 의'},
        {kr:'사라의 어머니', roman:'saraui eomeoni', de:'Saras Mutter'},
        {kr:'친구의 동생', roman:'chinguui dongsaeng', de:'das jüngere Geschwister meiner Freundin'},

        {kr:'우리 어머니', roman:'uri eomeoni', de:'meine Mutter — bei Familie immer 우리'},
        {kr:'우리 가족', roman:'uri gajok', de:'meine Familie'}
      ]
    },
    templateIds:['possession-particle-cloze', 'my-thing-cloze', 'family-intro-sentence']
  },

  {id:'foodGrammar1', title:'Grammatik: 을/를 und die Verbform', icon:'🍽️', type:'grammar', topic:'food', topicTitle:'Essen & Trinken',
    grammar:{
      heading:'Der erste vollständige Satz: Ich esse Kimchi',
      intro:'<p>Bis hierher hatte jeder Satz dieselbe Form: <em>A ist B</em>. Mit einem echten Verb kommt jetzt ein drittes Satzglied dazu — das <strong>Objekt</strong>, also das, womit etwas geschieht. Und wie alles im Koreanischen wird es durch eine <strong>Partikel</strong> markiert:</p>'
        + '<ul>'
        + '<li>Endet das Wort auf einen <strong>Konsonanten</strong> → <strong>을</strong> (밥 → 밥을)</li>'
        + '<li>Endet das Wort auf einen <strong>Vokal</strong> → <strong>를</strong> (김치 → 김치를)</li>'
        + '</ul>'
        + '<p>Das ist dieselbe Konsonant/Vokal-Logik wie bei 은/는 (Einheit „Ich & Du“) und 이/가 (Einheit „Ich & Du“) — nur eine dritte Partikel für eine dritte Aufgabe. Drei Partikeln, ein Prinzip:</p>'
        + '<table class="pos-table"><thead><tr><th>Partikel</th><th>markiert</th><th>nach Konsonant</th><th>nach Vokal</th></tr></thead><tbody>'
        + '<tr><td>Thema</td><td>worüber gesprochen wird</td><td>은</td><td>는</td></tr>'
        + '<tr><td>Subjekt</td><td>wer handelt</td><td>이</td><td>가</td></tr>'
        + '<tr><td>Objekt</td><td>womit gehandelt wird</td><td><strong>을</strong></td><td><strong>를</strong></td></tr>'
        + '</tbody></table>'
        + '<p><strong>Das Verb steht am Ende.</strong> Immer. Die koreanische Satzstellung ist <strong>Subjekt – Objekt – Verb</strong>:</p>'
        + '<p style="text-align:center"><strong>저는 김치를 먹어요.</strong><br>„Ich – Kimchi – esse."</p>'
        + '<p>Wörtlich also „Ich Kimchi esse". Man muss bis zum Schluss zuhören, denn erst das letzte Wort verrät, was überhaupt passiert.</p>'
        + '<p><strong>Woher kommt die Endung -아요/-어요?</strong> Das ist die 해요체-Form aus der Einheit „Begrüßungen“, jetzt an einem Verb statt an einer festen Floskel:</p>'
        + '<ul>'
        + '<li>먹다 („essen") → Stamm <strong>먹-</strong> → 먹 + 어요 = <strong>먹어요</strong></li>'
        + '<li>마시다 („trinken") → Stamm <strong>마시-</strong> → 마시 + 어요 verschmilzt zu <strong>마셔요</strong></li>'
        + '<li>좋아하다 („mögen") → Stamm <strong>좋아하-</strong> → 하 + 여요 verschmilzt zu <strong>해요</strong> → <strong>좋아해요</strong></li>'
        + '</ul>'
        + '<p>Man nimmt also den Wortstamm (alles vor dem -다 der Wörterbuchform) und hängt die Endung an. Ob 아요 oder 어요, entscheidet der letzte Vokal des Stammes — und wo zwei Vokale aufeinandertreffen, verschmelzen sie, wie bei 마시어요 → 마셔요.</p>',
      examples:[

        {kr:'저는 커피를 마셔요', roman:'jeoneun keopireul masyeoyo', de:'Ich trinke Kaffee', register:'polite'},

        {kr:'친구는 라면을 먹어요', roman:'chinguneun ramyeoneul meogeoyo', de:'Meine Freundin isst Ramyeon', register:'polite'}

    },

  {id:'foodGrammar2', title:'Sätze bauen — und weglassen', icon:'🧱', type:'grammar', topic:'food', topicTitle:'Essen & Trinken',
    grammar:{
      heading:'Drei Partikeln, ein Satz — und wann keine davon',
      intro:'<p>Du hast jetzt alle Bausteine für einen vollständigen koreanischen Satz beisammen. Der Bauplan ist immer derselbe:</p>'
        + '<p style="text-align:center"><strong>Thema/Subjekt → Objekt → Verb</strong></p>'

  {id:'colorsGrammar2', title:'Adjektive sind Verben', icon:'🔁', type:'grammar', topic:'colors', topicTitle:'Farben',
    grammar:{
      heading:'Warum 좋아요 und 먹어요 gleich aussehen',
      intro:'<p>Dir ist vielleicht schon aufgefallen, dass 커요, 작아요 und 예뻐요 genau dieselbe Endung tragen wie 먹어요 und 마셔요. Das ist kein Zufall: <strong>Im Koreanischen sind Adjektive eine Art Verb.</strong></p>'
        + '<p>Sie haben eine Wörterbuchform auf -다 (크다, 작다, 예쁘다), einen Stamm und dieselbe 해요체-Endung. Man sagt also nicht „ist groß" mit zwei Wörtern, sondern <strong>커요</strong> — ein einziges Wort, das „groß-sein" konjugiert.</p>'

        + '<ul>'
        + '<li><strong>좋아요</strong> („gut") aus der Begrüßungs-Einheit — ein Adjektiv-Verb von 좋다.</li>'
        + '<li><strong>맛있어요</strong> („lecker") aus der Essens-Einheit — von 맛있다.</li>'
        + '<li><strong>매워요</strong> („scharf") — von 맵다, ㅂ-unregelmäßig wie 고맙다 → 고마워요.</li>'
        + '</ul>'
        + '<p><strong>Der eine Unterschied zum Verb</strong> steckt in der attributiven Form. Adjektive nehmen <strong>-(으)ㄴ</strong>, Handlungsverben nehmen -는:</p>'
        + '<table class="pos-table"><thead><tr><th>Wörterbuchform</th><th>am Satzende</th><th>vor dem Nomen</th></tr></thead><tbody>'
        + '<tr><td>크다 (groß sein)</td><td>커요</td><td><strong>큰</strong> 사과</td></tr>'
        + '<tr><td>작다 (klein sein)</td><td>작아요</td><td><strong>작은</strong> 의자</td></tr>'

        + '<p>Die Regel für -(으)ㄴ ist dieselbe Konsonant/Vokal-Logik wie überall: endet der Stamm auf einen Vokal, kommt nur ㄴ dazu (크- → 큰); endet er auf einen Konsonanten, kommt 은 (작- → 작은).</p>'

      intro:'<p>Für „wo" gibt es im Koreanischen zwei Partikeln — und der Unterschied zwischen ihnen ist der wichtigste dieser Einheit.</p>'
