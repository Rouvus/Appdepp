/* Baut aus lesson.templateIds die daraus resultierenden cloze-/sentence-
   Übungen — genutzt sowohl von buildVocabApplyExercises als auch von
   buildGrammarApplyExercises, damit beide Lektionstypen dieselbe, EINE
   Vorlagen-Engine nutzen statt zweier paralleler Mechanismen. */
function buildTemplateApplyExercises(lesson){
  const exs = [];
  (lesson.templateIds || []).forEach(tid => {
    const tpl = TEMPLATES[tid];
    if(!tpl) return;
    const data = tpl.build(lesson);
    if(!data) return;
    // Die Vorlagen-Kennung wandert in die Übung (s. masteryKeyFor) —
    // erst dadurch ist die Frage über alle Zufallsziehungen hinweg
    // dieselbe und kann als gemeistert gelten.
    data.templateId = tid;
    const ex = tpl.kind === 'cloze' ? makeClozeExercise(data, lesson.id) : makeSentenceExercise(data, lesson.id);
    if(ex) exs.push(ex);
  });
  return exs;
}
function buildGrammarApplyExercises(lesson){
  const exs = lesson.grammar.examples.map(e => makeRegisterMcExercise(e, lesson.id)).filter(Boolean);
  exs.push(...buildTemplateApplyExercises(lesson));
  return exs;
}
function buildGrammarSteps(lesson){
  const g = lesson.grammar;
  const steps = [];
  const badgedExamples = g.examples.map(e => ({ kr:e.kr, roman:e.roman, badge:REGISTER_LABELS[e.register], badgeClass: e.register === 'formal' ? 'badge-formal' : 'badge-polite' }));
  steps.push({ phase:'intro', kind:'concept', heading:g.heading, text:g.intro, examples:badgedExamples });
  const recapItems = g.examples.map(e => ({ kr:e.kr, roman:e.roman, de:e.de }));
  steps.push({ phase:'reinforce', kind:'recap', items: shuffle(recapItems), isHangul:false });
  const applyExs = buildGrammarApplyExercises(lesson);
  steps.push(...shuffle(applyExs));
  return steps;
}
/* Wiederholungslektion: die VOLLSTÄNDIGE, ungekürzte Liste aller
   möglichen Abfragen aus dem in buildReviewLesson() eingesammelten Pool
   (alles, was VOR dieser Wiederholung im Kurs gelernt wurde) — über ALLE
   dafür verfügbaren Übungsformen hinweg (MC, Tippen, Silben-/Wortbau,
   Lückentext, Satzbau), s. Kommentar bei insertReviewLessons weiter unten.
   lessonId bleibt bewusst die der URSPRÜNGLICHEN Lektion (nicht der
   Wiederholungslektion selbst) — so landet ein Fehler hier im
   Fehlertrainer unter demselben Eintrag wie ein Fehler in der
   Original-Lektion, statt einen doppelten zu erzeugen, und
   rebuildExerciseFromMistake() findet über m.lessonId weiterhin die
   richtige (echte Vokabel-/Hangul-)Lektion für den Distraktor-Pool. */
function buildReviewApplyExercises(lesson){
  const vocabItems = lesson.reviewVocabItems || [];
  const wordItems = lesson.reviewWordItems || [];
  const clozeItems = lesson.reviewClozeItems || [];
  const sentenceItems = lesson.reviewSentenceItems || [];
  const vocabPool = vocabItems.map(x => x.v);
  const wordPool = wordItems.map(x => x.w);
  const allConsonants = CONSONANTS.concat(DOUBLE_CONSONANTS);
  const allVowels = VOWELS.concat(DOUBLE_VOWELS);
  // Für Wortbau-Übungen aus Hangul-Alltagswörtern gilt (wie in
  // buildHangulApplyExercises) weiterhin: nur Buchstaben, die an DIESER
  // Stelle des Kurses schon bekannt sind. getCumulativeHangulLetters
  // arbeitet über die tatsächliche COURSE-Position der Wiederholung
  // selbst (COURSE.indexOf(lesson)) und funktioniert daher unverändert
  // auch nach dem Einfügen der Wiederholungslektionen.
  const cumulative = getCumulativeHangulLetters(lesson);
  const cumulativeConsonants = cumulative.filter(l => l.kind === 'consonant');
  const cumulativeVowels = cumulative.filter(l => l.kind === 'vowel');
  const exs = [];
  vocabItems.forEach(({ v, lessonId }) => {
    exs.push(makeVocabMcExercise(v, vocabPool, 'term-to-meaning', 'apply', lessonId));
    exs.push(makeVocabMcExercise(v, vocabPool, 'meaning-to-term', 'apply', lessonId));
    exs.push(makeVocabTypeExercise(v, lessonId));
    // Alle Buchstaben sind längst bekannt, sobald überhaupt eine Vokabel
    // im Wiederholungs-Pool landen kann (s. buildVocabApplyExercises),
    // deshalb hier bewusst das volle Buchstaben-Set statt eines
    // kumulativen Teil-Pools.
    const kr = v.kr || '';
    const isClean = kr.length > 0 && !/\s/.test(kr);
    if(isClean && kr.length >= 2){
      const buildWordEx = makeBuildWordExercise(v, allConsonants, allVowels, 'apply', lessonId, null, `Baue das Wort „${v.roman}"`);
      if(buildWordEx) exs.push(buildWordEx);
    } else if(isClean && kr.length === 1){
      const buildEx = makeBuildExercise(kr, v.roman, allConsonants, allVowels, 'apply', lessonId, null, `Baue die Silbe „${v.roman}"`);
      if(buildEx) exs.push(buildEx);
    }
    const romanizeEx = makeRomanizeWordExercise(v, 'apply', lessonId);
    if(romanizeEx) exs.push(romanizeEx);
    // Hörverstehen (Feedback vom 24.08.2026): nur, wenn das Gerät
    // überhaupt eine koreanische Stimme hat — s. listenExercisesAvailable.
    if(listenExercisesAvailable() && canSpeak(v.kr)) exs.push(makeListenExercise(v, vocabPool, 'vocab', 'apply', lessonId));
  });
  wordItems.forEach(({ w, lessonId }) => {
    exs.push(makeHangulWordMcExercise(w, wordPool, 'term-to-meaning', 'apply', lessonId));
    exs.push(makeHangulWordMcExercise(w, wordPool, 'meaning-to-term', 'apply', lessonId));
    // s. wordHasOnlyTwoBlockSyllables-Kommentar bei buildHangulApplyExercises:
    // Wörter MIT 받침 dürfen als Wortbau-Übung erst auftauchen, sobald
    // "Zwei oder drei Blöcke?" bekannt ist — genau das prüft dieser Gate
    // auch hier, statt das Prinzip "nie unerklärte Konzepte abfragen" in
    // frühen Wiederholungen zu verletzen.
    if(wordHasOnlyTwoBlockSyllables(w)){
      const buildWordEx = makeBuildWordExercise(w, cumulativeConsonants, cumulativeVowels, 'apply', lessonId, null, `Baue das Wort „${w.roman}"`);
      if(buildWordEx) exs.push(buildWordEx);
    }
    const romanizeEx = makeRomanizeWordExercise(w, 'apply', lessonId);
    if(romanizeEx) exs.push(romanizeEx);
    if(listenExercisesAvailable() && canSpeak(w.kr)) exs.push(makeListenExercise(w, wordPool, 'hangulword', 'apply', lessonId));
  });
  // Neu (Feedback vom 22.08.2026): Lückentext-/Satzbau-Beispiele aus
  // bereits abgeschlossenen Grammatik-/Vokabel-Lektionen fließen ebenfalls
  // in den Wiederholungs-Pool ein — sonst kämen diese vom Nutzer explizit
  // genannten Übungsformen in Wiederholungen nie vor.
  // Vorlagen (s. TEMPLATES weiter oben) werden hier bei JEDEM Aufbau der
  // Wiederholung FRISCH instanziiert (uptoLesson = die Wiederholung selbst,
  // s. instantiateTemplate/getKnownCategoryItems) — bei den offenen
  // Vorlagen kann daher jeder Durchlauf einen anderen, aber immer
  // korrekten Satz liefern ("die Wiederholungsübungen stehen vor dem
  // Start noch nicht fest, nur die Formel", Feedback vom 22.08.2026).
  // lessonId bleibt bewusst die der Lektion, die die Vorlage deklariert
  // hat (nicht die der Wiederholung selbst) — unverändert gegenüber der
  // alten Fassung, aus denselben Gründen (Fehlertrainer-Zuordnung).
  clozeItems.forEach(({ templateId, lessonId }) => {
    const data = instantiateTemplate(templateId, lesson);
    if(data) data.templateId = templateId;
    const ex = data ? makeClozeExercise(data, lessonId) : null;
    if(ex) exs.push(ex);
  });
  sentenceItems.forEach(({ templateId, lessonId }) => {
    const data = instantiateTemplate(templateId, lesson);
    if(data) data.templateId = templateId;
    const ex = data ? makeSentenceExercise(data, lessonId) : null;
    if(ex) exs.push(ex);
  });
  return exs;
}
/* Wählt für EINEN Durchlauf genau REVIEW_EXERCISE_COUNT Übungen — nie
   mehr, auch wenn der Pool mit der Zeit immer größer wird (Feedback vom
   22.08.2026: "Wiederholungen sollten nicht immer größer werden"). Zwei
   weitere Regeln kamen mit dem Vorlagen-System dazu (ebenfalls Feedback
   vom 22.08.2026):
   1. "Primär aus Lücken und Satzbau": innerhalb jedes weiter unten
      beschriebenen "Eimers" werden cloze-/sentence-Übungen bevorzugt vor
      MC/Tippen/Bau/Umschrift gewählt — Letztere füllen nur auf, wenn
      nicht genug Lücken-/Satzbau-Inhalt zur Verfügung steht.
   2. "66% aus der letzten Lektion, 33% zufällig aus allem Früheren": der
      volle Übungs-Pool wird nach mistakeMeta.lessonId in zwei Eimer
      geteilt — Übungen, deren Ursprung die unmittelbar VOR dieser
      Wiederholung liegende Lektion ist ("fromLastLesson"), und alles
      Ältere ("fromEarlier"). Reicht ein Eimer nicht aus (kleiner Pool,
      z. B. ganz am Anfang von der Einheit „Begrüßungen“), wird am Ende aus dem
      Gesamtpool aufgefüllt, statt die Wiederholung künstlich zu
      verkleinern.
   Die bisherige Vermeidung von Wiederholungen des letzten Durchlaufs
   (reviewLastUsed) bleibt als zusätzliche, dritte Priorisierungsebene
   erhalten: innerhalb jedes Eimers werden zuerst noch "frische" (beim
   letzten Durchlauf NICHT gezeigte) Übungen gewählt. Bei den offenen
   Vorlagen (s. TEMPLATES) ist ohnehin fast jede Instanziierung neu, da
   sich der zufällig eingesetzte Wortschatz von Durchlauf zu Durchlauf
   meist unterscheidet. */
function buildReviewSteps(lesson){
  const applyExs = buildReviewApplyExercises(lesson);
  if(applyExs.length === 0) return [];

  const idx = COURSE.indexOf(lesson);
  const lastLessonId = idx > 0 ? COURSE[idx - 1].id : null;
  const isClozeOrSentence = ex => ex.kind === 'cloze' || ex.kind === 'sentence';
  const lastUsed = new Set(reviewLastUsed[lesson.id] || []);

  function orderedByPriority(items){
    const fresh = items.filter(ex => !lastUsed.has(masteryKeyFor(ex)));
    const stale = items.filter(ex => lastUsed.has(masteryKeyFor(ex)));
    // Dritte Priorität (Feedback vom 24.08.2026): innerhalb jeder Gruppe
    // zuerst das, was laut Gedächtnis-Modell gerade fällig ist. Bewusst
    // ALS TIEBREAKER unter der Lücken-/Satzbau-Priorität, nicht darüber —
    // die Wiederholung soll weiterhin in erster Linie aus Lücken- und
    // Satzbau-Übungen bestehen, nur die Auswahl INNERHALB dieser Formen
    // richtet sich jetzt nach der Vergessenswahrscheinlichkeit.
    const byDue = list => shuffle(list.filter(ex => isDue(masteryKeyFor(ex))))
      .concat(shuffle(list.filter(ex => !isDue(masteryKeyFor(ex)))));
    const rank = list => byDue(list.filter(isClozeOrSentence)).concat(byDue(list.filter(ex => !isClozeOrSentence(ex))));
    return rank(fresh).concat(rank(stale));
  }

  const fromLastLesson = applyExs.filter(ex => ex.mistakeMeta && ex.mistakeMeta.lessonId === lastLessonId);
  const fromEarlier = applyExs.filter(ex => !(ex.mistakeMeta && ex.mistakeMeta.lessonId === lastLessonId));
  const targetLast = Math.round(REVIEW_EXERCISE_COUNT * 0.66);
  const targetEarlier = REVIEW_EXERCISE_COUNT - targetLast;

  let chosen = orderedByPriority(fromLastLesson).slice(0, targetLast)
    .concat(orderedByPriority(fromEarlier).slice(0, targetEarlier));

  if(chosen.length < REVIEW_EXERCISE_COUNT){
    const usedIds = new Set(chosen.map(ex => ex.id));
    const rest = orderedByPriority(applyExs.filter(ex => !usedIds.has(ex.id)));
    chosen = chosen.concat(rest.slice(0, REVIEW_EXERCISE_COUNT - chosen.length));
  }
  chosen = chosen.slice(0, REVIEW_EXERCISE_COUNT);

  reviewLastUsed[lesson.id] = chosen.map(masteryKeyFor).filter(Boolean);
  saveState();
  return shuffle(chosen);
}
function generateExercises(lesson){
  if(lesson.type === 'hangul') return buildHangulSteps(lesson);
  if(lesson.type === 'concept') return buildConceptSteps(lesson);
  if(lesson.type === 'grammar') return buildGrammarSteps(lesson);
  if(lesson.type === 'review') return buildReviewSteps(lesson);
  return buildVocabSteps(lesson);
}
/* =========================================================
   FRAGEN-FORTSCHRITT (für Einheiten-Freischaltung + Zähler)
   Jede Übungs-Frage bekommt einen stabilen "Mastery-Key" — abgeleitet
   aus ihren mistakeMeta-Feldern (entryKind + term + direction), OHNE
   die Lektions-ID. So zählt es für den Fortschritt egal, ob die Frage
   in der Lektion selbst, im Vokabel-/Hangul-Trainer oder im
   Fehlertrainer richtig beantwortet wurde — es ist inhaltlich immer
   dieselbe Frage. Eine Einheit gilt erst als gemeistert, wenn JEDER
   ihrer Mastery-Keys mindestens einmal richtig beantwortet wurde. */
/* VORLAGEN-ÜBUNGEN BRAUCHEN EINEN STABILEN SCHLÜSSEL (Feedback vom
   25.08.2026: "Ich habe in der Lektion Sechs bis zehn alles mehrmals
   richtig, bekomme aber nicht die volle Punktzahl im Counter").

   Ursache: Bei OFFENEN Vorlagen (s. TEMPLATES) zieht jeder Aufruf einen
   anderen konkreten Satz. Der Mastery-Key wurde aber aus dem Satzinhalt
   gebildet ("cloze:오 –_– 칠:fill") — also bei jedem Aufbau ein anderer.
   getLessonQuestionKeys() instanziiert die Vorlagen für den ZÄHLER neu
   und bekam dadurch andere Schlüssel als die Übung, die der Lernende
   gerade beantwortet hat: die Vorlagen-Frage konnte nie als gemeistert
   gelten. Gemessen vor dem Fix: "Sechs bis zehn" zeigte 16 Fragen, hatte
   aber 23 mögliche Schlüssel; "Grammatik: Zähleinheiten" zeigte 3 und
   hatte 151 — dort war voller Fortschritt praktisch unerreichbar.

   Fix: Eine Vorlagen-Übung wird über die VORLAGE identifiziert, nicht
   über den zufällig gezogenen Satz — eine Vorlage ist damit genau EINE
   Frage im Zähler. Übungen ohne Vorlage (Vokabeln, Hangul, Buchstaben)
   verhalten sich unverändert.

   Bewusst NICHT feiner aufgelöst: Der naheliegende Gedanke, eine Vorlage
   mit mehreren Fällen (z. B. 개 / 명 / 살) in mehrere Schlüssel
   aufzuteilen, bringt genau dasselbe Problem in klein zurück — welchen
   Fall build() zieht, ist ja wieder zufällig, und der Zähler könnte
   erneut Schlüssel auflisten, die die Sitzung gar nicht gestellt hat.
   Ein "variantKey"-Feld ist deshalb zwar vorgesehen (s. u.), darf aber
   erst benutzt werden, wenn eine Vorlage ihre Fälle STATISCH auflistet
   und getLessonQuestionKeys sie alle erzeugen kann. Bis dahin gilt:
   eine Vorlage, ein Schlüssel. */
function masteryKeyFor(ex){
  if(!ex || !ex.mistakeMeta) return null;
  const m = ex.mistakeMeta;
  if(m.templateId){
    // Die Richtung (de-kr/kr-de) gehört hier bewusst NICHT in den
    // Schlüssel: role-statement-sentence z. B. würfelt sie pro Aufbau aus,
    // und schon das allein hätte dieselbe Instabilität zurückgebracht.
    return `${m.entryKind}:tpl:${m.templateId}${m.variantKey ? ':' + m.variantKey : ''}`;
  }
  return `${m.entryKind}:${m.term}:${m.direction}`;
}
function getLessonApplyExercises(lesson){
  if(lesson.type === 'hangul') return buildHangulApplyExercises(lesson);
  if(lesson.type === 'concept') return buildConceptApplyExercises(lesson);
  if(lesson.type === 'grammar') return buildGrammarApplyExercises(lesson);
  if(lesson.type === 'review') return buildReviewApplyExercises(lesson);
  return buildVocabApplyExercises(lesson);
}
function getLessonQuestionKeys(lesson){
  return Array.from(new Set(getLessonApplyExercises(lesson).map(masteryKeyFor).filter(Boolean)));
}
/* Einmalige Migration für bestehende Spielstände (Feedback vom
   25.08.2026, s. masteryKeyFor): Vorlagen-Fragen heißen ab jetzt
   "cloze:tpl:<vorlage>:fill" statt "cloze:<zufälliger Satz>:fill". Die
   alten, inhaltsbasierten Schlüssel im Spielstand passen deshalb zu
   keinem der neuen — ohne Migration würde der Zähler einer bereits
   abgeschlossenen Einheit nachträglich absacken und die FOLGE-Einheit
   wieder zufallen. Das darf nie passieren (dasselbe Prinzip wie bei
   masteredQuestions insgesamt: einmal Erreichtes wird nie zurückgenommen).

   Deshalb: Für jede bereits ABGESCHLOSSENE Lektion gelten ihre Vorlagen-
   Schlüssel als gemeistert. Wer eine Lektion beendet hat, hat ihre
   Lückentext-/Satzbau-Übungen gesehen und beantwortet; die Migration ist
   damit eher großzügig als streng — und genau so herum ist sie richtig.
   Die alten, jetzt verwaisten Schlüssel bleiben unangetastet im
   Spielstand liegen: sie tauchen in keiner Frageliste mehr auf und
   verfälschen daher auch keinen Zähler. */
function migrateTemplateMasteryKeys(){
  if(templateMasteryMigrated) return;
  templateMasteryMigrated = true;
  COURSE.forEach(lesson => {
    if(lesson.type === 'review' || !completed.has(lesson.id)) return;
    getLessonApplyExercises(lesson).forEach(ex => {
      if(ex && ex.mistakeMeta && ex.mistakeMeta.templateId){
        const key = masteryKeyFor(ex);
        if(key) masteredQuestions.add(key);
      }
    });
  });
  saveState();
}
/* Wiederholungslektionen bewusst AUSGESCHLOSSEN: ihr gesamter Frage-Pool
   besteht per Definition aus Schlüsseln früherer (bereits vollständig
   gemeisterter) Einheiten — würden sie hier mitgezählt, würde der
   Fortschrittsbalken der AKTUELLEN Einheit sofort einen Teil "gratis"
   als bereits gemeistert anzeigen, ohne dass in dieser Einheit selbst
   etwas dafür getan wurde. Die Wiederholungslektion bleibt trotzdem ganz
   normal spielbar/abschließbar (eigener Stern-Status über "completed"),
   nur ihr Inhalt zählt nicht nochmal separat zur Einheiten-Freischaltung. */
function getUnitQuestionKeys(unit){
  const keys = [];
  COURSE.forEach(l => { if(l.type !== 'review' && getCourseUnit(l) === unit) keys.push(...getLessonQuestionKeys(l)); });
  return Array.from(new Set(keys));
}
function getUnitMasteryInfo(unit){
  const keys = getUnitQuestionKeys(unit);
  const masteredCount = keys.filter(k => masteredQuestions.has(k)).length;
  const reallyComplete = keys.length === 0 || masteredCount >= keys.length;
  /* "isComplete" steuert ausschließlich die Freischaltung der NÄCHSTEN
     Einheit — und die darf nie zurückgenommen werden (s. maxUnlockedUnit).
     Wer Einheit „Zahlen (nativ)“ erreicht hat, behält Einheit „Begrüßungen“–4 offen, auch wenn
     die Hangul-Einheit nachträglich eine Lektion dazubekommt. Der ANGEZEIGTE
     Zähler bleibt davon unberührt ehrlich: er zeigt dann z. B. 211/219
     und lädt damit ein, den neuen Stoff nachzuholen — nur eben, ohne
     dass zwischenzeitlich der halbe Kurs zufällt. */
  return { total: keys.length, mastered: masteredCount, isComplete: reallyComplete || unit < maxUnlockedUnit };
}
/* Zieht maxUnlockedUnit nach, sobald eine weitere Einheit gemeistert ist.
   Läuft beim Start und bei jedem Aufbau des Lernpfads. */
function refreshMaxUnlockedUnit(){
  let u = Math.max(maxUnlockedUnit, 0);
  while(COURSE_UNITS[u + 1] && getUnitMasteryInfo(u).isComplete) u++;
  if(u > maxUnlockedUnit){ maxUnlockedUnit = u; saveState(); }
}
/* Einmalige Ableitung für Spielstände, die den Wert noch nicht kennen:
   Die höchste Einheit, in der schon eine Lektion abgeschlossen wurde,
   war offen — also mindestens bis dorthin nichts zusperren. */
function migrateMaxUnlockedUnit(){
  if(maxUnlockedUnit >= 0) return;
  let u = 0;
  COURSE.forEach(l => { if(l.type !== 'review' && completed.has(l.id)) u = Math.max(u, getCourseUnit(l)); });
  maxUnlockedUnit = u;
  saveState();
}
/* Wie getUnitMasteryInfo, aber für eine einzelne Lektion — zeigt den
   Fortschritts-Zähler (z. B. "10/10") neben jedem Lektionsnamen im
   Lernpfad. */
function getLessonMasteryInfo(lesson){
  const keys = getLessonQuestionKeys(lesson);
  const masteredCount = keys.filter(k => masteredQuestions.has(k)).length;
  return { total: keys.length, mastered: masteredCount, isComplete: keys.length === 0 || masteredCount >= keys.length };
}
/* =========================================================
   VOKABELTRAINER (Übungsbildschirm)
   Nutzt ausschließlich Wörter aus bereits abgeschlossenen
   Vokabel-Lektionen — alles darin wurde also vorher regulär
   eingeführt und wiederholt.
========================================================= */
function getLearnedVocabPool(){
  const pool = [];
  COURSE.forEach(lesson => {
    if(lesson.type === 'vocab' && completed.has(lesson.id)){
      lesson.vocab.forEach(v => pool.push(v));
    }
  });
  return pool;
}
function buildPracticeSteps(){
  // Der Vokabeltrainer übt sowohl Wörter aus echten Vokabel-Lektionen
  // als auch die Alltagswörter aus abgeschlossenen Hangul-Lektionen —
  // beide wurden ja regulär eingeführt und wiederholt, sind also
  // genauso "gelernte Vokabeln".
  const exs = buildPracticeExercisePool();
  if(exs.length === 0) return [];
  // Reihenfolge nicht mehr rein zufällig (Feedback vom 24.08.2026):
  // zuerst kommt, was laut Gedächtnis-Modell gerade fällig ist. Innerhalb
  // beider Gruppen weiterhin gemischt, damit sich zwei Durchläufe
  // hintereinander nicht gleich anfühlen.
  const ordered = shuffle(exs.filter(ex => isDue(masteryKeyFor(ex))))
    .concat(shuffle(exs.filter(ex => !isDue(masteryKeyFor(ex)))));
  return shuffle(ordered.slice(0, Math.min(ordered.length, PRACTICE_EXERCISE_COUNT)));
}
const PRACTICE_EXERCISE_COUNT = 24;
/* Gemeinsamer Übungs-Vorrat für Vokabeltrainer und die gezielte
   "Fällige wiederholen"-Sitzung: alle Wörter aus abgeschlossenen
   Vokabel- und Hangul-Lektionen, je Wort beide Leserichtungen und —
   sofern das Gerät koreanische Sprachausgabe hat — zusätzlich eine
   Hörverstehen-Übung. */
function buildPracticeExercisePool(){
  const vocabPool = getLearnedVocabPool();
  const wordPool = getLearnedHangulWords();
  if(vocabPool.length === 0 && wordPool.length === 0) return [];
  const withListen = listenExercisesAvailable();
  const exs = [];
  vocabPool.forEach(v => {
    exs.push(makeVocabMcExercise(v, vocabPool, 'term-to-meaning', 'practice', null));
    exs.push(makeVocabMcExercise(v, vocabPool, 'meaning-to-term', 'practice', null));
    if(withListen && canSpeak(v.kr)) exs.push(makeListenExercise(v, vocabPool, 'vocab', 'practice', null));
  });
  wordPool.forEach(w => {
    exs.push(makeHangulWordMcExercise(w, wordPool, 'term-to-meaning', 'practice', null));
    exs.push(makeHangulWordMcExercise(w, wordPool, 'meaning-to-term', 'practice', null));
    if(withListen && canSpeak(w.kr)) exs.push(makeListenExercise(w, wordPool, 'hangulword', 'practice', null));
  });
  return exs;
}
/* Gezielte Sitzung "Fällige wiederholen" (Feedback vom 24.08.2026):
   ausschließlich Fragen, deren Fälligkeitsdatum erreicht ist. Anders als
   der Vokabeltrainer füllt sie NICHT mit noch nicht fälligem Stoff auf —
   sind weniger als PRACTICE_EXERCISE_COUNT Fragen fällig, ist die
   Sitzung eben kürzer, und das ist die richtige Rückmeldung ("für heute
   durch"). */
function getDuePracticeExercises(){
  return buildPracticeExercisePool().filter(ex => isDueForReview(masteryKeyFor(ex)));
}
/* Kurzsitzung (Feedback vom 25.08.2026): fünf Fragen für den Bahnsteig.
   Bis dahin gab es nur eine Sitzungslänge — rund 21 Übungen, vier bis
   sechs Minuten. Wer nur neunzig Sekunden hat, fängt dann gar nicht erst
   an. Bevorzugt wird, was laut Gedächtnis-Modell gerade fällig ist;
   reicht das nicht, wird mit bereits Gelerntem aufgefüllt. */
const QUICK_EXERCISE_COUNT = 5;
function buildQuickSteps(){
  const pool = buildPracticeExercisePool();
  if(!pool.length) return [];
  const due = shuffle(pool.filter(ex => isDue(masteryKeyFor(ex))));
  const rest = shuffle(pool.filter(ex => !isDue(masteryKeyFor(ex))));
  return due.concat(rest).slice(0, QUICK_EXERCISE_COUNT)
    .map(ex => Object.assign({}, ex, { phase:'due' }));
}
/* Übungssitzung aus der Merkliste des Wörterbuchs. */
function buildFavoriteSteps(){
  if(!favorites.size) return [];
  const pool = buildPracticeExercisePool().filter(ex => ex.mistakeMeta && favorites.has(ex.mistakeMeta.term));
  if(!pool.length) return [];
  return shuffle(pool).slice(0, PRACTICE_EXERCISE_COUNT).map(ex => Object.assign({}, ex, { phase:'apply' }));
}
function buildDueSteps(){
  return shuffle(getDuePracticeExercises())
    .slice(0, PRACTICE_EXERCISE_COUNT)
    .map(ex => Object.assign({}, ex, { phase:'due' }));
}
/* =========================================================
   HANGUL-TRAINER
   Anders als der Vokabeltrainer (der ganze Wörter/Bedeutungen übt),
   fragt der Hangul-Trainer frei alle bereits gelernten EINZELBUCHSTABEN
   ab (Zeichen <-> Laut) UND die gelernten KOMBINATIONSREGELN — also die
   interaktive Silbenbau-Übung, sowohl anhand der Silben aus gelernten
   Wörtern als auch anhand der Beispiele aus abgeschlossenen "Konzept"-
   Lektionen (stummes ㅇ, 2-vs-3-Blöcke).
========================================================= */
function buildHangulTrainerSteps(){
  const letters = getLearnedHangulLetters();
  if(letters.length === 0) return [];
  const consonants = letters.filter(l => l.kind === 'consonant');
  const vowels = letters.filter(l => l.kind === 'vowel');
  const words = getLearnedHangulWords();
  const conceptExamples = getLearnedConceptExamples();
  const exs = [];
  letters.forEach(l => {
    const sameKindPool = l.kind === 'consonant' ? consonants : vowels;
    exs.push(makeHangulMcExercise(l, sameKindPool, 'term-to-meaning', 'hangultrainer', null));
    exs.push(makeHangulMcExercise(l, sameKindPool, 'meaning-to-term', 'hangultrainer', null));
  });
  // Jede Silbe nur einmal abfragen, auch wenn sie in mehreren Wörtern
  // oder Konzept-Beispielen vorkommt.
  const seenSyllables = new Set();
  words.forEach(w => {
    (w.syllables || []).forEach(syl => {
      if(seenSyllables.has(syl.ch)) return;
      seenSyllables.add(syl.ch);
      const ex = makeBuildExercise(syl.ch, syl.roman, consonants, vowels, 'hangultrainer', null, null,
        `Baue die Silbe „${syl.roman}"`);
      if(ex) exs.push(ex);
    });
  });
  conceptExamples.forEach(e => {
    if(seenSyllables.has(e.kr)) return;
    seenSyllables.add(e.kr);
    const ex = makeBuildExercise(e.kr, e.roman, consonants, vowels, 'hangultrainer', e.lessonId, null,
      `Baue die Silbe „${e.roman}" – Kombinationsregel`);
    if(ex) exs.push(ex);
  });
  // Ganze mehrsilbige Wörter nachbauen (siehe makeBuildWordExercise) sowie
  // die umgekehrte Richtung (Hangul lesen, Umschrift tippen — siehe
  // makeRomanizeWordExercise) kommen erst dazu, sobald die Hangul-Einheit
  // komplett gemeistert ist — vorher kennt man "Zwei oder drei Blöcke?"
  // (nötig für die Doppel-/Tri-Kontainer-Entscheidung) noch gar nicht.
  // Ganze mehrsilbige Wörter nachbauen (siehe makeBuildWordExercise) sowie
  // die umgekehrte Richtung (Hangul lesen, Umschrift tippen — siehe
  // makeRomanizeWordExercise): dieselbe Regel wie in
  // buildHangulApplyExercises — Wörter ganz ohne Schlusskonsonant/받침
  // sind immer sicher (nie eine untererklärte Blöcke-Entscheidung), 받침-
  // Wörter erst, sobald die Hangul-Einheit (inkl. "Zwei oder drei Blöcke?")
  // komplett gemeistert ist. Die Umschrift tippen braucht dagegen nie
  // dieses Konzeptwissen und ist immer erlaubt.
  const batchimKnown = getUnitMasteryInfo(0).isComplete;
  const seenWords = new Set();
  words.forEach(w => {
    if(w.kr.length < 2 || seenWords.has(w.kr)) return;
    seenWords.add(w.kr);
    if(wordHasOnlyTwoBlockSyllables(w) || batchimKnown){
      const buildEx = makeBuildWordExercise(w, consonants, vowels, 'hangultrainer', null, null, `Baue das Wort „${w.roman}"`);
      if(buildEx) exs.push(buildEx);
    }
    const romanizeEx = makeRomanizeWordExercise(w, 'hangultrainer', null);
    if(romanizeEx) exs.push(romanizeEx);
  });
  // Statt eines reinen shuffle().slice(): garantiert, dass jede vorhandene
  // Übungsart (Buchstaben-MC, Silbenbau, Wortbau, Umschrift-Tippen) in der
  // Sitzung mindestens einmal vorkommt.
  return pickWithKindCoverage(exs, 24);
}
/* =========================================================
   FEHLERTRAINER
   Baut aus jedem gemerkten Fehler wieder eine aktive Abfrage.
   Distraktoren kommen aus dem Wortschatz der Ursprungslektion
   (bzw. bei gemischten Vokabeltrainer-Fehlern aus dem gesamten
   gelernten Wortschatz) — nie aus noch nicht gelernten Inhalten.
========================================================= */
function rebuildExerciseFromMistake(m){
  if(m.entryKind === 'draw'){
    return makeDrawExercise({ ch:m.term, roman:m.roman, kind:m.kind }, 'mistakes', m.id);
  }
  /* Hörverstehen-Fehler (direction 'listen') tragen denselben entryKind
     wie die zugehörige Lese-Abfrage, müssen aber als Hör-Übung wieder
     aufgebaut werden. Fällt die Sprachausgabe zwischenzeitlich weg (z. B.
     anderes Gerät), wird stattdessen die normale Lese-Abfrage erzeugt —
     die Frage bleibt dann übbar, statt als stumme Karte zu erscheinen. */
  if(m.direction === 'listen' && (m.entryKind === 'vocab' || m.entryKind === 'hangulword')){
    const item = { kr:m.term, roman:m.roman, de:m.de };
    let pool = m.entryKind === 'hangulword' ? getLearnedHangulWords() : getLearnedVocabPool();
    if(!pool.some(p => p.kr === m.term)) pool = [...pool, item];
    if(listenExercisesAvailable() && canSpeak(item.kr)) return makeListenExercise(item, pool, m.entryKind, 'mistakes', m.lessonId, m.id);
    return m.entryKind === 'hangulword'
      ? makeHangulWordMcExercise(item, pool, 'term-to-meaning', 'mistakes', m.lessonId, m.id)
      : makeVocabMcExercise(item, pool, 'term-to-meaning', 'mistakes', m.lessonId, m.id);
  }
  if(m.entryKind === 'vocab'){
    let pool;
    if(m.lessonId){
      const lesson = COURSE.find(l => l.id === m.lessonId);
      pool = lesson ? lesson.vocab : getLearnedVocabPool();
    } else {
      pool = getLearnedVocabPool();
    }
    if(!pool.some(p => p.kr === m.term)) pool = [...pool, { kr:m.term, roman:m.roman, de:m.de }];
    return makeVocabMcExercise({ kr:m.term, roman:m.roman, de:m.de }, pool, m.direction, 'mistakes', m.lessonId, m.id);
  }
  if(m.entryKind === 'hangulword'){
    let pool;
    if(m.lessonId){
      const lesson = COURSE.find(l => l.id === m.lessonId);
      pool = lesson && lesson.words ? lesson.words : getLearnedHangulWords();
    } else {
      pool = getLearnedHangulWords();
    }
    if(!pool.some(p => p.kr === m.term)) pool = [...pool, { kr:m.term, roman:m.roman, de:m.de }];
    return makeHangulWordMcExercise({ kr:m.term, roman:m.roman, de:m.de }, pool, m.direction, 'mistakes', m.lessonId, m.id);
  }
  if(m.entryKind === 'syllable'){
    const learned = getLearnedHangulLetters();
    const consonants = learned.filter(l => l.kind === 'consonant');
    const vowels = learned.filter(l => l.kind === 'vowel');
    return makeBuildExercise(m.term, m.roman, consonants, vowels, 'mistakes', m.lessonId, m.id, 'Baue die Silbe noch einmal');
  }
  if(m.entryKind === 'buildword' && m.direction === 'romanize'){
    return makeRomanizeWordExercise({ kr:m.term, roman:m.roman, de:m.de }, 'mistakes', m.lessonId, m.id, 'Tippe die Umschrift noch einmal');
  }
  if(m.entryKind === 'buildword'){
    const learned = getLearnedHangulLetters();
    const consonants = learned.filter(l => l.kind === 'consonant');
    const vowels = learned.filter(l => l.kind === 'vowel');
    return makeBuildWordExercise({ kr:m.term, roman:m.roman, de:m.de }, consonants, vowels, 'mistakes', m.lessonId, m.id, 'Baue das Wort noch einmal');
  }
  if(m.entryKind === 'grammar'){
    return makeRegisterMcExercise({ kr:m.term, roman:m.roman, de:m.de, register:m.register }, m.lessonId, m.id);
  }
  if(m.entryKind === 'romanchoice'){
    return makeRomanChoiceMcExercise({ kr:m.term, correct:m.correctRoman, wrong:m.wrongRoman, rule:m.de }, m.lessonId, m.id);
  }
  if(m.entryKind === 'soundchange'){
    return makeSoundChangeMcExercise({ written:m.literal, spoken:m.spoken, writtenRoman:'', spokenRoman:m.roman, de:m.de }, m.lessonId, m.id);
  }
  if(m.entryKind === 'cloze'){
    // templateId/variantKey werden mitgereicht, damit eine im Fehlertrainer
    // richtig beantwortete Vorlagen-Frage denselben Mastery-Key trifft wie
    // in der Lektion selbst (s. masteryKeyFor).
    return makeClozeExercise({ parts:m.parts, correct:m.correct, pool:m.pool, partsRoman:m.partsRoman, poolRoman:m.poolRoman, contextDe:m.contextDe, contextRoman:m.contextRoman, explain:m.explain, templateId:m.templateId, variantKey:m.variantKey }, m.lessonId, m.id, m.term);
  }
  if(m.entryKind === 'sentence'){
    return makeSentenceExercise({ direction:m.direction, promptText:m.promptText, promptRoman:m.promptRoman, correctTokens:m.correctTokens, pool:m.pool, explain:m.explain, templateId:m.templateId, variantKey:m.variantKey }, m.lessonId, m.id, m.term);
  }
  const learnedLetters = getLearnedHangulLetters();
  const targetKind = (findLetterByChar(m.term) || {}).kind;
  let pool = targetKind ? learnedLetters.filter(l => l.kind === targetKind) : learnedLetters;
  if(!pool.some(p => p.ch === m.term)) pool = [...pool, { ch:m.term, roman:m.roman, kind:targetKind }];
  return makeHangulMcExercise({ ch:m.term, roman:m.roman }, pool, m.direction, 'mistakes', m.lessonId, m.id);
}
/* Eine Mal-Übung. Der gesuchte Buchstabe ist bekannt — deshalb prüft
   der Erkenner nur, ob das Gemalte zu IHM passt und zu keinem anderen
   besser (s. pruefeGemaltesJamo). */
function makeDrawExercise(letter, phase, idOverride){
  return {
    phase: phase || 'hangultrainer',
    kind: 'draw',
    id: idOverride || `draw:${letter.ch}`,
    /* Gezeigt wird NUR die Umschrift — das Zeichen muss aus dem Kopf
       kommen (Rückmeldung vom 26.08.2026). Abmalen prüft, ob man eine
       Form nachziehen kann; aus dem Laut das Zeichen zu erzeugen prüft,
       ob man es kann. Wer nicht weiterweiß, hat den „Ich weiß es nicht"-
       Knopf, und nach dem Prüfen erscheint die richtige Form ohnehin
       über der eigenen Zeichnung. */
    title: 'Mal das Zeichen für diesen Laut',
    prompt: letter.roman,
    promptIsKr: false,
    sub: null,
    roman: letter.roman,
    correct: letter.ch,
    letterKind: letter.kind || null,
    mistakeMeta: { entryKind:'draw', lessonId:null, term:letter.ch,
                   roman:letter.roman, de:letter.roman, kind:letter.kind || null, direction:'draw' }
  };
}
const DRAW_EXERCISE_COUNT = 12;
function buildDrawSteps(){
  /* Nur Buchstaben, die BEIDES sind: schon gelernt und vom Erkenner
     prüfbar. Für alles andere gäbe es keine ehrliche Rückmeldung. */
  const malbar = getLearnedHangulLetters().filter(l => kannGemaltWerden(l.ch));
  if(!malbar.length) return [];
  return shuffle(malbar).slice(0, DRAW_EXERCISE_COUNT).map(l => makeDrawExercise(l));
}
function buildMistakeSteps(){
  return shuffle(mistakes.map(m => rebuildExerciseFromMistake(m)));
}
/* =========================================================
   RENDERING: HOME (Lernpfad)
   Der Pfad wächst von UNTEN nach OBEN (wie im echten Duolingo): die
   erste Lektion steht ganz unten, neuere Lektionen weiter oben. Der
   Kurs ist außerdem in Kurseinheiten gruppiert — alle Hangul-/Konzept-
   Lektionen bilden die Hangul-Einheit, mit "Begrüßungen" beginnt Einheit „Begrüßungen“.
   Jede Einheit bekommt ein eigenes Banner direkt über ihrer ersten
   (also im Pfad untersten) Lektion.
========================================================= */
/* die Hangul-Einheit bleibt EINE große Einheit (alle Hangul-/Konzept-Lektionen).
   Ab dort bekommt JEDES THEMA (Begrüßungen, Ich & Du, ...) weiterhin seine
   EIGENE Einheit (2, 3, 4, ...) — aber ein Thema kann jetzt aus MEHREREN
   Lektionen bestehen (z. B. "Begrüßungen" = 5 kleinere Lektionen zu je
   einem Teilaspekt), statt wie früher nur einer einzigen großen Lektion.
   Vokabel-Lektionen, die zum selben Thema gehören, tragen dasselbe
   "topic"-Feld (frei wählbarer String); Lektionen ohne "topic"-Feld gelten
   als eigenes Thema mit sich selbst als Schlüssel (= altes Verhalten,
   1 Lektion = 1 Einheit — betrifft aktuell noch alle Themen außer
   "Begrüßungen"). Die Einheiten-Nummer ergibt sich automatisch aus der
   Reihenfolge, in der ein neues Thema zum ersten Mal in COURSE auftaucht,
   sodass sich beim Hinzufügen/Umbauen weiterer Themen alles von selbst
   nachnummeriert. Zählt als "Vokabel-Lektion" für die Einheiten-Gruppierung
   auch der neue Typ 'grammar' (Grammatik-Konzept-Lektionen, s.
   buildGrammarSteps) — grammatikalisch gehört so eine Lektion zu genau
   demselben Thema wie ihre umgebenden Vokabel-Lektionen (trägt dasselbe
   "topic"-Feld) und soll deshalb dieselbe Einheiten-Nummer bekommen. */
const VOCAB_LESSONS = COURSE.filter(l => l.type === 'vocab' || l.type === 'grammar');
const VOCAB_LESSON_UNIT = new Map();
const COURSE_UNITS = { 0: { title: 'Einheit 0', subtitle: 'Hangul – Buchstaben lesen und schreiben' } };
(function(){
  let nextUnit = 1;
  const topicToUnit = new Map();
  const topicLessons = new Map();
  VOCAB_LESSONS.forEach(l => {
    const topicKey = l.topic || l.id;
    if(!topicToUnit.has(topicKey)){
      topicToUnit.set(topicKey, nextUnit);
      topicLessons.set(topicKey, []);
      nextUnit++;
    }
    VOCAB_LESSON_UNIT.set(l, topicToUnit.get(topicKey));
    topicLessons.get(topicKey).push(l);
  });
  topicToUnit.forEach((unitNum, topicKey) => {
    const lessonsInTopic = topicLessons.get(topicKey);
    // "topicTitle" ist der Name des Themas selbst (z. B. "Begrüßungen"),
    // unabhängig davon, wie die einzelnen Teil-Lektionen heißen (z. B.
    // "Hallo & Tschüss", "Danke & Entschuldigung", ...). Bei Themen ohne
    // eigenes "topicTitle" (noch nicht aufgeteilte Themen) ist das schlicht
    // der (einzige) Lektionstitel — identisch zum bisherigen Verhalten.
    const topicTitle = lessonsInTopic[0].topicTitle || lessonsInTopic[0].title;
    COURSE_UNITS[unitNum] = { title: `Einheit ${unitNum}`, subtitle: topicTitle };
  });
})();
function getCourseUnit(lesson){
  if(lesson.type === 'review') return lesson.reviewUnit;
  if(lesson.type === 'hangul' || lesson.type === 'concept') return 0;
  return VOCAB_LESSON_UNIT.get(lesson) || 1;
}
/* =========================================================
   WIEDERHOLUNGSLEKTIONEN ("review")
   Feedback vom 22.08.2026 (ersetzt die Version vom 18.08.2026 — damals:
   EINE einzige, mit der Zeit wachsende Wiederholung ganz am ENDE jeder
   Einheit, s. lektions-design-prinzipien.md für die alte Fassung):
   Jetzt kommt nach JEDER Lektion eine eigene Wiederholung (sobald genug
   Stoff dafür da ist, s. MIN_REVIEW_POOL_SIZE) — ähnlich den
   Wiederholungs-Kontrollpunkten bei Duolingo, aber viel dichter gesetzt.
   Jede Wiederholung hat eine FESTE Größe (REVIEW_EXERCISE_COUNT, aktuell
   10) statt mit fortschreitendem Kurs immer größer zu werden, und der
   Pool speist sich aus WORTWÖRTLICH allem, was VOR dieser Stelle im Kurs
   gelernt wurde — nicht mehr nur aus "vorherigen Einheiten", da eine
   Wiederholung jetzt auch mitten in einer Einheit auftauchen kann.

   Pflicht-Charakter: Eine Wiederholungslektion ist ein ganz normaler
   Eintrag im COURSE-Array, deshalb greift die ohnehin bestehende
   sequentielle Sperre (s. renderHomeJoseon:
   "sequentialLocked = i > 0 && !completed.has(COURSE[i-1].id)") von
   selbst: die nächste ECHTE Lektion bleibt gesperrt, bis die davor
   liegende Wiederholung mindestens einmal abgeschlossen wurde — dafür
   war KEIN zusätzlicher Sperr-Code nötig. Einmal abgeschlossen bleibt sie
   wie jede andere Lektion dauerhaft anklickbar (nur "🔒" sperrt, nicht
   "⭐"/fertig), also beliebig oft wiederholbar — mit jedem Durchlauf einer
   neuen, nach Möglichkeit von der letzten verschiedenen Auswahl (s.
   buildReviewSteps/reviewLastUsed).

   Bewusst NUR bereits an anderer Stelle vorhandene Übungsformen aus
   bereits gelehrtem Material — echte Vokabel-/Grammatik-Lektionen
   (`.vocab`), Hangul-Alltagswörter (`.words`) UND (neu gegenüber der
   alten Fassung) Lückentext-/Satzbau-Beispiele (`.clozeExamples`/
   `.sentenceExamples`) — s. buildReviewApplyExercises. Weiterhin bewusst
   OHNE einzelne Buchstaben (dafür gibt es den dedizierten Hangul-Trainer)
   und ohne Grammatik-Erklärtexte selbst (nur ihre Cloze-/Satzbau-
   Beispiele sind sinnvoll direkt abfragbar).

   Punkte zählen weiterhin NICHT in die Einheiten-Gesamtpunktzahl — s.
   getUnitQuestionKeys weiter oben, dort bleibt der Typ 'review'
   ausgeschlossen (unverändert gegenüber der alten Fassung). */
const REVIEW_EXERCISE_COUNT = 10;
const MIN_REVIEW_POOL_SIZE = 4;
/* Baut EINE Wiederholungslektion aus dem bis zu "afterLesson" (inklusive)
   eingesammelten Pool. "afterLesson" bestimmt nur Anzeigename/Einheit
   (dieselbe wie die davorliegende Lektion, s. getCourseUnit) und die
   eindeutige id — der Pool selbst kommt vollständig aus dem übergebenen
   "pool"-Objekt (s. insertReviewLessons). Zu wenig Stoff (ganz am
   Kursanfang) -> keine Wiederholungslektion erzeugen, statt eine fast
   leere Mini-Lektion mit nur 1-2 Übungen. */
function buildReviewLesson(afterLesson, pool){
  // Feedback vom 22.08.2026: die Hangul-Einheit bekommt bewusst KEINE
  // Wiederholungen — dort lernt man noch die Buchstaben/ersten Wörter
  // selbst, und der Wortschatz-Pool ist an dieser Stelle ohnehin noch zu
  // klein/roh für sinnvolle Wiederholungen. Der Pool sammelt trotzdem
  // weiter (s. insertReviewLessons) — Einheit-1-Wörter (z. B. 하마, 배)
  // fließen dadurch normal in die ERSTE Wiederholung von der Einheit „Begrüßungen“ mit ein.
  if(getCourseUnit(afterLesson) === 0) return null;
  const totalItems = pool.vocabItems.length + pool.wordItems.length + pool.clozeItems.length + pool.sentenceItems.length;
  if(totalItems < MIN_REVIEW_POOL_SIZE) return null;
  return {
    id: `review-after-${afterLesson.id}`, type:'review', reviewUnit: getCourseUnit(afterLesson),
    title:'Wiederholung', icon:'🔁',
    reviewVocabItems: pool.vocabItems.slice(), reviewWordItems: pool.wordItems.slice(),
    reviewClozeItems: pool.clozeItems.slice(), reviewSentenceItems: pool.sentenceItems.slice()
  };
}
/* Fügt NACH JEDER Lektion (sobald MIN_REVIEW_POOL_SIZE erreicht ist) eine
   Wiederholungslektion ins COURSE-Array ein. Läuft über eine Kopie des
   ursprünglichen COURSE (ohne die neuen Lektionen) und sammelt dabei
   INKREMENTELL den Wiederholungs-Pool auf (statt wie in der alten Fassung
   pro Einheit neu von vorn zu suchen) — "bereits gelernt" endet dadurch
   nicht mehr an Einheitengrenzen, sondern meint wortwörtlich alles vorher
   im Kurs. Der Pool wird PER REFERENZ an buildReviewLesson übergeben,
   das ihn dort für die neue Lektion kopiert (`.slice()`) — spätere
   Erweiterungen des Pools wirken sich also nicht rückwirkend auf bereits
   erzeugte Wiederholungslektionen aus. */
(function insertReviewLessons(){
  const original = COURSE.slice();
  const withReviews = [];
  const pool = { vocabItems: [], wordItems: [], clozeItems: [], sentenceItems: [] };
  original.forEach(lesson => {
    withReviews.push(lesson);
    if((lesson.type === 'vocab' || lesson.type === 'grammar') && lesson.vocab){
      lesson.vocab.forEach(v => pool.vocabItems.push({ v, lessonId: lesson.id }));
    }
    if(lesson.type === 'hangul' && lesson.words){
      lesson.words.forEach(w => pool.wordItems.push({ w, lessonId: lesson.id }));
    }
    (lesson.templateIds || []).forEach(tid => {
      const tpl = TEMPLATES[tid];
      if(!tpl) return;
      if(tpl.kind === 'cloze') pool.clozeItems.push({ templateId: tid, lessonId: lesson.id });
      else if(tpl.kind === 'sentence') pool.sentenceItems.push({ templateId: tid, lessonId: lesson.id });
    });
    const reviewLesson = buildReviewLesson(lesson, pool);
    if(reviewLesson) withReviews.push(reviewLesson);
  });
  COURSE.length = 0;
  COURSE.push(...withReviews);
})();


/* Zustand: welche Kultur-Schriftrollen schon einmal gezeigt wurden.
   Wird gespeichert, damit die Rolle wirklich nur EINMAL von allein
   erscheint — beim ersten Öffnen der jeweiligen Einheit. */
function cultureFor(unit){ return UNIT_CULTURE[unit] || null; }
/* Zeigt die Kultur-Schriftrolle über einem grauen Schleier. Baut
   bewusst dieselben Bausteine wie eine Einheiten-Schriftrolle im
   Lernpfad (Kordel, Brokatrahmen, cremefarbenes Feld, Wickelrolle),
   damit sie als dasselbe Objekt erkennbar ist — nur eben aufgerollt
   und ganzflächig. */
function showCultureScroll(unit){
  const data = cultureFor(unit);
  if(!data) return;
  const unitInfo = COURSE_UNITS[unit] || { title:`Einheit ${unit}` };

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay culture-overlay';

  const wrap = document.createElement('div');
  wrap.className = 'scroll-unit culture-scroll expanded';

  const closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.className = 'culture-close';
  closeBtn.setAttribute('aria-label', 'Schließen');
  closeBtn.textContent = '✕';
  wrap.appendChild(closeBtn);

  const cord = document.createElement('div');
  cord.className = 'scroll-cord';
  wrap.appendChild(cord);

  const frame = document.createElement('div');
  frame.className = 'scroll-frame';
  const inner = document.createElement('div');
  inner.className = 'scroll-inner';

  const body = document.createElement('div');
  body.className = 'culture-body';
  const factsHtml = data.facts.map(f => `<div class="culture-fact"><h4>${f.h}</h4><p>${f.t}</p></div>`).join('');
  const phraseHtml = data.phrase
    ? `<div class="culture-phrase"><span class="culture-phrase-kr">${data.phrase.kr}${speakBtnHtml(data.phrase.kr)}</span>
         <span class="culture-phrase-roman">${data.phrase.roman}</span>
         <span class="culture-phrase-de">${data.phrase.de}</span></div>`
    : '';
  body.innerHTML = `<div class="culture-eyebrow">${unitInfo.title} · Wissenswertes</div>
    <h3 class="culture-title">${data.title}</h3>
    <p class="culture-intro">${data.intro}</p>
    ${factsHtml}${phraseHtml}`;
  inner.appendChild(body);
  frame.appendChild(inner);
  wrap.appendChild(frame);

  const roller = document.createElement('div');
  roller.className = 'scroll-roller';
  wrap.appendChild(roller);

  overlay.appendChild(wrap);
  document.body.appendChild(overlay);

  const close = () => {
    overlay.remove();
    document.removeEventListener('keydown', onKey);
  };
  function onKey(e){ if(e.key === 'Escape') close(); }
  closeBtn.onclick = close;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });
  document.addEventListener('keydown', onKey);
}
/* Einmalige Anzeige beim ersten Öffnen einer Einheit. Im Testmodus
   bewusst NICHT automatisch: dort sind von Anfang an alle Einheiten
   offen, die Rolle würde bei jedem Aufklappen einer beliebigen Einheit
   dazwischenfahren. Über das Symbol im Rollenkopf bleibt sie dort
   trotzdem jederzeit abrufbar. */
function maybeShowCultureOnFirstOpen(unit){
  if(settings.unlockAll) return;
  if(!cultureFor(unit)) return;
  if(cultureSeen.has(unit)) return;
  cultureSeen.add(unit);
  saveState();
  showCultureScroll(unit);
}

function renderHome(){
  const home = $('home');
  home.innerHTML = '';
  // Freischaltungs-Stand nachziehen, bevor gezeichnet wird (s. dort).
  refreshMaxUnlockedUnit();
  renderHomeJoseon(home);
  updateJumpBtn();
}

/* =========================================================
   SPRUNG ZU EINER EINHEIT
   =========================================================
   Der Lernpfad ist 145 Einträge lang. Er öffnet zwar an der aktuellen
   Lektion, aber gezielt zu „Zahlen" zurückzublättern hieß bisher
   scrollen und suchen.

   Bewusst KEINE Leiste am oberen Rand: Die hätte dauerhaft Platz
   gekostet — auf jedem Bildschirm, für einen Griff, den man selten
   braucht. Stattdessen ein kleiner Knopf über der unteren Navigation,
   der eine Liste öffnet. Die Liste kann obendrein etwas, was eine Reihe
   von Nummern nicht kann: Sie zeigt Namen und Fortschritt.
   ========================================================= */
function currentUnitNumber(){
  const idx = getCurrentLessonIdx();
  return COURSE[idx] ? getCourseUnit(COURSE[idx]) : 0;
}
function updateJumpBtn(){
  const btn = $('jumpBtn');
  if(!btn) return;
  /* Die tatsächliche Höhe der unteren Leiste an das Stylesheet
     durchreichen — sie ändert sich mit der Schriftgröße, im Querformat
     und je nach Geräterand. */
  const nav = $('bottomNav');
  if(nav){
    const h = Math.round(nav.getBoundingClientRect().height);
    if(h > 0) document.documentElement.style.setProperty('--nav-h', h + 'px');
  }
  /* Nur dort, wo es etwas zu springen gibt — und erst, wenn die
     Vorkenntnis-Frage beantwortet ist (vorher ist der Pfad zugerollt). */
  const zeigen = currentScreenName === 'home' && onboarding.hangulAsked;
  btn.classList.toggle('show', zeigen);
}
function jumpToUnit(unit){
  if(unit !== 'ausblick'){
    /* Eine zugerollte Schriftrolle ist kein Ziel — beim Hinspringen
       wird sie geöffnet. */
    scrollExpanded[unit] = true;
    renderHome();
  }
  const ziel = document.getElementById('unit-' + unit);
  if(!ziel) return;
  const kopf = document.querySelector('header');
  const abstand = (kopf ? kopf.getBoundingClientRect().height : 0) + 8;
  const y = window.scrollY + ziel.getBoundingClientRect().top - abstand;
  try{ window.scrollTo({ top:Math.max(0, y), behavior:'smooth' }); }
  catch(e){ window.scrollTo(0, Math.max(0, y)); }
}
function showUnitJumpDialog(){
  const jetzt = currentUnitNumber();
  const zeilen = Object.keys(COURSE_UNITS)
    .map(Number).sort((a, b) => a - b)
    .map(unit => {
      const info = COURSE_UNITS[unit];
      const m = getUnitMasteryInfo(unit);
      const gate = unit > 0 ? getUnitMasteryInfo(unit - 1) : null;
      const gesperrt = !settings.unlockAll && !!gate && !gate.isComplete;
      const fertig = m.total > 0 && m.mastered >= m.total;
      const zeichen = gesperrt ? '🔒' : fertig ? '✓' : unit === jetzt ? '▸' : '·';
      return `<button type="button" class="jump-row${unit === jetzt ? ' now' : ''}${gesperrt ? ' locked' : ''}"
                data-unit="${unit}"${gesperrt ? ' disabled' : ''}>
                <span class="jump-mark">${zeichen}</span>
                <span class="jump-name"><strong>${info.title}</strong><small>${info.subtitle || ''}</small></span>
                <span class="jump-count">${m.mastered}/${m.total}</span>
              </button>`;
    }).join('');
  const ausblick = `<button type="button" class="jump-row" data-unit="ausblick">
      <span class="jump-mark">🔭</span>
      <span class="jump-name"><strong>Ausblick</strong><small>Was nach Einheit 10 käme</small></span>
      <span class="jump-count"></span>
    </button>`;
  showChoiceDialog({
    title:'Zu einer Einheit springen',
    message:'',
    extraHtml:`<div class="jump-list">${zeilen}${ausblick}</div>`,
    buttons:[{ label:'Abbrechen', className:'btn-gray' }],
    onReady:(box) => {
      box.querySelectorAll('.jump-row').forEach(row => {
        row.onclick = () => {
          const u = row.dataset.unit;
          box.closest('.modal-overlay').remove();
          jumpToUnit(u === 'ausblick' ? 'ausblick' : Number(u));
        };
      });
      /* Die aktuelle Einheit soll sichtbar sein, ohne dass man sucht. */
      const jetztZeile = box.querySelector('.jump-row.now');
      if(jetztZeile) jetztZeile.scrollIntoView({ block:'center' });
    }
  });
}

function buildOutlookHtml(){
  const items = COURSE_OUTLOOK.map(sec => `
    <div class="outlook-item">
      <div class="outlook-head">
        <span class="outlook-num">Sektor ${sec.n}</span>
        <span class="outlook-title">${sec.title}</span>
        <span class="outlook-level">${sec.level}</span>
      </div>
      <div class="outlook-goal">${sec.goal}</div>
      <div class="outlook-units">${sec.units.map((u, i) => `<b>${i+1}.</b> ${u}`).join(' &nbsp;·&nbsp; ')}</div>
    </div>`).join('');
  return `<p class="outlook-intro">Hier endet der Kurs — die Sprache nicht. Du kannst jetzt Hangul lesen, Sätze bauen, in drei Zeitformen sprechen und zwei Gedanken verbinden. Das ist das Fundament. Was darauf käme, steht hier: <strong>acht Sektoren zu je zehn Einheiten</strong>, in derselben Machart wie bisher — mit Lektionen, Grammatik, Kultur-Schriftrollen und Wiederholungen.</p>`
    + `<p class="outlook-intro">Die Reihenfolge folgt einem Plan: erst <strong>handlungsfähig werden</strong> (3–4), dann <strong>richtig sprechen</strong> (5–6), dann <strong>frei denken</strong> (7–8), zuletzt <strong>hinaus in die Wildnis</strong> (9–10). Jeder Sektor endet mit einer Werkstatt — keine neuen Regeln, sondern alles Gelernte an einer einzigen Aufgabe.</p>`
    + items
    + `<div class="outlook-foot">Wenn du dir aus dieser Liste eine Sache herauspicken willst: <strong>Sektor 8</strong>. Hanja sind der größte Hebel, den Koreanisch zu bieten hat — dort verzehnfacht sich der Wortschatz, ohne dass man Wörter lernt. 화이팅!</div>`;
}

function buildPathSection(label){
  const el = document.createElement('div');
  el.className = 'path-section';
  const span = document.createElement('span');
  span.textContent = label;
  el.appendChild(span);
  return el;
}
/* Der grüne Titel-Kasten ganz am Anfang des Lernpfads. In beiden
   Darstellungen identisch, deshalb als eigene Funktion. */
function buildHomeTitleBanner(){
  const banner = document.createElement('div');
  banner.className = 'unit-banner';
  banner.innerHTML = `<span class="banner-text">한국어 배우기<small>Von Hangul bis zu deinen ersten Sätzen – ${COURSE.length} Lektionen</small></span><div class="banner-blossoms" aria-hidden="true"><span>🌸</span><span>🌸</span><span>🌸</span></div>`;
  return banner;
}
/* Merkt sich pro Einheit, ob ihre Schriftrolle gerade aufgerollt (offen)
   ist. Bewusst nur zur Laufzeit (nicht in localStorage) — jede Sitzung
   startet mit eingerollten Schriftrollen. */
let scrollExpanded = {};
/* Joseon-Stil-Variante des Lernpfads: statt einem Banner + einer Spalte
   aus quadratischen Lektions-Kacheln bekommt jede Einheit EINE
   Schriftrolle. Zugerollt zeigt sie außen nur Titel, Fortschritts-Zähler
   und Untertitel (identisch zum bisherigen Einheiten-Banner). Ist die
   Einheit freigeschaltet (siehe unitLocked/gatingInfo unten wie im
   modernen Layout), kann man sie per Antippen aufrollen — darin stehen
   dann alle einzelnen Lektionen der Einheit als Liste (z. B.
   "Hangul 1: 아이"), jede mit ihrem eigenen Sperr-/Fertig-Status und
   Fortschritts-Zähler, genau wie die bisherigen Kacheln. */
function renderHomeJoseon(home){
  // Gleiche Leserichtung wie im modernen Layout (Feedback vom 24.08.2026):
  // Titel-Kasten, Vorkenntnis-Frage, dann die Schriftrollen der Einheiten
  // in Kursreihenfolge von oben nach unten.
  home.appendChild(buildHomeTitleBanner());
  renderOnboardingCard(home);
  let buffer = [];
  for(let i = 0; i < COURSE.length; i++){
    const lesson = COURSE[i];
    const unit = getCourseUnit(lesson);
    buffer.push({ lesson, idx:i });
    const isLastLessonOfUnit = (i === COURSE.length - 1) || (getCourseUnit(COURSE[i+1]) !== unit);
    if(isLastLessonOfUnit){
      if(PATH_SECTIONS[unit]) home.appendChild(buildPathSection(PATH_SECTIONS[unit]));
      home.appendChild(buildScrollUnit(unit, buffer));
      buffer = [];
    }
  }
  appendOutlookSection(home);
  appendPathFooter(home);
}
/* Der Fahrplan hinter dem letzten Sektor — rote Schriftrolle im
   Joseon-Stil, rotes Banner im modernen (dieselbe Farbe wie der
   Fehlertrainer, s. appendTrainerSection). Bewusst nicht gesperrt: ein
   Ausblick, den man erst am Ende sehen darf, ist kein Ausblick. */
/* Ganz unten am Lernpfad, unter dem Ausblick: das Kleingedruckte.
   Anlass (26.08.2026): "Ich kann die Version nirgends finden." Sie stand
   nur in den Einstellungen, hinter zwei Bildschirmhöhen Reglern. Hier
   steht sie dort, wo Apps ihr Impressum haben — am Ende der Seite, ohne
   irgendwo Platz zu kosten. */
function appendPathFooter(home){
  const fuss = document.createElement('div');
  fuss.className = 'path-footer';
  const inner = document.createElement('span');
  inner.className = 'path-footer-inner';
  inner.innerHTML = `한국어 배우기 · Version ${APP_VERSION} · ${appBuildLabel()}<br>`;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Über die App';
  btn.onclick = showLegalDialog;
  inner.appendChild(btn);
  fuss.appendChild(inner);
  home.appendChild(fuss);
}
function appendOutlookSection(home){
  const marke = buildPathSection('Ausblick');
  marke.id = 'unit-ausblick';
  home.appendChild(marke);
  appendTrainerSection(home, {
    key:'outlook', color:'var(--red)',
    title:'Wie es weitergeht',
    subtitle:'Acht weitere Sektoren mit je zehn Einheiten',
    html: buildOutlookHtml()
  });
}
function buildScrollUnit(unit, lessonsInOrder){
  const gatingUnit = unit - 1;
  const gatingInfo = gatingUnit >= 0 ? getUnitMasteryInfo(gatingUnit) : null;
  const unitLocked = !settings.unlockAll && !!gatingInfo && !gatingInfo.isComplete;
  const info = COURSE_UNITS[unit] || { title:`Einheit ${unit}`, subtitle:'' };
  const mastery = getUnitMasteryInfo(unit);
  const isExpanded = !unitLocked && !!scrollExpanded[unit];

  const wrap = document.createElement('div');
  // Einheit 0 (Hangul) bekommt als einzige einen hell rosa Rahmen —
  // dieselbe Kirschblüten-Farbe wie die Blüten in den Bannern.
  wrap.className = 'scroll-unit' + (isExpanded ? ' expanded' : '') + (unitLocked ? ' locked' : '')
    + (unit === 0 ? ' scroll-tinted' : '');
  /* Sprungmarke für die Einheiten-Übersicht (s. showUnitJumpDialog). */
  wrap.id = 'unit-' + unit;
  wrap.dataset.unit = unit;
  if(unit === 0) wrap.style.setProperty('--scroll-tint', '#f0cdd8');
  wrap.dataset.unit = unit;
  if(unitLocked){
    const missing = gatingInfo.total - gatingInfo.mastered;
    const gatingTitle = (COURSE_UNITS[gatingUnit] || {}).title || `Einheit ${gatingUnit}`;
    wrap.title = `Noch insgesamt ${missing} richtige ${missing === 1 ? 'Antwort' : 'Antworten'} in „${gatingTitle}" nötig, um diese Schriftrolle zu öffnen.`;
  }

  // Kleine Kordel-Öse ganz oben (rein dekorativ, wie bei einem echten
  // aufgehängten Schriftstück).
  const cord = document.createElement('div');
  cord.className = 'scroll-cord';
  wrap.appendChild(cord);

  // Brokat-Passepartout: umrahmt das helle Textfeld.
  const frame = document.createElement('div');
  frame.className = 'scroll-frame';

  // Helles, cremefarbenes Textfeld — hier steht die eigentliche Schrift.
  const inner = document.createElement('div');
  inner.className = 'scroll-inner';

  const header = document.createElement('div');
  header.className = 'scroll-header';
  // Laternen-Symbol unter dem Einheiten-Fortschritt: ruft die Kultur-
  // Schriftrolle erneut auf. Sichtbar, sobald die Einheit offen ist —
  // im Testmodus immer, auch bei noch gesperrten Einheiten.
  const showCultureBtn = !!cultureFor(unit) && (!unitLocked || settings.unlockAll);
  header.innerHTML = `<div class="scroll-header-row">
      <span>${unitLocked ? '🔒 ' : `<span class="scroll-toggle-icon">▾</span>`}${info.title}</span>
      <span class="scroll-header-right">
        ${showCultureBtn ? `<button type="button" class="culture-btn" aria-label="Wissenswertes über Korea">🏮</button>` : ''}
        <span class="unit-counter">${mastery.mastered}/${mastery.total}</span>
      </span>
    </div>
    <small>${info.subtitle}</small>
    <div class="scroll-hint">${unitLocked ? 'Gesperrt, bis die vorherige Einheit gemeistert ist' : (isExpanded ? 'Tippen zum Zusammenrollen' : 'Tippen zum Entrollen')}</div>`;
  const cultureBtn = header.querySelector('.culture-btn');
  if(cultureBtn){
    cultureBtn.title = 'Wissenswertes über Korea';
    // stopPropagation, damit das Antippen des Symbols die Schriftrolle
    // nicht gleichzeitig auf- oder zurollt.
    cultureBtn.onclick = (e) => { e.stopPropagation(); showCultureScroll(unit); };
  }
  if(!unitLocked){
    header.onclick = () => {
      const willOpen = !scrollExpanded[unit];
      scrollExpanded[unit] = willOpen;
      renderHome();
      // Beim ERSTEN Entrollen einer Einheit zeigt sich ihre Kultur-
      // Schriftrolle von allein (s. maybeShowCultureOnFirstOpen).
      if(willOpen) maybeShowCultureOnFirstOpen(unit);
    };
  }
  inner.appendChild(header);

  const lessonsWrap = document.createElement('div');
  lessonsWrap.className = 'scroll-lessons';
  lessonsInOrder.forEach(({ lesson, idx }) => {
    const isDone = completed.has(lesson.id);
    const sequentialLocked = idx > 0 && !completed.has(COURSE[idx-1].id);
    const isLessonLocked = !settings.unlockAll && (sequentialLocked || unitLocked);
    const btn = document.createElement('button');
    btn.className = 'scroll-lesson-row' + (isLessonLocked ? ' locked' : isDone ? ' done' : '');
    btn.dataset.lessonIdx = idx;
    btn.disabled = isLessonLocked;
    // Wiederholungslektionen zeigen bewusst KEINEN "X/Y"-Zähler (Feedback
    // vom 22.08.2026): Er zählte gegen den vollen Wiederholungs-Pool, der
    // mit dem Kurs beliebig groß wird, während eine Sitzung immer nur
    // zehn Fragen zeigt — die Zahl wirkte irreführend groß.
    const counterHtml = lesson.type === 'review' ? '' : (() => {
      const lessonMastery = getLessonMasteryInfo(lesson);
      return `<span class="scroll-lesson-counter">${lessonMastery.mastered}/${lessonMastery.total}</span>`;
    })();
    btn.innerHTML = `<span class="scroll-lesson-icon">${isLessonLocked ? '🔒' : (isDone ? '🌸' : lesson.icon)}</span>
      <span class="scroll-lesson-title">${lesson.title}</span>
      ${counterHtml}`;
    btn.onclick = (e) => { e.stopPropagation(); if(!isLessonLocked) startLesson(idx); };
    lessonsWrap.appendChild(btn);
  });
  inner.appendChild(lessonsWrap);

  frame.appendChild(inner);
  wrap.appendChild(frame);

  // Dunkle Wickelrolle mit runden Endknäufen ganz unten.
  const roller = document.createElement('div');
  roller.className = 'scroll-roller';
  wrap.appendChild(roller);

  return wrap;
}

   RENDERING: ÜBUNGSBILDSCHIRM (Vokabeltrainer)
========================================================= */
/* Die fünf wackeligsten Wörter: erst offene Fehler (die stehen per
   Definition auf Level 0), dann alles andere nach Gedächtnis-Level und
   Fälligkeit sortiert. Grundlage sind die Mastery-Keys, deren Aufbau
   "entryKind:term:direction" ist — der mittlere Teil ist das Wort selbst,
   danach wird gruppiert, damit ein Wort nicht dreimal in der Liste steht,
   nur weil es in drei Richtungen abgefragt wird. */
function getWeakestItems(limit){
  const byTerm = new Map();
  const consider = (term, level, due) => {
    if(!term) return;
    const prev = byTerm.get(term);
    if(!prev || level < prev.level) byTerm.set(term, { term, level, due });
  };
  mistakes.forEach(m => consider(m.term, -1, todayStr()));
  Object.keys(questionMemory).forEach(key => {
    const parts = key.split(':');
    if(parts.length < 3) return;
    const mem = questionMemory[key];
    consider(parts.slice(1, parts.length - 1).join(':'), mem.level, mem.due);
  });
  return Array.from(byTerm.values())
    // Nur was zuletzt tatsächlich schiefging: offene Fehler (Level -1, s.
    // oben) und Fragen, deren letzte Antwort falsch war (Level 0). Alles
    // ab Level 1 ist mindestens einmal gesessen und gehört nicht in eine
    // Liste, die "das wackelt gerade" überschrieben ist.
    .filter(x => x.level <= 0)
    .sort((a, b) => a.level - b.level || (a.due < b.due ? -1 : a.due > b.due ? 1 : 0))
    .slice(0, limit);
}
/* Deutsche Bedeutung zu einem koreanischen Begriff, für die Anzeige in
   der Übersicht. Sucht zuerst in der Fehlerliste (dort steht sie direkt
   dabei), danach im gesamten je gelehrten Wortschatz. */
function lookupMeaning(term){
  const m = mistakes.find(x => x.term === term);
  if(m && m.de) return m.de;
  const v = getAllVocabEver().find(x => x.kr === term) || getAllHangulWordsEver().find(x => x.kr === term);
  return v ? v.de : '';
}
function renderProgressOverview(el){
  const banner = document.createElement('div');
  banner.className = 'unit-banner';
  banner.style.background = 'var(--green-dark)';
  banner.innerHTML = `Dein Stand<small>Was sitzt, was heute dran ist und was noch wackelt</small>`;
  el.appendChild(banner);

  const duePool = getDuePracticeExercises();
  const knownTerms = new Set();
  Object.keys(questionMemory).forEach(key => {
    const parts = key.split(':');
    if(parts.length >= 3 && questionMemory[key].level >= 2) knownTerms.add(parts.slice(1, parts.length - 1).join(':'));
  });
  const learnedTotal = getLearnedVocabPool().length + getLearnedHangulWords().length;

  const card = document.createElement('div');
  card.className = 'trainer-card';
  card.innerHTML = `
    <div class="stat-grid">
      <div class="stat-tile"><div class="stat-val">${knownTerms.size}</div><div class="stat-cap">Wörter sitzen</div></div>
      <div class="stat-tile"><div class="stat-val">${duePool.length}</div><div class="stat-cap">heute fällig</div></div>
      <div class="stat-tile"><div class="stat-val">${streak}</div><div class="stat-cap">Tage in Folge</div></div>
    </div>
    <p class="stat-note">„Sitzt" heißt: mindestens zweimal richtig beantwortet, mit wachsendem Abstand –
    von ${learnedTotal} bisher freigeschalteten Wörtern.</p>
    ${duePool.length > 0
      ? `<button class="btn btn-primary" id="startDueBtn" style="margin-top:6px;">${duePool.length} fällige ${duePool.length === 1 ? 'Frage' : 'Fragen'} wiederholen</button>`
      : `<p class="stat-note" style="margin-bottom:0;">Für heute ist nichts fällig – alles Weitere kommt von selbst wieder dran.</p>`}
    ${learnedTotal > 0 ? `<button class="btn btn-gray" id="startQuickBtn" style="margin-top:10px;">Kurz üben – ${QUICK_EXERCISE_COUNT} Fragen</button>` : ''}
  `;
  el.appendChild(card);

  /* Die Kurzliste lohnt sich erst, wenn die vollständige Fehlerliste im
     Fehlertrainer-Abschnitt weiter unten zu lang zum Überblicken ist —
     sonst zeigt sie nur dasselbe doppelt. Ab mehr als fünf offenen
     Fehlern erfüllt sie ihren Zweck: sie sagt, womit man anfängt. */
  const weakest = mistakes.length > 5 ? getWeakestItems(5) : [];
  if(weakest.length > 0){
    const list = document.createElement('div');
    list.className = 'recap-list';
    list.style.marginTop = '14px';
    const head = document.createElement('div');
    head.className = 'stat-note';
    head.style.margin = '0 0 8px';
    head.textContent = `Von deinen ${mistakes.length} offenen Fehlern zuerst diese fünf:`;
    list.appendChild(head);
    weakest.forEach(w => {
      const row = document.createElement('div');
      row.className = 'recap-row';
      row.innerHTML = `<span class="recap-kr">${w.term}${speakBtnHtml(w.term)}</span><span class="recap-de">${lookupMeaning(w.term)}</span>`;
      list.appendChild(row);
    });
    el.appendChild(list);
  }

  const dueBtn = $('startDueBtn');
  if(dueBtn) dueBtn.onclick = () => startSession('due', { origin:'practice' });
  const quickBtn = $('startQuickBtn');
  if(quickBtn) quickBtn.onclick = () => startSession('quick', { origin:'practice' });
}
/* Merkt sich, welche Trainer-Schriftrolle im Üben-Reiter gerade entrollt
   ist. Wie scrollExpanded im Lernpfad bewusst nur zur Laufzeit — jeder
   App-Start beginnt mit zugerollten Schriftrollen. */
let practiceScrollExpanded = {};
/* Ein Abschnitt im Üben-Reiter (Vokabel-, Hangul-, Fehlertrainer).
   Modern: farbiges Banner + flache Karte darunter, wie bisher.
   Joseon: eine aufrollbare Schriftrolle in derselben Farbe (Feedback vom
   24.08.2026). Beide Wege bekommen exakt denselben Inhalt (opts.html plus
   optionale opts.extras), sodass sich die Trainer-Inhalte an EINER Stelle
   pflegen lassen. */
function appendTrainerSection(el, opts){
  el.appendChild(buildTrainerScroll(opts));
}
function buildTrainerScroll(opts){
  const isExpanded = !!practiceScrollExpanded[opts.key];
  const wrap = document.createElement('div');
  wrap.className = 'scroll-unit scroll-tinted' + (isExpanded ? ' expanded' : '');
  // Farbe des Passepartouts — greift in .scroll-unit.scroll-tinted
  // .scroll-frame als var(--scroll-tint).
  wrap.style.setProperty('--scroll-tint', opts.color);

  const cord = document.createElement('div');
  cord.className = 'scroll-cord';
  wrap.appendChild(cord);

  const frame = document.createElement('div');
  frame.className = 'scroll-frame';
  const inner = document.createElement('div');
  inner.className = 'scroll-inner';

  const header = document.createElement('div');
  header.className = 'scroll-header';
  header.innerHTML = `<div class="scroll-header-row">
      <span><span class="scroll-toggle-icon">▾</span>${opts.title}</span>
    </div>
    <small>${opts.subtitle}</small>
    <div class="scroll-hint"></div>`;
  const hint = header.querySelector('.scroll-hint');
  const setHint = open => { hint.textContent = open ? 'Tippen zum Zusammenrollen' : 'Tippen zum Entrollen'; };
  setHint(isExpanded);
  // Bewusst nur die Klasse umschalten statt den ganzen Reiter neu zu
  // rendern: so läuft die Auf-/Zuroll-Animation von .scroll-lessons
  // tatsächlich ab, und die Scroll-Position der Seite bleibt stehen.
  header.onclick = () => {
    const open = wrap.classList.toggle('expanded');
    practiceScrollExpanded[opts.key] = open;
    setHint(open);
  };
  inner.appendChild(header);

  const body = document.createElement('div');
  body.className = 'scroll-lessons scroll-trainer-body';
  body.innerHTML = opts.html;
  (opts.extras || []).forEach(n => body.appendChild(n));
  inner.appendChild(body);

  frame.appendChild(inner);
  wrap.appendChild(frame);

  const roller = document.createElement('div');
  roller.className = 'scroll-roller';
  wrap.appendChild(roller);
  return wrap;
}
/* =========================================================
   DEINE WOCHE
   =========================================================
   Der Tagesziel-Ring beantwortet „bin ich für heute durch?". Was
   fehlte, war die Frage danach: „war das eine gute Woche?" — der
   Moment, in dem man sich über den eigenen Fortschritt freut und
   deshalb weitermacht.

   Bewusst ohne Wertung: keine Ziele, keine roten Zahlen, kein
   Vergleich mit anderen. Sieben Balken, vier Zahlen, fertig. Ein
   leerer Tag wird als leerer Tag gezeigt und nicht kommentiert —
   die Woche gehört dem Lernenden, nicht der App.
   ========================================================= */
function renderWeekCard(el){
  const w = weekSummary();
  const card = document.createElement('div');
  card.className = 'trainer-card';
  card.style.textAlign = 'left';

  if(w.fragen === 0){
    card.innerHTML = `<div class="setting-text">
        <h3>Deine Woche</h3>
        <p>Sobald du deine erste Übung dieser Woche beantwortet hast, steht hier, was du
        geschafft hast — Tag für Tag.</p>
      </div>`;
    el.appendChild(card);
    return;
  }

  const heute = todayStr();
  const balken = w.tage.map(t => {
    const hoehe = Math.max(3, Math.round((t.xp / w.bestesXp) * 100));
    const klasse = 'week-bar' + (t.datum === heute ? ' today' : '') + (t.xp === 0 ? ' empty' : '');
    return `<div class="week-col">
        <div class="week-bar-slot"><div class="${klasse}" style="height:${hoehe}%"
             title="${t.xp} XP"></div></div>
        <span>${t.wochentag}</span>
      </div>`;
  }).join('');

  card.innerHTML = `
    <div class="setting-text">
      <h3>Deine Woche</h3>
      <p>Die letzten sieben Tage. Die Höhe zeigt die XP des Tages.</p>
    </div>
    <div class="week-chart">${balken}</div>
    <div class="week-figures">
      <div><strong>${w.fragen}</strong><span>Fragen</span></div>
      <div><strong>${w.quote}&thinsp;%</strong><span>richtig</span></div>
      <div><strong>${w.lektionen}</strong><span>Lektionen</span></div>
      <div><strong>${w.aktiv}</strong><span>${w.aktiv === 1 ? 'Tag' : 'Tage'}</span></div>
    </div>`;
  el.appendChild(card);
}

  });

    color: 'var(--amber)',
    html: malbar.length === 0
      ? `<div class="trainer-emoji">🔒</div><h3>Noch keine Buchstaben freigeschaltet</h3>
         <p>Schließe zuerst eine Hangul-Lektion im Lernpfad ab – danach kannst du ihre Zeichen hier malen.</p>`
      : `<div class="trainer-emoji">🖌️</div><h3>${malbar.length} Zeichen zum Malen</h3>
         <p>Lesen können und schreiben können sind zweierlei. Hier malst du die Buchstaben selbst —

         <button class="btn btn-primary" id="startDrawTrainerBtn" style="margin-top:16px; background:var(--amber);">Malen starten</button>`
  });
  const drawBtn = $('startDrawTrainerBtn');
  if(drawBtn) drawBtn.onclick = (e) => { e.stopPropagation(); startSession('draw', { origin:'practice' }); };

  // ---- Fehlertrainer: gezielt zuletzt falsch beantwortete Fragen ----
  renderMistakesSection(el);
}

            + (settings.showRoman ? `<span class="concept-example-roman">${e.roman}</span>` : '');
          list.appendChild(row);
        });

/* =========================================================
   RENDERING: WÖRTERBUCH
   Zeigt Vokabeln/Redewendungen als Nachschlagewerk — seit dem
   25.08.2026 (Nutzer-Wunsch: "grundsätzlich sollen im Wörterbuch so wie
   auch in der Grammatik nur Wörter angezeigt werden, die auch schon
   gelernt wurden") ausschließlich aus ABGESCHLOSSENEN Lektionen.

   Warum das die richtige Grenze ist: Der Kurs baut streng aufeinander auf
   ("kein Lektionsschritt darf etwas abfragen, das nicht vorher eingeführt
   wurde", s. lektions-design-prinzipien.md). Ein Wörterbuch, das den
   gesamten künftigen Wortschatz ausbreitet, unterläuft genau das — es
   nimmt Einheiten vorweg, verrät Lösungen kommender Übungen und lässt die
   eigene Leistung nicht sichtbar werden. Der Vokabeltrainer und der
   Fehlertrainer arbeiten aus demselben Grund längst nur mit gelerntem
   Stoff (s. getLearnedVocabPool/getLearnedHangulWords), und der
   Grammatik-Reiter gated seine Karten ebenso.

   "Gelernt" heißt hier: die Lektion ist ABGESCHLOSSEN (completed) — die
   gleiche Grenze wie beim Fehlertrainer-Distraktorenpool. Im Testmodus
   (settings.unlockAll) ist wie überall alles sichtbar.
   Respektiert weiterhin die Anzeige-Einstellungen (Umschrift,
   Aussprache, Sageuk-Stil).
========================================================= */
function getDictionaryGroups(){
  // Zeigt sowohl echte Vokabel-Lektionen als auch die Alltagswörter aus
  // den Hangul-Lektionen — beides sind vollwertige, gelehrte Wörter.
  // Reihenfolge = Kursreihenfolge (vorher standen die Hangul-Wörter aus
  // die Hangul-Einheit gesammelt ganz UNTEN, hinter allen Vokabel-Lektionen).
  const showAll = settings.unlockAll;
  const groups = [];
  COURSE.forEach(l => {
    if(!showAll && !completed.has(l.id)) return;
    if(l.type === 'vocab' && l.vocab && l.vocab.length){
      groups.push({ title: l.title, icon: l.icon, items: l.vocab });
    } else if(l.type === 'hangul' && l.words && l.words.length){
      groups.push({ title: l.title, icon: l.icon, items: l.words });
    }
  });
  return groups;
}

  // Merkliste: Filter und eigene Übungssitzung

function renderDictionaryList(){
  const listWrap = $('dictList');
  if(!listWrap) return;
  listWrap.innerHTML = '';
  const q = dictSearchQuery.trim().toLowerCase();
  let totalShown = 0;

  getDictionaryGroups().forEach(group => {
    const filtered = group.items.filter(v => (!dictFavOnly || favorites.has(v.kr)) && (!q
      || v.de.toLowerCase().includes(q)
      || v.kr.toLowerCase().includes(q)
      || v.roman.toLowerCase().includes(q)));
    if(filtered.length === 0) return;
    totalShown += filtered.length;

    const groupTitle = document.createElement('div');
    groupTitle.className = 'dict-group-title';
    groupTitle.textContent = `${group.icon} ${group.title}`;
    listWrap.appendChild(groupTitle);

    filtered.forEach(v => {
      const card = document.createElement('div');
      card.className = 'dict-entry';
      card.innerHTML = `
        <div class="dict-main">
          <span class="dict-kr">${v.kr}${speakBtnHtml(v.kr)}</span>
          <span class="dict-de">${v.de}</span>
          <button type="button" class="dict-fav${favorites.has(v.kr) ? ' on' : ''}" data-fav="${escapeAttr(v.kr)}"
            aria-label="${favorites.has(v.kr) ? 'Aus der Merkliste entfernen' : 'Zur Merkliste hinzufügen'}">${favorites.has(v.kr) ? '★' : '☆'}</button>
        </div>
        ${settings.showRoman ? `<div class="dict-roman">${v.roman}</div>` : ''}
        ${(settings.sageukMode && v.sageuk) ? `<div class="dict-sageuk">
          <span class="label">📜 Sageuk</span>
          <span class="phrase">${v.sageuk.phrase}${speakBtnHtml(v.sageuk.phrase)}</span>
          ${settings.showRoman ? `<span class="roman">${v.sageuk.roman}</span>` : ''}
          ${v.sageuk.de ? `<span class="de">${v.sageuk.de}</span>` : ''}
        </div>` : ''}
      `;
      listWrap.appendChild(card);
    });
  });

  if(totalShown === 0){
    const empty = document.createElement('div');
    empty.className = 'trainer-card';
    empty.innerHTML = dictFavOnly
      ? `<div class="trainer-emoji">★</div><h3>Nichts gemerkt</h3><p>Tipp bei einem Wort auf den Stern, dann sammelt es sich hier.</p>`
      : `<div class="trainer-emoji">🔍</div><h3>Keine Treffer</h3><p>Versuch einen anderen Suchbegriff.</p>`;
    listWrap.appendChild(empty);
  }
  // Delegiert: ein Klick auf einen Stern schaltet ihn um, ohne die ganze
  // Liste neu zu bauen (sonst springt die Scroll-Position).
  listWrap.querySelectorAll('.dict-fav').forEach(btn => {
    btn.onclick = () => {
      const kr = btn.dataset.fav;
      toggleFavorite(kr);
      const on = favorites.has(kr);
      btn.classList.toggle('on', on);
      btn.textContent = on ? '★' : '☆';
      btn.setAttribute('aria-label', on ? 'Aus der Merkliste entfernen' : 'Zur Merkliste hinzufügen');
      const bar = $('dictFavToggle');
      if(bar) bar.textContent = `★ Nur Gemerkte (${favorites.size})`;
      if(favorites.size === 0 || dictFavOnly) renderDictionary();
    };
  });
}

   musste bei jeder Änderung mitgepflegt werden. Gewählt wird jetzt
   nur noch das Licht, nicht die Gestalt. */
