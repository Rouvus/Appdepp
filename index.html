/* Erzeugt den Inhalt der Joseon-Hintergrund-Kachel: Hügelsilhouetten in
   den Farben des Gemäldes (Jadegrün-Töne) links und rechts eines im
   Zickzack fließenden Flusses/Wasserfalls. ALLE Randlinien sind Summen
   von Sinusfunktionen, deren Frequenz ein ganzzahliges Vielfaches von
   1/Kachelhöhe ist — dadurch gilt für jede Randlinie f(0) === f(Kachel-
   höhe) UND f'(0) === f'(Kachelhöhe) exakt (Sinus ist 2π-periodisch).
   Reiht man die Kachel beliebig oft untereinander, schließt sie also
   sowohl in Position als auch in der Steigung nahtlos an sich selbst an
   — es ist rechnerisch unmöglich, den Übergang zu sehen, ganz gleich wie
   die Wellen im Detail geformt sind. */
function buildJoseonPatternSVG(){
  const W = 480, T = 900, STEP = 12;
  function wave(y, terms){
    let v = 0;
    terms.forEach(t => { v += t[1] * Math.sin(2*Math.PI*t[0]*y/T + t[2]); });
    return v;
  }
  function pathFromEdges(leftFn, rightFn){
    const left = [], right = [];
    for(let y = 0; y <= T; y += STEP){
      left.push(`${leftFn(y).toFixed(1)},${y}`);
      right.push(`${rightFn(y).toFixed(1)},${y}`);
    }
    return `M${left.join(' L')} L${right.reverse().join(' L')} Z`;
  }
  // Fluss: Mittellinie und Breite, beide periodisch — der Zickzack läuft
  // dadurch beim Wiederholen der Kachel ohne jeden Knick weiter.
  const riverCenter = y => 240 + wave(y, [[3, 55, 0], [5, 20, 1.7], [2, 15, 3.2]]);
  const riverHalf = y => 16 + wave(y, [[6, 5, .4]]);
  const riverLeft = y => riverCenter(y) - riverHalf(y);
  const riverRight = y => riverCenter(y) + riverHalf(y);

  // Vier Hügel-Schichten je Seite, direkt aneinandergereiht (keine Lücke):
  // Schicht 0 grenzt unmittelbar ans Ufer (dunkel/nah), jede weitere
  // Schicht liegt weiter außen und wird heller (fern) — wie bei
  // gestaffelten Bergketten. "gap" ist die Bandbreite dieser Schicht,
  // "terms" ihre wellige Außenkante (immer noch exakt periodisch).
  function buildSide(baseEdgeFn, sign, depths){
    // sign = -1 für links (Kanten wandern nach kleineren x), +1 für rechts.
    const edges = [baseEdgeFn];
    depths.forEach(d => {
      const prev = edges[edges.length - 1];
      edges.push(y => prev(y) + sign * (d.gap + wave(y, d.terms)));
    });
    let out = '';
    depths.forEach((d, i) => {
      const inner = edges[i];
      const outer = (i === depths.length - 1) ? (() => (sign < 0 ? -2 : W + 2)) : edges[i+1];
      const leftFn = sign < 0 ? outer : inner;
      const rightFn = sign < 0 ? inner : outer;
      out += `<path d="${pathFromEdges(leftFn, rightFn)}" fill="${d.color}" opacity="${d.op}"/>`;
    });
    return out;
  }
  const depthsL = [
    { color:'#182c22', op:1,   gap:12, terms:[[5, 4, 2.4], [7, 2, 1.1]] },
    { color:'#2e5747', op:.88, gap:24, terms:[[4, 9, 1.6], [7, 4, .2]] },
    { color:'#4c7d6c', op:.72, gap:30, terms:[[3, 12, .9], [5, 6, 3.4]] },
    { color:'#6f9c8c', op:.55, gap:38, terms:[[2, 14, 0], [5, 7, 2.1]] },
  ];
  const depthsR = [
    { color:'#182c22', op:1,   gap:12, terms:[[5, 4, 1.3], [7, 2, 2.9]] },
    { color:'#2e5747', op:.88, gap:24, terms:[[4, 9, .5], [7, 4, 2.6]] },
    { color:'#4c7d6c', op:.72, gap:30, terms:[[3, 12, 2.1], [5, 6, 1.2]] },
    { color:'#6f9c8c', op:.55, gap:38, terms:[[2, 14, 3.3], [5, 7, .7]] },
  ];
  let svg = `<rect x="0" y="0" width="${W}" height="${T}" fill="#151a54"/>`;
  svg += buildSide(riverLeft, -1, depthsL);
  svg += buildSide(riverRight, 1, depthsR);
  // Fluss selbst plus schmaler heller Glanzstreifen darin
  svg += `<path d="${pathFromEdges(riverLeft, riverRight)}" fill="#eef0df" opacity=".85"/>`;
  const glintLeft = y => riverCenter(y) - riverHalf(y) * .3;
  const glintRight = y => riverCenter(y) - riverHalf(y) * .05;
  svg += `<path d="${pathFromEdges(glintLeft, glintRight)}" fill="#ffffff" opacity=".4"/>`;
  return svg;
}
function initJoseonBackground(){
  const pattern = document.getElementById('joseonPattern');
  if(!pattern) return;
  pattern.innerHTML = buildJoseonPatternSVG();
}
/* Parallax für den Joseon-Landschafts-Hintergrund (#joseonBg): beim
   Scrollen nach oben (der Lernpfad wächst ja nach oben) verschiebt sich
   das Hügel-/Fluss-Muster NUR mit einem Bruchteil der Scroll-
   Geschwindigkeit — dadurch wirkt der Hintergrund weiter entfernt als
   der Vordergrund. Die Kachel ist 900px hoch und wiederholt sich in der
   <pattern>-Definition nahtlos endlos, daher "fließt" der Fluss beim
   Hochscrollen unbegrenzt weiter, ohne dass ein Übergang zu sehen ist. */
const JOSEON_PARALLAX_FACTOR = 0.35;
const JOSEON_TILE_HEIGHT = 900;
/* Warum das hier nicht mehr am <pattern> zieht (Feedback vom 26.08.2026:
   "der Hintergrund zittert beim Scrollen"):

   Bis hierher setzte jedes Scroll-Ereignis patternTransform auf der
   <pattern>-Definition. Das ist eine Änderung an der Malvorschrift
   selbst — der Browser muss daraufhin die GESAMTE gekachelte Fläche neu
   rastern, auf dem Hauptthread. Gescrollt wird aber nebenher vom
   Compositor, und die Scroll-Ereignisse treffen nicht im Bildtakt ein.
   Ergebnis: Der Hintergrund kommt mal ein Bild später, mal zwei, mal
   gar nicht — genau das sieht man als Zittern.

   Jetzt bewegt sich stattdessen das fertige Bild als Ganzes, per
   transform. Eine Verschiebung ist die einzige Änderung, die der
   Compositor ohne Neuzeichnen erledigen kann. Zusätzlich wird der
   Schreibvorgang in requestAnimationFrame gebündelt: pro Bild höchstens
   einmal, und zwar genau dann, wenn das Bild ohnehin gebaut wird.

   Damit beim Verschieben unten keine Kante auftaucht, ist das SVG um
   eine volle Kachelhöhe höher als das Fenster (s. CSS). */
let parallaxPending = false;
function applyJoseonParallax(){
  parallaxPending = false;
  const bg = document.getElementById('joseonBg');
  if(!bg) return;
  const svg = bg.firstElementChild;
  if(!svg) return;
  if(!document.body.classList.contains('theme-joseon')){
    svg.style.transform = '';
    return;
  }
  if(!parallaxWanted){
    /* Auch bei direkten Aufrufen (Farbwechsel, Neuzeichnen) darf die
       Landschaft dann nicht plötzlich springen. */
    svg.style.transform = 'translate3d(0, 0, 0)';
    return;
  }
  const offset = -((window.scrollY * JOSEON_PARALLAX_FACTOR) % JOSEON_TILE_HEIGHT);
  /* translate3d statt translateY: bittet den Browser ausdrücklich um
     eine eigene Ebene, die er ohne Neuzeichnen verschieben kann. */
  svg.style.transform = `translate3d(0, ${offset}px, 0)`;
}
function updateJoseonParallax(){
  if(parallaxPending) return;
  parallaxPending = true;
  requestAnimationFrame(applyJoseonParallax);
}
/* Wann die Landschaft mitwandert — und wann sie stillsteht.

   1. Wer Bewegung im System abbestellt hat, bekommt sie ruhig.

   2. Auf Geräten, die mit dem Finger bedient werden, ebenfalls — und
      das ist kein Geschmacksurteil, sondern eine technische Grenze
      (Rückmeldung vom 26.08.2026: "beim Scrollen mit dem Finger zittert
      der Hintergrund noch immer").
      Fingerscrollen samt Nachlauf erledigt das Betriebssystem am
      Programm vorbei, damit es auch dann flüssig bleibt, wenn die Seite
      beschäftigt ist. Die Scroll-Meldungen an das Programm kommen
      dabei unregelmäßig — mal mehrere pro Bild, mal minutenlang keine.
      Was auch immer man daran hängt, hinkt also mal mehr, mal weniger
      hinterher, und genau diese Unregelmäßigkeit sieht man als Zittern.
      Auf iOS ist das seit jeher so und lässt sich nicht wegprogrammieren;
      die frühere Behebung (Verschieben statt Neuzeichnen) hat die eine
      Ursache beseitigt, diese zweite bleibt.
      Ein ruhiger Hintergrund ist einem zitternden vorzuziehen — die
      Landschaft bleibt ja, nur die Tiefenwirkung entfällt. Am Rechner
      mit Mauszeiger, wo das Scrollen durch das Programm läuft, bleibt
      sie erhalten. */
const parallaxWanted = (() => {
  try{
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
    if(window.matchMedia('(hover: none)').matches) return false;
    return true;
  }catch(e){ return true; }
})();
if(parallaxWanted){
  window.addEventListener('scroll', updateJoseonParallax, { passive:true });
  window.addEventListener('resize', updateJoseonParallax, { passive:true });
/* Dreht sich das Gerät oder ändert sich die Schriftgröße, ändert sich
   auch die Höhe der unteren Leiste — dann muss der Sprung-Knopf neu
   ausgerichtet werden. */
window.addEventListener('resize', () => updateJumpBtn(), { passive:true });
}

/* =========================================================
   SESSION FLOW (gemeinsam für Lektion / Vokabeltrainer / Fehlertrainer)
========================================================= */
function buildSessionExercises(mode, opts){
  if(mode === 'lesson') return generateExercises(COURSE[opts.lessonIdx]);
  if(mode === 'practice') return buildPracticeSteps();
  if(mode === 'due') return buildDueSteps();
  if(mode === 'quick') return buildQuickSteps();
  if(mode === 'favorites') return buildFavoriteSteps();
  if(mode === 'hangultrainer') return buildHangulTrainerSteps();
  if(mode === 'draw') return buildDrawSteps();
  if(mode === 'mistakes') return buildMistakeSteps();
  return [];
}
/* Schreibt den Stand der laufenden Sitzung mit. Wird nach jeder Antwort
   und beim Wegschalten der App aufgerufen. */
function saveOpenSession(){
  if(!exercises.length || exIdx >= exercises.length || sessionMode === 'mistakes'){ openSession = null; }
  else {
    try{
      openSession = { mode: sessionMode, lessonIdx: currentLessonIdx, origin: sessionOrigin,
        exIdx, hearts, correctInLesson, exercises, savedAt: todayStr() };
    }catch(e){ openSession = null; }
  }
  saveState();
}
function clearOpenSession(){
  if(openSession === null) return;
  openSession = null;
  saveState();
}
/* Titel der unterbrochenen Sitzung für den Fortsetzen-Dialog. */
function openSessionTitle(sess){
  if(sess.mode === 'lesson' && COURSE[sess.lessonIdx]) return `„${COURSE[sess.lessonIdx].title}"`;
  if(sess.mode === 'practice') return 'dem Vokabeltrainer';
  if(sess.mode === 'hangultrainer') return 'dem Hangul-Trainer';
  if(sess.mode === 'draw') return 'der Mal-Übung';
  if(sess.mode === 'due') return 'einer fälligen Wiederholung';
  if(sess.mode === 'quick') return 'einer kurzen Übung';
  return 'einer Übung';
}
function resumeOpenSession(sess){
  sessionMode = sess.mode;
  sessionOrigin = sess.origin || 'home';
  currentSessionId = Date.now();
  currentLessonIdx = sess.lessonIdx;
  exercises = sess.exercises;
  exIdx = sess.exIdx;
  hearts = sess.hearts;
  correctInLesson = sess.correctInLesson || 0;
  repairQueue = [];
  repairSeen = new Set();
  revealRequested = false;
  updateHeaderStats();
  showScreen('lesson');
  renderExercise();
}
/* Beim Start anbieten, dort weiterzumachen, wo es aufgehört hat. Streng
   geprüft: kaputte oder veraltete Stände werden lieber verworfen als
   halb wiederhergestellt. */
function maybeOfferResume(){
  const sess = openSession;
  if(!sess || !Array.isArray(sess.exercises) || !sess.exercises.length) return false;
  if(sess.exIdx == null || sess.exIdx < 0 || sess.exIdx >= sess.exercises.length) return false;
  if(sess.mode === 'lesson' && !COURSE[sess.lessonIdx]) return false;
  const questions = sess.exercises.filter(e => e && e.mistakeMeta).length;
  showChoiceDialog({
    title:'Weitermachen?',
    message:`Du warst mitten in ${openSessionTitle(sess)} — bei Frage ${sess.exIdx + 1} von ${sess.exercises.length}`
      + (questions ? `, ${sess.correctInLesson || 0} davon schon richtig` : '') + '.',
    buttons: [
      { label:'Von vorn beginnen', className:'btn-gray', onClick: () => { clearOpenSession(); showHomeAtCurrentLesson(); } },
      { label:'Fortsetzen', className:'btn-primary', onClick: () => resumeOpenSession(sess) }
    ],
    stacked: true,
    dismissible: false
  });
  return true;
}
function startSession(mode, opts = {}){
  const built = buildSessionExercises(mode, opts);
  if(!built || built.length === 0) return; // nichts zu üben – z. B. leere Fehlerliste
  sessionMode = mode;
  sessionOrigin = opts.origin || 'home';
  currentSessionId = Date.now();
  currentLessonIdx = (opts.lessonIdx !== undefined) ? opts.lessonIdx : null;
  exercises = built;
  exIdx = 0;
  repairQueue = [];
  repairSeen = new Set();
  revealRequested = false;
  hearts = heartsForExercises(built);
  correctInLesson = 0;
  updateHeaderStats();
  showScreen('lesson');
  renderExercise();
}
function startLesson(idx){
  startSession('lesson', { lessonIdx: idx, origin:'home' });
}
/* =========================================================
   ONBOARDING: "BIST DU ANFÄNGER?"
   Statt eines blockierenden Dialogs steht diese Abfrage direkt als Karte
   im Lernpfad (zwischen dem grünen Titel-Kasten ganz unten und dem
   Beginn von die Hangul-Einheit) — siehe renderOnboardingCard, aufgerufen aus
   renderHome. Eine einzige Antwort legt beides fest:
   - "Ja, Anfänger" -> normaler Start, Umschrift an (Einfach).
   - "Nein, kann Hangul schon" -> die Hangul-Einheit wird komplett übersprungen
     (alle Lektionen abgeschlossen + gemeistert), Umschrift aus (Schwer).
   Nach der Antwort schrumpft die Karte zu einer kleinen, ausgegrauten
   Zusammenfassung ("Schwierigkeitsgrad: ..."). Beides bleibt jederzeit
   oben in den Einstellungen änderbar.
========================================================= */
function skipUnit1(){
  COURSE.forEach(l => {
    if(getCourseUnit(l) === 0){
      completed.add(l.id);
      getLessonQuestionKeys(l).forEach(k => masteredQuestions.add(k));
    }
  });
}
function renderOnboardingCard(home){
  if(onboarding.hangulAsked){
    const box = document.createElement('div');
    box.className = 'unit-banner unit-section-banner onboarding-summary';
    box.textContent = `Schwierigkeitsgrad: ${settings.showRoman ? 'Einfach' : 'Schwer'}`;
    home.appendChild(box);
    return;
  }
  const card = document.createElement('div');
  card.className = 'trainer-card onboarding-card';
  card.innerHTML = `
    <div class="trainer-emoji">🙋</div>
    <h3>Bist du Anfänger in Koreanisch?</h3>
    <p>Das entscheidet, ob die Hangul-Einheit übersprungen wird und ob zusätzlich die lateinische Umschrift
    angezeigt wird. Beides lässt sich später oben in den Einstellungen ändern.</p>
    <div class="modal-actions stacked" style="margin-top:16px;">
      <button type="button" class="btn btn-primary" id="onboardingBeginnerBtn">Ja, ich bin Anfänger</button>
      <button type="button" class="btn btn-blue" id="onboardingAdvancedBtn">Nein, ich kann Hangul schon</button>
    </div>`;
  home.appendChild(card);
  // Erst die Antwort öffnet den Kurs — und zwar an der Stelle, an der er
  // für diesen Lernenden beginnt: bei "Anfänger" die Hangul-Einheit mit
  // ihrer Kultur-Schriftrolle, bei "kann ich schon" die erste Sprach-
  // Einheit mit deren. Die Hangul-Kultur-Rolle wird dabei NICHT als
  // gesehen markiert: Wer später doch in die Hangul-Einheit schaut,
  // bekommt sie dann ganz normal — oder jederzeit über die Laterne.
  $('onboardingBeginnerBtn').onclick = () => {
    settings.showRoman = true;
    onboarding.hangulAsked = true;
    saveState();
    showHomeAtCurrentLesson();
  };
  $('onboardingAdvancedBtn').onclick = () => {
    skipUnit1();
    settings.showRoman = false;
    onboarding.hangulAsked = true;
    saveState();
    showHomeAtCurrentLesson();
  };
}
function showScreen(name){
  $('home').style.display = name === 'home' ? 'flex' : 'none';
  $('practice').style.display = name === 'practice' ? 'flex' : 'none';
  $('grammar').style.display = name === 'grammar' ? 'flex' : 'none';
  $('dictionary').style.display = name === 'dictionary' ? 'flex' : 'none';
  $('settings').style.display = name === 'settings' ? 'flex' : 'none';
  $('lesson').style.display = name === 'lesson' ? 'flex' : 'none';
  $('completeScreen').style.display = name === 'complete' ? 'flex' : 'none';
  $('failScreen').style.display = name === 'fail' ? 'flex' : 'none';
  const topLevel = ['home','practice','grammar','dictionary','settings'];
  $('bottomNav').style.display = topLevel.includes(name) ? 'flex' : 'none';
  if(topLevel.includes(name)){
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.screen === name));
  }
  currentScreenName = name;
  updateJumpBtn();
  /* Für den Android-Zurück-Knopf (s. unten, Abschnitt "Zurück-Knopf"):
     sobald wir den Lernpfad
     verlassen, kommt ein Eintrag in die Verlaufsliste, damit "Zurück"
     bei uns landet und nicht die App schließt. Während des Startvorgangs
     ist backGuardDepth noch undefined — dann tun wir nichts. */
  if(name !== 'home' && backGuardDepth > 0 && backGuardDepth < 2) pushBackGuard();
}
function renderScreenFor(name){
  if(name === 'home') renderHome();
  else if(name === 'practice') renderPractice();
  else if(name === 'grammar') renderGrammar();
  else if(name === 'dictionary') renderDictionary();
  else if(name === 'settings') renderSettings();
}
/* Index der Lektion, an der man gerade steht: die erste noch nicht
   abgeschlossene. Ist alles abgeschlossen, die letzte des Kurses. */
function getCurrentLessonIdx(){
  const idx = COURSE.findIndex(l => !completed.has(l.id));
  return idx === -1 ? COURSE.length - 1 : idx;
}
/* Scrollt den Lernpfad zu einer bestimmten Lektion (Feedback vom
   24.08.2026). Der Pfad ist absichtlich umgekehrt aufgebaut — die
   späteste Lektion steht oben, die erste ganz unten
   — dadurch landete man beim Öffnen der App bzw. beim Wechsel auf den
   Lernpfad-Reiter immer bei den zuletzt im Kurs liegenden, gesperrten
   Lektionen und musste an allem vorbeiscrollen, um die eigene Position zu
   finden. Mit inzwischen deutlich über 50 Lektionen ist das eine lange
   Strecke. Dieselbe Mechanik wie in goToOrigin(), nur ohne Bindung an
   eine gerade verlassene Sitzung. */
function scrollHomeToLesson(lessonIdx){
  const doScroll = () => {
    const target = document.querySelector(`#home [data-lesson-idx="${lessonIdx}"]`);
    if(target) target.scrollIntoView({ block: 'center' });
  };
  doScroll();
  /* Beim allerersten Rendern direkt nach dem Seitenaufbau greift ein
     einzelner Aufruf nicht: das endgültige Layout steht noch nicht fest
     (Schriftarten/Hintergrund-SVG kommen nach), und der Browser stellt
     zusätzlich seine eigene gemerkte Scroll-Position wieder her — beides
     überschreibt die eben gesetzte Position wieder. Deshalb in den
     folgenden zwei Frames noch einmal nachfassen; bei allen späteren
     Aufrufen (Reiterwechsel, Lektion verlassen) ist das ein
     wirkungsloser, aber harmloser Zusatz-Aufruf auf dieselbe Position. */
  requestAnimationFrame(() => requestAnimationFrame(doScroll));
}
/* Muss VOR dem Rendern laufen: im Joseon-Stil steckt die Lektion in einer
   zusammengerollten Schriftrolle, die schon beim Erzeugen offen sein muss
   (s. ausführlichen Kommentar in goToOrigin). */
function expandUnitForLesson(lessonIdx){
  scrollExpanded[getCourseUnit(COURSE[lessonIdx])] = true;
}
function showHomeAtCurrentLesson(){
  // Solange die Vorkenntnis-Frage unbeantwortet ist, wird NICHTS aufgerollt
  // und NICHTS eingeblendet (Feedback vom 25.08.2026). Vorher rollte die
  // App die Hangul-Schriftrolle beim allerersten Start selbst auf und
  // schob sofort deren Kultur-Rolle über den Bildschirm — noch bevor der
  // Lernende überhaupt gesagt hatte, ob er Hangul lernen will. Wer die
  // Schrift schon kann, bekam damit einen Text über eine Einheit, die für
  // ihn gleich darauf übersprungen wurde.
  if(!onboarding.hangulAsked){
    renderHome();
    showScreen('home');
    window.scrollTo(0, 0);
    return;
  }
  const idx = getCurrentLessonIdx();
  expandUnitForLesson(idx);
  renderHome();
  showScreen('home');
  scrollHomeToLesson(idx);
  // Die App rollt die Schriftrolle der aktuellen Einheit beim Start selbst
  // auf (s. expandUnitForLesson) — dieses Aufrollen IST das erste Öffnen
  // der Einheit und löst deshalb ihre Kultur-Schriftrolle aus. Ohne diesen
  // Aufruf käme sie nie von allein, weil der erste Antippen der Kopfzeile
  // die bereits offene Rolle nur zurollen würde.
  maybeShowCultureOnFirstOpen(getCourseUnit(COURSE[idx]));
}
function goToOrigin(){
  // Wer selbst aufhört, will beim nächsten Start nicht gefragt werden.
  clearOpenSession();
  // Beim Verlassen einer Lektion soll der Lernpfad die Einheit zeigen, aus
  // der die Lektion stammt, statt (wie bisher durch das Neu-Aufbauen des
  // Home-DOMs in renderHome()) ganz nach oben zu springen. Dafür merken wir
  // uns VOR dem Neu-Rendern, welche Lektion/Einheit gerade verlassen wird.
  const revealLessonIdx = (sessionOrigin === 'home' && currentLessonIdx !== null) ? currentLessonIdx : null;
  if(revealLessonIdx !== null){
    // Die zugehörige Schriftrolle muss schon beim Erzeugen als "offen"
    // gerendert werden (nicht erst nachträglich per Klasse umgeschaltet),
    // sonst würde die Aufroll-Animation die Positionsberechnung unten
    // verfälschen (Höhe wäre beim Messen noch nicht aktualisiert).
    scrollExpanded[getCourseUnit(COURSE[revealLessonIdx])] = true;
  }
  renderScreenFor(sessionOrigin);
  showScreen(sessionOrigin);
  if(revealLessonIdx !== null){
    scrollHomeToLesson(revealLessonIdx);
    // Wer beim Abschließen einer Lektion in eine neue Einheit rutscht,
    // sieht deren Kultur-Schriftrolle direkt beim Zurückkehren in den
    // Lernpfad — dort wird ihre Schriftrolle ja gerade aufgerollt.
    maybeShowCultureOnFirstOpen(getCourseUnit(COURSE[revealLessonIdx]));
  }
}
/* Umfang des Fortschritts-Rings: 2*pi*r mit r = 15.5 (s. SVG in der
   Kopfzeile). Wird als stroke-dasharray/-dashoffset benutzt, damit sich
   der Ring ohne zusätzliche Bibliothek füllen lässt. */
const DAILY_RING_CIRCUMFERENCE = 2 * Math.PI * 15.5;
function updateHeaderStats(){
  $('streakVal').textContent = streak;
  $('heartsInLesson').textContent = hearts;
  const goal = dailyGoalXp();
  const done = dailyXpToday();
  const reached = done >= goal;
  const ratio = Math.min(1, done / goal);
  const ring = $('dailyRing');
  ring.style.strokeDasharray = DAILY_RING_CIRCUMFERENCE;
  ring.style.strokeDashoffset = DAILY_RING_CIRCUMFERENCE * (1 - ratio);
  $('dailyGoal').classList.toggle('reached', reached);
  // Im Ring steht nur der Punktestand — "180/500" wäre in 36 px nicht
  // mehr lesbar. Das Ziel selbst nennt der Tooltip und die Einstellung.
  $('dailyGoalText').textContent = reached ? '✓' : `${done}`;
  $('dailyGoal').title = reached
    ? `Tagesziel erreicht: ${done} XP heute`
    : `Tagesziel: ${done} von ${goal} XP heute`;
}
function renderExercise(){
  answered = false;
  selectedOption = null;
  $('feedback').className = 'feedback';
  const ex = exercises[exIdx];
  const area = $('exerciseArea');
  area.innerHTML = '';

  // "Ich weiß es nicht" (Feedback vom 24.08.2026): nur bei echten
  // Fragen anbieten, nicht auf Einführungs-/Konzept-/Recap-Karten — dort
  // gibt es nichts zu wissen. Zentral hier gesetzt, weil die einzelnen
  // Zweige weiter unten teils früh zurückspringen.
  const revealBtn = $('revealBtn');
  revealBtn.style.display = QUIZ_KINDS.has(ex.kind) ? '' : 'none';
  revealBtn.onclick = () => { revealRequested = true; handleCheck(); };

  const pct = Math.round((exIdx / exercises.length) * 100);
  $('progressFill').style.width = pct + '%';

  const badge = document.createElement('div');
  badge.className = 'phase-badge phase-' + ex.phase;
  badge.textContent = PHASE_LABEL[ex.phase];
  area.appendChild(badge);

  if(ex.kind === 'info'){
    renderInfoStep(ex, area);
    $('checkBtn').disabled = false;
    $('checkBtn').textContent = 'Weiter';
    $('checkBtn').className = 'btn btn-primary';
    $('checkBtn').onclick = nextExercise;
    return;
  }

  if(ex.kind === 'recap'){
    renderRecapStep(ex, area);
    $('checkBtn').disabled = false;
    $('checkBtn').textContent = 'Weiter';
    $('checkBtn').className = 'btn btn-primary';
    $('checkBtn').onclick = nextExercise;
    return;
  }

  if(ex.kind === 'concept'){
    renderConceptStep(ex, area);
    $('checkBtn').disabled = false;
    $('checkBtn').textContent = 'Weiter';
    $('checkBtn').className = 'btn btn-primary';
    $('checkBtn').onclick = nextExercise;
    return;
  }

  // ---- Lückentext ("cloze") und Satzbau ("sentence") haben ein eigenes
  // Layout (kein einzelner KR-Begriff als Prompt-Karte), bekommen daher
  // vor dem generischen mc/type/build-Block einen eigenen Zweig. ----
  if(ex.kind === 'cloze' || ex.kind === 'sentence'){
    const h2x = document.createElement('h2');
    h2x.textContent = ex.title;
    area.appendChild(h2x);
    if(ex.kind === 'cloze') renderClozeStep(ex, area);
    else renderSentenceStep(ex, area);
    $('checkBtn').disabled = true;
    $('checkBtn').textContent = 'Prüfen';
    $('checkBtn').className = 'btn btn-primary';
    $('checkBtn').onclick = handleCheck;
    return;
  }

  // ---- Hörverstehen: eigener Zweig, weil der Prompt kein sichtbarer
  // Begriff ist, sondern die Sprachausgabe selbst. ----
  if(ex.kind === 'listen'){
    const h2l = document.createElement('h2');
    h2l.textContent = ex.title;
    area.appendChild(h2l);
    renderListenStep(ex, area);
    $('checkBtn').disabled = true;
    $('checkBtn').textContent = 'Prüfen';
    $('checkBtn').className = 'btn btn-primary';
    $('checkBtn').onclick = handleCheck;
    if(!listenAsked) askCanHear(ex);
    return;
  }

  // ---- apply-/practice-/mistakes-Schritte: mc / type / build (aktive Abfrage) ----
  const h2 = document.createElement('h2');
  h2.textContent = ex.title;
  area.appendChild(h2);
  const card = document.createElement('div');
  card.className = 'prompt-card';
  card.innerHTML = `<div class="prompt-kr-row"><span class="prompt-kr">${ex.prompt}</span>${ex.promptIsKr ? speakBtnHtml(ex.prompt) : ''}</div>`
    + (ex.sub ? romanHtml(ex.sub) : '');
  area.appendChild(card);
  if(ex.kind === 'mc'){
    const opts = document.createElement('div');
    opts.className = 'options';
    ex.options.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'option';
      b.dataset.value = opt;
      if(ex.optionsAreKr){
        b.innerHTML = `<span class="option-text">${opt}</span>${speakBtnHtml(opt)}`;
      } else {
        b.textContent = opt;
      }
      b.onclick = () => selectOption(b, opt);
      opts.appendChild(b);
    });
    area.appendChild(opts);
  } else if(ex.kind === 'type'){
    const input = document.createElement('input');
    input.className = 'type-input';
    input.placeholder = 'Antwort eingeben...';
    // Bei mehrteiligen Umschriften/Übersetzungen (mit Leerzeichen, z. B.
    // "annyeonghi gaseyo") dürfen mobile Tastaturen NICHT "mithelfen" —
    // Autokorrektur/Auto-Großschreibung/Rechtschreibprüfung können einzelne
    // Wörter verändern oder (bei Wischtastaturen) versehentlich doppelte
    // Leerzeichen einfügen. Alles aus, damit exakt das im Feld landet, was
    // eingetippt wurde.
    input.autocomplete = 'off';
    input.setAttribute('autocorrect', 'off'); // Safari/iOS-spezifisch, kein Standard-DOM-Property
    input.autocapitalize = 'off';
    input.spellcheck = false;
    input.oninput = () => { $('checkBtn').disabled = input.value.trim().length === 0; };
    // Kein eigener Enter-Handler mehr nötig — der globale document-Keydown-
    // Listener (s. weiter oben, nach dem Lautsprecher-Klick-Handler) deckt
    // Enter jetzt einheitlich für alle Übungsarten ab (inkl. "Weiter").
    area.appendChild(input);
    setTimeout(() => input.focus(), 50);
  } else if(ex.kind === 'build'){
    renderBuildStep(ex, area);
  } else if(ex.kind === 'buildword'){
    renderBuildWordStep(ex, area);
  } else if(ex.kind === 'draw'){
    renderDrawStep(ex, area);
  }
  $('checkBtn').disabled = true;
  $('checkBtn').textContent = 'Prüfen';
  $('checkBtn').className = 'btn btn-primary';
  $('checkBtn').onclick = handleCheck;
}
/* ---- Hörverstehen: Sprachausgabe statt sichtbarem Prompt ----
   Das koreanische Schriftbild bleibt zunächst verborgen. "Text anzeigen"
   ist der bewusste Notausgang: er deckt das Wort auf, falls die
   Sprachausgabe auf dem Gerät gerade nicht funktioniert oder zu undeutlich
   ist — die Frage bleibt so immer beantwortbar, statt in einer stummen
   Sackgasse zu enden. Nach dem Antworten wird der Text ohnehin automatisch
   aufgedeckt (s. handleCheck), damit man Gehörtes und Schriftbild
   zusammenbringen kann. */
function listenRevealHtml(ex){
  return `<span class="listen-kr">${ex.listenText}</span>`
    + ((settings.showRoman && ex.listenRoman) ? `<span class="listen-roman">${ex.listenRoman}</span>` : '');
}
function revealListenText(ex){
  const box = $('listenReveal');
  if(box){ box.hidden = false; box.innerHTML = listenRevealHtml(ex); }
  const btn = $('listenTextBtn');
  if(btn) btn.style.display = 'none';
}
/* Einmalige Rückfrage vor der ersten Hörübung eines App-Starts. "Nein"
   entfernt alle Hörübungen aus der laufenden Sitzung und unterbindet ihre
   Erzeugung bis zum nächsten Start der App (s. listenExercisesAvailable) —
   ohne die dauerhafte Einstellung anzufassen. */
function askCanHear(ex){
  showChoiceDialog({
    title: 'Kannst du gerade Ton hören?',
    message: 'Für Hörverstehen-Übungen wird das Wort vorgelesen. Ohne Ton lassen sie sich nicht lösen – dann überspringen wir sie einfach.',
    dismissible: false,
    stacked: true,
    buttons: [
      { label: 'Ja, Ton geht', onClick: () => {
          listenAsked = true;
          listenAllowedThisRun = true;
          speak(ex.listenText);
        } },
      { label: 'Nein, gerade nicht', className: 'btn-secondary', onClick: () => {
          listenAsked = true;
          listenAllowedThisRun = false;
          dropListenExercises();
        } }
    ]
  });
}
/* Entfernt die Hörübungen aus der laufenden Sitzung. exIdx zeigt beim
   Aufruf auf die gerade angezeigte Hörübung; nach dem Filtern steht an
   dieser Stelle automatisch die nächste andersartige Übung, sodass ein
   erneutes Rendern genügt. Bleibt nichts übrig, ist die Sitzung fertig. */
function dropListenExercises(){
  exercises = exercises.filter(e => e.kind !== 'listen');
  if(exercises.length === 0 || exIdx >= exercises.length){ finishSession(); return; }
  answered = false;
  renderExercise();
}
function renderListenStep(ex, area){
  const card = document.createElement('div');
  card.className = 'prompt-card listen-card';
  card.innerHTML = `
    <button type="button" class="listen-play" id="listenPlayBtn" aria-label="Noch einmal anhören">🔊</button>
    <button type="button" class="listen-slow-btn" id="listenSlowBtn">🐢 Langsam &amp; deutlich</button>
    <div class="listen-hint">Tippe auf das Symbol, um es noch einmal zu hören.</div>
    <div class="listen-reveal" id="listenReveal" hidden></div>
    <button type="button" class="listen-text-btn" id="listenTextBtn">Text anzeigen</button>`;
  area.appendChild(card);
  const opts = document.createElement('div');
  opts.className = 'options';
  ex.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'option';
    b.dataset.value = opt;
    b.textContent = opt;
    b.onclick = () => selectOption(b, opt);
    opts.appendChild(b);
  });
  area.appendChild(opts);
  $('listenPlayBtn').onclick = () => speak(ex.listenText);
  $('listenSlowBtn').onclick = () => speak(ex.listenText, SPEAK_RATE_SLOW);
  $('listenTextBtn').onclick = () => revealListenText(ex);
  // Einmal automatisch vorspielen. Kurze Verzögerung, damit die Karte
  // vorher sichtbar ist und die Sprachausgabe nicht mitten in den
  // Bildschirmwechsel fällt. Steht die Ton-Rückfrage noch aus (erste
  // Hörübung dieses App-Starts), wird NICHT automatisch abgespielt —
  // sonst redet die App los, während der Dialog noch fragt, ob das
  // gerade überhaupt passt.
  if(listenAsked) setTimeout(() => speak(ex.listenText), 180);
}
/* ---- Konzept-Karte: erklärt eine Schreibregel (z. B. das stumme ㅇ) ---- */
function renderConceptStep(ex, area){
  const h2 = document.createElement('h2');

        + (settings.showRoman ? `<span class="concept-example-roman">${e.roman}</span>` : '')
        + (e.badge ? `<span class="concept-example-badge ${e.badgeClass || ''}">${e.badge}</span>` : '');
      list.appendChild(row);
    });

}
/* ---- Silbenbau-Übung: Buchstaben-Kacheln zu einer Ziel-Silbe zusammensetzen ---- */
let buildState = null;
function renderBuildStep(ex, area){
  buildState = { initial:null, medial:null, final:null, final1:null, final2:null, active:'initial' };
  // Bei 겹받침 (Doppel-Batchim, z. B. ㄶ in 찮) braucht die Silbe zwei
  // getrennte Schlusskonsonant-Kacheln (final1+final2) statt einer.
  const finalKeys = ex.needsDoubleFinal ? ['final1','final2'] : (ex.needsFinal ? ['final'] : []);
  const slotOrder = ['initial','medial'].concat(finalKeys);
  const slotLabels = { initial:'1. Konsonant', medial:'Vokal', final:'Schlusskonsonant', final1:'Schlusskonsonant 1', final2:'Schlusskonsonant 2' };

  const slotsWrap = document.createElement('div');
  slotsWrap.className = 'build-slots';
  slotOrder.forEach(key => {
    const slot = document.createElement('button');
    slot.type = 'button';
    slot.className = 'build-slot';
    slot.dataset.slot = key;
    slot.title = slotLabels[key];
    slot.onclick = () => { if(answered) return; buildState.active = key; updateUI(); };
    slotsWrap.appendChild(slot);
  });
  area.appendChild(slotsWrap);

  const preview = document.createElement('div');
  preview.className = 'build-preview';
  area.appendChild(preview);

  const resetBtn = document.createElement('button');
  resetBtn.type = 'button';
  resetBtn.className = 'build-reset-btn';
  resetBtn.textContent = '↺ Zurücksetzen';
  resetBtn.onclick = () => { if(answered) return; buildState = { initial:null, medial:null, final:null, final1:null, final2:null, active:'initial' }; updateUI(); };
  area.appendChild(resetBtn);

  const consGroup = document.createElement('div');
  consGroup.className = 'build-palette-group';
  const consLabel = document.createElement('div');
  consLabel.className = 'build-palette-label';
  consLabel.textContent = 'Konsonanten';
  consGroup.appendChild(consLabel);
  const consTiles = document.createElement('div');
  consTiles.className = 'build-tiles';
  ex.consonantTiles.forEach(ch => {
    const t = document.createElement('button');
    t.type = 'button';
    t.className = 'build-tile';
    t.textContent = ch;
    t.onclick = () => { if(answered) return; placeTile(ch); };
    consTiles.appendChild(t);
  });
  consGroup.appendChild(consTiles);
  area.appendChild(consGroup);

  const vowGroup = document.createElement('div');
  vowGroup.className = 'build-palette-group';
  const vowLabel = document.createElement('div');
  vowLabel.className = 'build-palette-label';
  vowLabel.textContent = 'Vokale';
  vowGroup.appendChild(vowLabel);
  const vowTiles = document.createElement('div');
  vowTiles.className = 'build-tiles';
  ex.vowelTiles.forEach(ch => {
    const t = document.createElement('button');
    t.type = 'button';
    t.className = 'build-tile';
    t.textContent = ch;
    t.onclick = () => { if(answered) return; placeTile(ch); };
    vowTiles.appendChild(t);
  });
  vowGroup.appendChild(vowTiles);
  area.appendChild(vowGroup);

  function placeTile(ch){
    buildState[buildState.active] = ch;
    const idx = slotOrder.indexOf(buildState.active);
    const nextEmpty = slotOrder.slice(idx + 1).find(k => !buildState[k]) || slotOrder.find(k => !buildState[k]);
    if(nextEmpty) buildState.active = nextEmpty;
    updateUI();
  }

  function updateUI(){
    slotsWrap.querySelectorAll('.build-slot').forEach(s => {
      const key = s.dataset.slot;
      s.textContent = buildState[key] || '_';
      s.classList.toggle('active', buildState.active === key && !answered);
      s.classList.toggle('filled', !!buildState[key]);
    });
    const finalChar = ex.needsDoubleFinal
      ? ((buildState.final1 && buildState.final2) ? joinCompoundFinal(buildState.final1, buildState.final2) : null)
      : buildState.final;
    const composed = (buildState.initial && buildState.medial)
      ? composeSyllable(buildState.initial, buildState.medial, finalChar)
      : null;
    preview.textContent = composed || '?';
    const allFilled = slotOrder.every(k => buildState[k]);
    $('checkBtn').disabled = !allFilled;
  }

  updateUI();
}
/* ---- Wortbau-Übung: ganzes (mehrsilbiges) Wort aus der Umschrift Silbe
   für Silbe nachbauen, inkl. eigener Entscheidung pro Silbe, wie viele
   Blöcke sie braucht: 2 (Anfangskonsonant+Vokal), 3 (+Schlusskonsonant)
   oder 4 (+Doppel-Schlusskonsonant/겹받침, s. COMPOUND_FINALS weiter oben).
   Anders als die einzelne Silbenbau-Übung (renderBuildStep) baut diese
   Funktion die Silben-Karten bei JEDER Interaktion komplett neu auf (statt
   nur Textinhalte zu aktualisieren) — nötig, weil sich die Zahl der Slots
   pro Silbe durch den Block-Umschalter ändern kann. ---- */
let buildWordState = null;
let buildWordRender = null;
function newBuildWordSyllable(){
  return { blockCount:2, initial:null, medial:null, final:null, final2:null };
}
/* Setzt eine Wortbau-Silbe (blockCount + Kacheln) in den echten Hangul-
   Schlusskonsonanten um: bei 4 Blöcken müssen erst final+final2 über
   joinCompoundFinal() zum Unicode-Zeichen (z. B. ㄶ) zusammengefügt werden.
   Gemeinsam von render() und handleCheck() genutzt, damit Vorschau und
   Auswertung nie auseinanderlaufen. */
function composeBuildWordSyllable(syl){
  if(!(syl.initial && syl.medial)) return null;
  let finalChar = null;
  if(syl.blockCount === 3){
    finalChar = syl.final || null;
  } else if(syl.blockCount === 4){
    finalChar = (syl.final && syl.final2) ? joinCompoundFinal(syl.final, syl.final2) : null;
  }
  return composeSyllable(syl.initial, syl.medial, finalChar);
}
/* =========================================================
   MAL-ÜBUNG: die Zeichenfläche
   =========================================================
   Gezeichnet wird mit Zeigergeräte-Ereignissen (pointer*), die Finger,
   Stift und Maus gleich behandeln. Zwei Dinge sind dabei wichtig:
   - touch-action:none auf der Fläche, sonst scrollt das Malen die Seite.
   - setPointerCapture, sonst reißt der Strich ab, sobald der Finger
     kurz über den Rand gerät.
   Die Punkte werden in 0..1 abgelegt, unabhängig von der Bildschirm-
   größe — der Erkenner rechnet ohnehin normiert.
   ========================================================= */
let drawState = null;
function drawFlaecheMalen(){
  if(!drawState) return;
  const { ctx, w, h } = drawState;
  ctx.clearRect(0, 0, w, h);
  /* Eine zarte Hilfslinie in der Mitte — wie das Karo im Schreibheft.
     Sie hilft beim Augenmaß, ohne eine Vorlage vorzugeben. */
  ctx.save();
  ctx.strokeStyle = 'rgba(120,100,60,.18)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(w/2, h*0.06); ctx.lineTo(w/2, h*0.94);
  ctx.moveTo(w*0.06, h/2); ctx.lineTo(w*0.94, h/2);
  ctx.stroke();
  ctx.restore();

  if(drawState.vorlage){
    /* Nach dem Prüfen: die richtige Form zum Vergleich darüberlegen. */
    ctx.save();
    ctx.strokeStyle = drawState.vorlageFarbe || 'rgba(90,140,110,.55)';
    ctx.lineWidth = Math.max(6, w * 0.045);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    formZuStrichen(JAMO_FORMEN[drawState.vorlage] || []).forEach(strich => {
      ctx.beginPath();
      strich.forEach(([x, y], i) => {
        const px = w * (0.10 + x * 0.80), py = h * (0.10 + y * 0.80);
        if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.stroke();
    });
    ctx.restore();
  }

  ctx.save();
  ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--text').trim() || '#2b2620';
  ctx.lineWidth = Math.max(5, w * 0.038);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  drawState.striche.forEach(strich => {
    if(strich.length < 2) return;
    ctx.beginPath();
    strich.forEach(([x, y], i) => {
      if(i === 0) ctx.moveTo(x * w, y * h); else ctx.lineTo(x * w, y * h);
    });
    ctx.stroke();
  });
  ctx.restore();
}
function renderDrawStep(ex, area){
  /* KEINE eigene Aufgabenkarte: renderExercise hat den Buchstaben schon
     angezeigt (dafür tragen Mal-Übungen promptIsKr und sub). Eine zweite
     hätte ihn doppelt gezeigt. */
  const feld = document.createElement('div');
  feld.className = 'draw-field';
  const cv = document.createElement('canvas');
  cv.className = 'draw-canvas';
  feld.appendChild(cv);
  area.appendChild(feld);

  const leiste = document.createElement('div');
  leiste.className = 'draw-actions';
  /* Anhören ist erlaubt und hilfreich: Der Klang verrät die FORM nicht,
     er verbindet nur Laut und Zeichen — genau darum geht es hier. */
  if(settings.showPronunciation && pronunciationAvailable()){
    const hoeren = document.createElement('button');
    hoeren.type = 'button';
    hoeren.className = 'listen-slow-btn';
    hoeren.textContent = '🔊 Anhören';
    hoeren.onclick = () => speak(ex.correct);
    leiste.appendChild(hoeren);
  }
  const leeren = document.createElement('button');
  leeren.type = 'button';
  leeren.className = 'listen-slow-btn';
  leeren.textContent = '↺ Nochmal';
  leiste.appendChild(leeren);
  area.appendChild(leiste);

  /* Die Fläche wird in Gerätepunkten gerechnet, damit der Strich auf
     hochauflösenden Bildschirmen nicht ausfranst. */
  /* 260 px: groß genug zum Malen mit dem Finger, klein genug, dass
     Rückmeldung und Prüfen-Knopf ohne Scrollen sichtbar bleiben. */
  const seite = Math.min(feld.clientWidth || 260, 260);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = seite + 'px';
  cv.style.height = seite + 'px';
  cv.width = Math.round(seite * dpr);
  cv.height = Math.round(seite * dpr);
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  drawState = { striche: [], aktiv: null, ctx, canvas: cv, w: seite, h: seite, vorlage: null };
  drawFlaecheMalen();

  const punktAus = (e) => {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
  };
  cv.addEventListener('pointerdown', (e) => {
    if(answered) return;
    e.preventDefault();
    try{ cv.setPointerCapture(e.pointerId); }catch(err){ /* ältere Browser */ }
    drawState.aktiv = [punktAus(e)];
    drawState.striche.push(drawState.aktiv);
  });
  cv.addEventListener('pointermove', (e) => {
    if(answered || !drawState.aktiv) return;
    e.preventDefault();
    drawState.aktiv.push(punktAus(e));
    drawFlaecheMalen();
  });
  const strichEnde = () => {
    if(!drawState || !drawState.aktiv) return;
    /* Ein einzelner Tipp ist kein Strich — sonst zählt jedes versehentliche
       Antippen als Zeichnung und der Prüfen-Knopf wird scharf. */
    if(drawState.aktiv.length < 2) drawState.striche.pop();
    drawState.aktiv = null;
    drawFlaecheMalen();
    if(drawState.striche.length) $('checkBtn').disabled = false;
  };
  cv.addEventListener('pointerup', strichEnde);
  cv.addEventListener('pointercancel', strichEnde);
  cv.addEventListener('pointerleave', strichEnde);

  leeren.onclick = () => {
    if(answered) return;
    drawState.striche = []; drawState.aktiv = null; drawState.vorlage = null;
    drawFlaecheMalen();
    $('checkBtn').disabled = true;
  };
}
function renderBuildWordStep(ex, area){
  buildWordState = {
    syllables: Array.from({ length: ex.syllableCount }, newBuildWordSyllable),
    active: { i:0, key:'initial' }
  };

  const syllablesWrap = document.createElement('div');
  syllablesWrap.className = 'buildword-syllables';
  area.appendChild(syllablesWrap);

  const resetBtn = document.createElement('button');
  resetBtn.type = 'button';
  resetBtn.className = 'build-reset-btn';
  resetBtn.textContent = '↺ Zurücksetzen';
  resetBtn.onclick = () => {
    if(answered) return;
    buildWordState = {
      syllables: Array.from({ length: ex.syllableCount }, newBuildWordSyllable),
      active: { i:0, key:'initial' }
    };
    render();
  };
  area.appendChild(resetBtn);

  const consGroup = document.createElement('div');
  consGroup.className = 'build-palette-group';
  const consLabel = document.createElement('div');
  consLabel.className = 'build-palette-label';
  consLabel.textContent = 'Konsonanten';
  consGroup.appendChild(consLabel);
  const consTiles = document.createElement('div');
  consTiles.className = 'build-tiles';
  ex.consonantTiles.forEach(ch => {
    const t = document.createElement('button');
    t.type = 'button';
    t.className = 'build-tile';
    t.textContent = ch;
    t.onclick = () => { if(answered) return; placeTile(ch); };
    consTiles.appendChild(t);
  });
  consGroup.appendChild(consTiles);
  area.appendChild(consGroup);

  const vowGroup = document.createElement('div');
  vowGroup.className = 'build-palette-group';
  const vowLabel = document.createElement('div');
  vowLabel.className = 'build-palette-label';
  vowLabel.textContent = 'Vokale';
  vowGroup.appendChild(vowLabel);
  const vowTiles = document.createElement('div');
  vowTiles.className = 'build-tiles';
  ex.vowelTiles.forEach(ch => {
    const t = document.createElement('button');
    t.type = 'button';
    t.className = 'build-tile';
    t.textContent = ch;
    t.onclick = () => { if(answered) return; placeTile(ch); };
    vowTiles.appendChild(t);
  });
  vowGroup.appendChild(vowTiles);
  area.appendChild(vowGroup);

  function slotOrderFor(i){
    const bc = buildWordState.syllables[i].blockCount;
    if(bc === 4) return ['initial','medial','final','final2'];
    if(bc === 3) return ['initial','medial','final'];
    return ['initial','medial'];
  }
  function flatSlots(){
    const flat = [];
    buildWordState.syllables.forEach((syl, i) => slotOrderFor(i).forEach(key => flat.push({ i, key })));
    return flat;
  }
  function placeTile(ch){
    buildWordState.syllables[buildWordState.active.i][buildWordState.active.key] = ch;
    const flat = flatSlots();
    const curIdx = flat.findIndex(s => s.i === buildWordState.active.i && s.key === buildWordState.active.key);
    for(let off = 1; off <= flat.length; off++){
      const cand = flat[(curIdx + off) % flat.length];
      if(!buildWordState.syllables[cand.i][cand.key]){ buildWordState.active = { i:cand.i, key:cand.key }; break; }
    }
    render();
  }

  function render(){
    syllablesWrap.innerHTML = '';
    buildWordState.syllables.forEach((syl, i) => {
      const group = document.createElement('div');
      group.className = 'buildword-syllable';

      const num = document.createElement('div');
      num.className = 'buildword-syllable-num';
      num.textContent = `Silbe ${i + 1}`;
      group.appendChild(num);

      const toggle = document.createElement('div');
      toggle.className = 'buildword-block-toggle';
      [['2 Blöcke', 2], ['3 Blöcke', 3], ['4 Blöcke', 4]].forEach(([label, val]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'buildword-block-btn' + (syl.blockCount === val ? ' active' : '');
        b.disabled = answered;
        b.textContent = label;
        b.onclick = () => {
          if(answered) return;
          syl.blockCount = val;
          if(val < 3) syl.final = null;
          if(val < 4) syl.final2 = null;
          const order = slotOrderFor(i);
          buildWordState.active = { i, key: order.find(k => !syl[k]) || 'initial' };
          render();
        };
        toggle.appendChild(b);
      });
      group.appendChild(toggle);

      const slots = document.createElement('div');
      slots.className = 'buildword-slots';
      slotOrderFor(i).forEach(key => {
        const slot = document.createElement('button');
        slot.type = 'button';
        slot.className = 'buildword-slot';
        slot.disabled = answered;
        slot.textContent = syl[key] || '_';
        slot.classList.toggle('active', !answered && buildWordState.active.i === i && buildWordState.active.key === key);
        slot.classList.toggle('filled', !!syl[key]);
        slot.onclick = () => { if(answered) return; buildWordState.active = { i, key }; render(); };
        slots.appendChild(slot);
      });
      group.appendChild(slots);

      const preview = document.createElement('div');
      preview.className = 'buildword-preview';
      const composed = composeBuildWordSyllable(syl);
      preview.textContent = composed || '?';
      if(answered) preview.classList.add(composed === ex.correct[i] ? 'correct' : 'wrong');
      group.appendChild(preview);

      syllablesWrap.appendChild(group);
    });
    const allFilled = buildWordState.syllables.every((syl, i) => slotOrderFor(i).every(k => syl[k]));
    if(!answered) $('checkBtn').disabled = !allFilled;
  }

  buildWordRender = render;
  render();
}
/* ---- Lückentext ("cloze"): Satz mit einer Lücke, Wortpool als Chips ---- */
let clozeState = null;
let clozeRender = null;
function renderClozeStep(ex, area){
  clozeState = { filled: null };

  if(ex.contextDe){
    const ctx = document.createElement('div');
    ctx.className = 'cloze-context';
    ctx.textContent = ex.contextDe + (ex.contextRoman ? ` (${ex.contextRoman})` : '');
    area.appendChild(ctx);
  }

  const sentenceEl = document.createElement('div');
  sentenceEl.className = 'cloze-sentence';
  area.appendChild(sentenceEl);

  const sentenceRomanEl = document.createElement('div');
  sentenceRomanEl.className = 'cloze-sentence-roman';
  area.appendChild(sentenceRomanEl);

  const poolWrap = document.createElement('div');
  poolWrap.className = 'build-tiles';
  poolWrap.style.justifyContent = 'center';
  area.appendChild(poolWrap);

  function render(){
    sentenceEl.innerHTML = '';
    ex.parts.forEach(p => {
      if(p === null){
        const slot = document.createElement('button');
        slot.type = 'button';
        slot.className = 'cloze-slot' + (clozeState.filled ? ' filled' : '');
        slot.disabled = answered;
        slot.textContent = clozeState.filled || '___';
        slot.onclick = () => { if(answered || !clozeState.filled) return; clozeState.filled = null; render(); };
        sentenceEl.appendChild(slot);
      } else {
        const span = document.createElement('span');
        span.textContent = ' ' + p + ' ';
        sentenceEl.appendChild(span);
      }
    });

    // Umschrift-Zeile: folgt Wort für Wort derselben Lücken-Logik wie oben
    // (___ bis eine Kachel gewählt ist) — verrät die Lösung nie vorab,
    // zeigt nach dem Ausfüllen aber immer die Umschrift der GEWÄHLTEN
    // Kachel (auch wenn die falsch ist), analog zur koreanischen Zeile.
    if(settings.showRoman && ex.partsRoman){
      const romanText = ex.parts.map((p, i) => {
        if(p !== null) return ex.partsRoman[i] || '';
        if(!clozeState.filled) return '___';
        return (ex.poolRoman && ex.poolRoman[clozeState.filled]) || '';
      }).join(' ').replace(/\s+/g, ' ').trim();
      sentenceRomanEl.textContent = romanText;
      sentenceRomanEl.style.display = '';
    } else {
      sentenceRomanEl.textContent = '';
      sentenceRomanEl.style.display = 'none';
    }

    poolWrap.innerHTML = '';
    ex.pool.forEach(word => {
      const t = document.createElement('button');
      t.type = 'button';
      const roman = (settings.showRoman && ex.poolRoman) ? ex.poolRoman[word] : null;
      t.className = 'build-tile' + (roman ? ' cloze-tile' : '');
      if(roman){
        t.innerHTML = `<span>${word}</span><span class="tile-roman">${roman}</span>`;
      } else {
        t.textContent = word;
      }
      t.disabled = answered || clozeState.filled === word;
      t.onclick = () => { if(answered) return; clozeState.filled = word; render(); };
      poolWrap.appendChild(t);
    });
    if(!answered) $('checkBtn').disabled = clozeState.filled === null;
  }
  clozeRender = render;
  render();
}
/* ---- Satzbau ("sentence"): Wortpool zu geordnetem Satz zusammensetzen,
   bidirektional DE<->KR, koreanischer (Zwischen-)Stand jederzeit hörbar ---- */
let sentenceState = null;
let sentenceRender = null;
function renderSentenceStep(ex, area){
  sentenceState = { chosen: [], remaining: ex.pool.slice() };

  const promptRow = document.createElement('div');
  promptRow.className = 'sentence-prompt-row';
  area.appendChild(promptRow);

  const answerRow = document.createElement('div');
  answerRow.className = 'sentence-answer-row';
  area.appendChild(answerRow);

  const poolWrap = document.createElement('div');
  poolWrap.className = 'sentence-pool';
  area.appendChild(poolWrap);

  function render(){
    promptRow.innerHTML = `<div class="sentence-prompt-text">${ex.promptText}${ex.promptIsKr ? speakBtnHtml(ex.promptText) : ''}</div>`
      + (ex.promptRoman ? `<div class="sentence-prompt-roman">${ex.promptRoman}</div>` : '');

    answerRow.innerHTML = '';
    answerRow.classList.remove('correct', 'wrong');
    if(sentenceState.chosen.length === 0){
      const hint = document.createElement('span');
      hint.style.color = 'var(--gray-dark)';
      hint.style.fontSize = '13px';
      hint.textContent = 'Tippe die Wörter in der richtigen Reihenfolge an';
      answerRow.appendChild(hint);
    } else {
      sentenceState.chosen.forEach((word, idx) => {
        const t = document.createElement('button');
        t.type = 'button';
        t.className = 'sentence-token';
        // Umschrift unter der platzierten Kachel (Feedback vom 24.08.2026):
        // dieselbe Konvention wie bei den Pool-Kacheln weiter unten — nur
        // bei Schwierigkeitsgrad "Einfach" und nur, wenn die Vorlage eine
        // Umschrift für dieses Wort mitliefert (poolRoman).
        const roman = (settings.showRoman && ex.poolRoman) ? ex.poolRoman[word] : null;
        if(roman){
          t.innerHTML = `<span>${word}</span><span class="tile-roman">${roman}</span>`;
        } else {
          t.textContent = word;
        }
        t.disabled = answered;
        t.onclick = () => {
          if(answered) return;
          sentenceState.remaining.push(sentenceState.chosen[idx]);
          sentenceState.chosen.splice(idx, 1);
          render();
        };
        answerRow.appendChild(t);
      });
      if(ex.targetIsKr){
        const speakCurrent = document.createElement('button');
        speakCurrent.type = 'button';
        speakCurrent.className = 'speak-btn';
        speakCurrent.setAttribute('data-speak', sentenceState.chosen.join(' '));
        speakCurrent.setAttribute('aria-label', 'Aussprache anhören');
        speakCurrent.textContent = '🔊';
        answerRow.appendChild(speakCurrent);
      }
    }

    poolWrap.innerHTML = '';
    sentenceState.remaining.forEach((word, idx) => {
      const t = document.createElement('button');
      t.type = 'button';
      // Wortpool-Kacheln mit Umschrift (Feedback vom 24.08.2026): dieselbe
      // .cloze-tile-Klasse/.tile-roman-Konvention wie bei Lückentext-
      // Pool-Kacheln (s. renderClozeStep) — zweizeilig, koreanisches Wort
      // oben, kleine Umschrift darunter, nur bei "Einfach" sichtbar. Bei
      // Satzbau gibt es (anders als bei Lückentext) keinen Spoiler-Grund,
      // das zu verstecken: alle Pool-Wörter sind ohnehin schon offen
      // sichtbar, es geht nur um die Reihenfolge, nicht um eine Lücke.
      const roman = (settings.showRoman && ex.poolRoman) ? ex.poolRoman[word] : null;
      t.className = 'build-tile' + (roman ? ' cloze-tile' : '');
      if(roman){
        t.innerHTML = `<span>${word}</span><span class="tile-roman">${roman}</span>`;
      } else {
        t.textContent = word;
      }
      t.disabled = answered;
      t.onclick = () => {
        if(answered) return;
        sentenceState.chosen.push(word);
        sentenceState.remaining.splice(idx, 1);
        render();
      };
      poolWrap.appendChild(t);
    });

    if(!answered) $('checkBtn').disabled = sentenceState.chosen.length !== ex.correctTokens.length;
  }
  sentenceRender = render;
  render();
}

/* Entfernt einen klärenden Klammerzusatz am Ende einer Bedeutung, z. B.
   "Auf Wiedersehen (zu jemandem, der geht)" -> "Auf Wiedersehen". Solche
   Zusätze dienen nur dazu, bei mehrdeutigen deutschen Bedeutungen in der
   Übung/Wörterbuch anzuzeigen, WELCHE der beiden gemeint ist (s.
   Lektions-Design-Prinzipien) — beim Eintippen der Übersetzung soll aber
   das bloße Wort reichen, ohne den Klammerzusatz mittippen zu müssen. */
function stripTrailingParenthetical(str){
  return str.replace(/\s*\([^)]*\)\s*$/, '').trim();
}
/* Mehrteilige Umschriften/Sätze (z. B. "annyeonghi gaseyo") enthalten
   Leerzeichen zwischen den Wörtern. Mobile Tastaturen (v. a. Wisch-/
   Autokorrektur-Tastaturen) fügen dabei manchmal versehentlich doppelte
   Leerzeichen ein oder lassen ein zusätzliches Leerzeichen am Rand stehen
   — das darf nicht als falsche Antwort zählen, obwohl der Inhalt korrekt
   ist. Deshalb werden vor dem Vergleich alle Leerzeichen-Läufe auf genau
   eines reduziert (zusätzlich zum bestehenden .trim()). */
function normalizeSpaces(str){
  return str.replace(/\s+/g, ' ').trim();
}
/* Prüft, ob eine Zeichenkette mit einem echten Großbuchstaben beginnt
   (unicode-sicher, ohne eigene Akzentbuchstaben-Liste): ein Zeichen zählt
   als "groß", wenn sein Kleinbuchstaben-Pendant abweicht. Ziffern/Satz-
   zeichen liefern immer false. */
function looksCapitalized(str){
  const c = (str || '').charAt(0);
  return !!c && c === c.toUpperCase() && c !== c.toLowerCase();
}
/* Manche Übersetzungen ("de"-Feld) listen zwei gleichwertige deutsche
   Wörter/Ausdrücke getrennt durch "/", z. B. "Mensch/Person" oder
   "Kochen / Gericht" — beim freien Eintippen soll dann EINES der beiden
   reichen, nicht die komplette "A/B"-Schreibweise (Feedback vom
   18.08.2026). Das ist bewusst zu unterscheiden von Geschlechts-
   Kurzformen wie "Student/in", "Deutsche/r" oder "Lehrer/in" (auch
   eingebettet in ganze Sätze wie "Bist du Student/in?") — dort ist der
   Teil nach dem "/" nur ein anzuhängendes Suffix, kein eigenständiges
   Wort, und es bleibt beim vollen, literalen Text. Unterscheidungs-
   merkmal: der Teil NACH dem "/" beginnt (nach Entfernen von Satz-
   zeichen/Klammerzusatz am Ende) mit einem Großbuchstaben — das ist bei
   einem eigenständigen deutschen Substantiv/Ausdruck immer der Fall, bei
   einem Suffix wie "in"/"r"/"e" nie.
   ZAHLEN (Feedback vom 25.08.2026): Bei Zahlwörtern steht die Ziffer im
   Klammerzusatz ("drei (3)", "elf (11)", "tausend (1.000)"). Wer nach der
   Übersetzung gefragt wird, darf dort ALLE drei Schreibweisen tippen —
   "drei (3)", "drei" und "3". Die ersten beiden deckt der allgemeine
   Klammer-Fall oben bereits ab; für die reine Ziffer kommt eine eigene
   Regel dazu: Besteht der Klammerzusatz ausschließlich aus Ziffern (samt
   Tausenderpunkten), gilt er selbst als vollwertige Antwort — zusätzlich
   in der Fassung ohne Trennzeichen, damit auch "1000" für "(1.000)" zählt.
   Wo die Ziffer NICHT in der Klammer steht (z. B. "eins (einheimisch)",
   "zehn Jahre alt", "2 Uhr 30"), trägt die Vokabel stattdessen ein
   optionales "accept"-Feld mit den zusätzlichen Schreibweisen — die
   kommen hier über den Parameter "extra" dazu.
   Gibt die Menge aller akzeptierten (normalisierten, kleingeschriebenen)
   Antwort-Varianten zurück. */
function acceptableAnswers(correct, extra){
  const variants = new Set();
  const addVariant = (s) => {
    const trimmed = normalizeSpaces(s || '');
    if(trimmed) variants.add(trimmed.toLowerCase());
  };
  addVariant(correct);
  addVariant(stripTrailingParenthetical(correct));
  const numericParen = /\(\s*([0-9][0-9.\s]*)\s*\)\s*$/.exec(correct || '');
  if(numericParen){
    const digits = numericParen[1].trim();
    addVariant(digits);
    addVariant(digits.replace(/[.\s]/g, ''));
  }
  (extra || []).forEach(addVariant);
  const slashIdx = correct.indexOf('/');
  if(slashIdx !== -1){
    const left = correct.slice(0, slashIdx);
    const right = correct.slice(slashIdx + 1);
    const rightCore = stripTrailingParenthetical(right).replace(/[!?.,;:]+$/, '').trim();
    if(looksCapitalized(rightCore)){
      addVariant(left);
      addVariant(stripTrailingParenthetical(left));
      addVariant(right);
      addVariant(stripTrailingParenthetical(right));
    }
  }
  return variants;
}
function handleCheck(){
  const ex = exercises[exIdx];
  if(!answered){
    answered = true;
    // "Ich weiß es nicht" (Feedback vom 24.08.2026): der Knopf setzt
    // revealRequested, bevor er handleCheck() auslöst. Die Auswertung
    // zählt dann unabhängig von der (womöglich sogar richtigen) Eingabe
    // als falsch — inklusive der Einfärbung der Kacheln/Optionen, weshalb
    // die Flagge hier VOR den Auswertungs-Zweigen gelesen wird und nicht
    // erst danach.
    const forcedWrong = revealRequested;
    revealRequested = false;
    $('revealBtn').style.display = 'none';
    let userVal, isCorrect;
    if(ex.kind === 'mc' || ex.kind === 'listen'){
      userVal = selectedOption;
      isCorrect = !forcedWrong && userVal === ex.correct;
      document.querySelectorAll('.option').forEach(o => {
        if(o.dataset.value === ex.correct) o.classList.add('correct');
        else if(o.dataset.value === userVal && !isCorrect) o.classList.add('wrong');
        o.onclick = null;
      });
      // Nach dem Antworten immer das koreanische Schriftbild zeigen —
      // Gehörtes und Geschriebenes gehören zusammen.
      if(ex.kind === 'listen') revealListenText(ex);
    } else if(ex.kind === 'build'){
      // Bei 겹받침 (needsDoubleFinal) müssen erst final1+final2 zum echten
      // Unicode-Schlusskonsonanten zusammengefügt werden, s. joinCompoundFinal().
      const finalChar = ex.needsDoubleFinal
        ? ((buildState && buildState.final1 && buildState.final2) ? joinCompoundFinal(buildState.final1, buildState.final2) : null)
        : (buildState ? buildState.final : null);
      userVal = (buildState && buildState.initial && buildState.medial)
        ? composeSyllable(buildState.initial, buildState.medial, finalChar)
        : null;
      isCorrect = !forcedWrong && userVal === ex.correct;
      document.querySelectorAll('.build-tile').forEach(t => { t.disabled = true; });
      const preview = document.querySelector('.build-preview');
      if(preview) preview.classList.add(isCorrect ? 'correct' : 'wrong');
      document.querySelectorAll('.build-slot').forEach(s => { s.classList.remove('active'); s.disabled = true; });
    } else if(ex.kind === 'buildword'){
      let composedWord = '';
      let valid = !!buildWordState;
      if(valid){
        for(const syl of buildWordState.syllables){
          const composed = composeBuildWordSyllable(syl);
          if(!composed){ valid = false; break; }
          composedWord += composed;
        }
      }
      userVal = valid ? composedWord : null;
      isCorrect = !forcedWrong && userVal === ex.correct;
      document.querySelectorAll('.build-tile').forEach(t => { t.disabled = true; });
      if(typeof buildWordRender === 'function') buildWordRender();
    } else if(ex.kind === 'cloze'){
      userVal = clozeState ? clozeState.filled : null;
      isCorrect = !forcedWrong && userVal === ex.correct;
      document.querySelectorAll('.build-tile').forEach(t => { t.disabled = true; });
      document.querySelectorAll('.cloze-slot').forEach(s => {
        s.disabled = true;
        s.classList.add(isCorrect ? 'correct' : 'wrong');
      });
    } else if(ex.kind === 'draw'){
      const urteil = pruefeGemaltesJamo(drawState ? drawState.striche : [], ex.correct);
      isCorrect = !forcedWrong && urteil.richtig;
      userVal = urteil.verwechseltMit || (isCorrect ? ex.correct : '');
      /* Die richtige Form über die eigene Zeichnung legen — das ist die
         eigentliche Lehre der Übung: sehen, wo es abwich. */
      if(drawState){
        drawState.vorlage = ex.correct;
        drawState.vorlageFarbe = isCorrect ? 'rgba(90,150,110,.45)' : 'rgba(190,70,60,.45)';
        drawFlaecheMalen();
      }
      /* Verwechslungen sind die nützlichste Rückmeldung überhaupt —
         "sieht aus wie ㅓ" sagt mehr als "falsch". */
      ex.explain = urteil.verwechseltMit
        ? `deine Zeichnung sieht eher aus wie ${urteil.verwechseltMit}`
        : (urteil.leer ? 'da war noch nichts gemalt' : 'die Form stimmt noch nicht ganz');
    } else if(ex.kind === 'sentence'){
      userVal = sentenceState ? sentenceState.chosen.join(' ') : '';
      isCorrect = !forcedWrong && userVal === ex.correct;
      document.querySelectorAll('.sentence-token, .build-tile').forEach(t => { t.disabled = true; });
      const row = document.querySelector('.sentence-answer-row');
      if(row) row.classList.add(isCorrect ? 'correct' : 'wrong');
    } else {
      const input = document.querySelector('.type-input');
      userVal = input.value.trim();
      const userLower = normalizeSpaces(userVal).toLowerCase();
      isCorrect = !forcedWrong && acceptableAnswers(ex.correct, ex.accept).has(userLower);
      input.disabled = true;
    }

    // ---- Fehlerliste pflegen ----
    if(ex.mistakeMeta){
      if(!isCorrect){
        recordMistake(ex.mistakeMeta);
      } else if(sessionMode === 'mistakes'){
        // Nicht mehr sofort löschen: erst zwei richtige Antworten aus
        // zwei verschiedenen Sitzungen räumen den Eintrag weg.
        registerMistakeSuccess(ex.id);
      }
    }

    // ---- Fragen-Fortschritt + Gedächtnis pflegen ----
    // masteredQuestions bleibt eine reine "je einmal richtig"-Menge (davon
    // hängen Einheiten-Freischaltung und Zähler ab und die sollen durch
    // einen späteren Fehler nicht zurückfallen). questionMemory bekommt
    // dagegen JEDE Antwort mit — richtig wie falsch — und steuert daraus
    // die zeitliche Wiederholungs-Priorität.
    const mKey = masteryKeyFor(ex);
    if(mKey){
      if(isCorrect) masteredQuestions.add(mKey);
      recordAnswerMemory(mKey, isCorrect);
    }
    saveOpenSession();
    saveState();
    // Jede Antwort verschiebt eine Fälligkeit — der Reiter-Hinweis hängt
    // davon ab und wird deshalb hier aktualisiert, nicht nur an den
    // Stellen, die die Fehlerliste anfassen.
    updatePracticeIndicator();

    const fb = $('feedback');
    fb.classList.add('show');
    if(isCorrect){
      fb.className = 'feedback show correct';
      $('feedbackIcon').textContent = '✔️';
      $('feedbackText').textContent = 'Stark!';
      $('feedbackSub').textContent = '';
      xp += XP_PER_CORRECT; addDailyXp(XP_PER_CORRECT); correctInLesson++;
      logDay('fragen', 1); logDay('richtig', 1);
      feedbackCorrect();
    } else {
      fb.className = 'feedback show wrong';
      $('feedbackIcon').textContent = '✖️';
      $('feedbackText').textContent = 'Nicht ganz.';
      logDay('fragen', 1);
      feedbackWrong();
      // "explain" (optional): kurze Begründung, WARUM diese Antwort richtig
      // ist — v. a. bei Grammatik-Übungen (cloze/sentence) hilfreich, damit
      // nicht nur die Lösung, sondern auch die Regel dahinter sichtbar wird.
      // Bei Satzbau-Übungen Richtung "de-kr" (Zielsprache Koreanisch) wird
      // die angezeigte Lösung zusätzlich Wort für Wort per Hover/Tap
      // übersetzbar gemacht (Feedback vom 24.08.2026, s. .gloss-word/
      // .gloss-tooltip-CSS sowie den delegierten Klick-Handler weiter
      // unten für die Fingertipp-Bedienung) — nur wenn die Vorlage dafür
      // ein poolGloss-Wörterbuch mitliefert.
      if(ex.kind === 'sentence' && ex.direction === 'de-kr' && ex.poolGloss){
        const solutionHtml = ex.correctTokens.map(w => {
          const gloss = ex.poolGloss[w];
          return gloss
            ? `<span class="gloss-word">${w}<span class="gloss-tooltip">${gloss}</span></span>`
            : w;
        }).join(' ');
        $('feedbackSub').innerHTML = 'Richtig: ' + solutionHtml + (ex.explain ? ' — ' + ex.explain : '');
      } else {
        $('feedbackSub').textContent = 'Richtig: ' + ex.correct + (ex.explain ? ' — ' + ex.explain : '');
      }
      hearts = Math.max(0, hearts - 1);
      // Verpatzte Fragen werden gemerkt, aber nur EINMAL — sonst könnte
      // eine Sitzung bei hartnäckigen Fehlern beliebig lang werden.
      if(ex.mistakeMeta && !repairSeen.has(ex.id)){ repairSeen.add(ex.id); repairQueue.push(ex); }
    }
    updateHeaderStats();
    $('checkBtn').textContent = 'Weiter';
    $('checkBtn').className = 'btn btn-blue';
    $('checkBtn').disabled = false;
    if(hearts === 0 && repairQueue.length){
      $('checkBtn').onclick = startRepairRound;
      return;
    }
    $('checkBtn').onclick = nextExercise;
    return;
  }
}
/* REPARATUR-RUNDE statt Abbruch (Feedback vom 25.08.2026).
   Vorher endete eine Sitzung bei null Herzen auf dem Fehlschlag-Bildschirm
   und musste komplett von vorn begonnen werden — obwohl jede einzelne
   richtige Antwort intern längst gezählt hatte. Das bestrafte genau die
   Lernenden, die es am nötigsten haben.
   Jetzt kommen stattdessen die verpatzten Fragen sofort noch einmal, die
   Herzen werden aufgefüllt, und danach geht es weiter. Die Herzen behalten
   ihren Spannungsbogen, verlieren aber den Strafcharakter. */
function startRepairRound(){
  const queue = repairQueue.slice();
  repairQueue = [];
  // Direkt hinter der aktuellen Frage einschieben: die Reparatur kommt
  // sofort, nicht erst am Ende, wenn man schon abgeschaltet hat.
  exercises.splice(exIdx + 1, 0, ...shuffle(queue));
  hearts = Math.max(2, Math.ceil(heartsForExercises(exercises) / 2));
  updateHeaderStats();
  showChoiceDialog({
    title:'Kurze Reparatur',
    message: queue.length === 1
      ? 'Die Herzen sind alle. Kein Beinbruch: Die eine Frage, die dir Ärger gemacht hat, kommt jetzt gleich noch einmal — danach geht es normal weiter.'
      : `Die Herzen sind alle. Kein Beinbruch: Die ${queue.length} Fragen, die dir Ärger gemacht haben, kommen jetzt gleich noch einmal — danach geht es normal weiter.`,
    buttons: [{ label:'Los', className:'btn-primary', onClick: nextExercise }],
    dismissible: false
  });
}
/* KURSABSCHLUSS (Feedback vom 25.08.2026). Nach der allerletzten Lektion
   kam bis dahin derselbe Abschluss-Bildschirm wie nach jeder anderen —
   über tausend Fragen ohne Ziellinie. Einmalig, danach nie wieder. */
function maybeCelebrateCourseComplete(){
  if(onboarding.courseCelebrated) return;
  const real = COURSE.filter(l => l.type !== 'review');
  if(!real.every(l => completed.has(l.id))) return;
  onboarding.courseCelebrated = true;
  saveState();
  const units = Object.keys(COURSE_UNITS).length;
  const words = COURSE.reduce((n, l) => n + ((l.vocab || []).length) + ((l.words || []).length), 0);
  let questions = 0;
  Object.keys(COURSE_UNITS).forEach(u => { questions += getUnitQuestionKeys(+u).length; });
  setTimeout(() => showChoiceDialog({
    title:'Der Kurs ist geschafft.',
    message:`Du hast <strong>${units} Einheiten</strong> und <strong>${real.length} Lektionen</strong> hinter dir, `
      + `<strong>${words} Wörter</strong> gelernt und <strong>${questions} Fragen</strong> beantwortet — von einem leeren Bildschirm `
      + `bis zu Sätzen mit Objekt, Zeitform und zwei verbundenen Gedanken.<br><br>`
      + `Angefangen hast du mit 아이. Heute liest du 저는 어제 집에서 김치를 먹었어요 — und weißt, warum jedes Stück davon dort steht.<br><br>`
      + `Wie es weitergeht, steht ganz unten im Lernpfad unter <strong>Ausblick</strong>. 화이팅!`,
    buttons: [{ label:'Danke!', className:'btn-primary', onClick:null }],
    dismissible: false
  }), 400);
}
function nextExercise(){
  exIdx++;
  if(exIdx >= exercises.length){
    // Am Ende noch offene Fehler? Dann erst reparieren, dann fertig.
    if(repairQueue.length){ exIdx--; startRepairRound(); return; }
    finishSession();
  } else {
    renderExercise();
  }
}
function finishSession(){
  clearOpenSession();
  $('progressFill').style.width = '100%';
  let firstTimeBonus = 0;
  if(sessionMode === 'lesson'){
    const lesson = COURSE[currentLessonIdx];
    firstTimeBonus = completed.has(lesson.id) ? 0 : XP_LESSON_BONUS;
    completed.add(lesson.id);
    xp += firstTimeBonus;
    addDailyXp(firstTimeBonus);
    /* Fürs Wochenbuch zählt jede abgeschlossene Lektion, auch eine
       wiederholte — es beschreibt, was du getan hast, nicht was neu war. */
    logDay('lektionen', 1);
  }
  feedbackLessonDone();
  const today = todayStr();
  let restDayUsed = false;
  if(lastActiveDate !== today){
    const gap = daysBetweenStr(lastActiveDate, today);
    if(gap === 1){
      streak = streak + 1;
    } else if(gap === 2 && restDayWeek !== isoWeekStr(today)){
      // RUHETAG (Feedback vom 25.08.2026): Ohne Schutz war der Streak nach
      // dem ersten Urlaubs- oder Krankheitstag wertlos — und mit ihm die
      // Motivation, die er tragen soll. Ein einziger versäumter Tag pro
      // Kalenderwoche wird deshalb überbrückt.
      streak = streak + 1;
      restDayWeek = isoWeekStr(today);
      restDayUsed = true;
    } else {
      streak = 1;
    }
    lastActiveDate = today;
  }
  updateHeaderStats();
  saveState();
  $('xpResult').textContent = correctInLesson * XP_PER_CORRECT + firstTimeBonus;
  $('remainingHeartsResult').textContent = hearts;
  // Tagesziel-Rückmeldung: sagt entweder "geschafft" oder wie viel noch
  // fehlt — konkreter und motivierender als eine reine XP-Zahl.
  const goal = dailyGoalXp();
  const doneToday = dailyXpToday();
  const goalNote = doneToday >= goal
    ? `🎯 Tagesziel geschafft – ${doneToday} XP heute.`
    : `Tagesziel: noch ${goal - doneToday} XP heute.`;
  $('dailyGoalNote').textContent = restDayUsed
    ? `🎴 Ruhetag eingelöst – dein Streak läuft weiter. ${goalNote}`
    : goalNote;
  maybeCelebrateCourseComplete();
  $('completeTitle').textContent =
    sessionMode === 'lesson' ? 'Lektion abgeschlossen!' :
    sessionMode === 'practice' ? 'Vokabeltraining abgeschlossen!' :
    sessionMode === 'due' ? 'Fällige Wiederholung geschafft!' :
    sessionMode === 'quick' ? 'Kurz geübt – auch das zählt!' :
    sessionMode === 'favorites' ? 'Merkliste geübt!' :
    sessionMode === 'draw' ? 'Zeichen gemalt!' :
    sessionMode === 'hangultrainer' ? 'Hangul-Training abgeschlossen!' :
    'Fehlertraining abgeschlossen!';
  showScreen('complete');
}

}

/* =========================================================
   ZUR APP AUF DEM TELEFON
   =========================================================
   Zwei Dinge, die eine Webseite von einer App unterscheiden:

   1. Der Service Worker legt die App im Gerät ab, damit sie ohne Netz
      startet. Er lebt in einer eigenen Datei (sw.js) und funktioniert
      deshalb NUR, wenn die App über http(s) ausgeliefert wird. Wird die
      HTML-Datei direkt vom Dateisystem geöffnet (file://), passiert hier
      einfach nichts — die App läuft trotzdem, sie ist ja vollständig.

   2. Der Zurück-Knopf. Auf Android schließt er sonst mitten in der
      Lektion die ganze App. Wir legen deshalb bei jedem Bildschirm-
      wechsel einen Eintrag in die Verlaufsliste und fangen das
      Zurückgehen selbst ab.
   ========================================================= */
/* bewusst var — renderSettings() liest die Variable, und var ist bereits
   beim Auswerten der Datei vorhanden. */
var installPrompt = null;
/* iPhone/iPad kennen kein 'beforeinstallprompt'; dort hilft nur der
   Hinweis auf das Teilen-Menü. Erkennung bewusst schlicht gehalten. */
function isIosSafari(){
  const ua = navigator.userAgent || '';
  const isIos = /iPad|iPhone|iPod/.test(ua)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = window.navigator.standalone === true
    || window.matchMedia('(display-mode: standalone)').matches;
  return isIos && !standalone && location.protocol.startsWith('http');
}
/* Chrome/Android meldet über dieses Ereignis, dass die App installierbar
   ist. Wir halten die Meldung fest, statt sie verstreichen zu lassen —
   angeboten wird sie dann in den Einstellungen, wo sie niemanden
   unterbricht. */
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  installPrompt = e;
  if(currentScreenName === 'settings') renderSettings();
});
window.addEventListener('appinstalled', () => { installPrompt = null; });
