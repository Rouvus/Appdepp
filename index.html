   geöffnete Seite läuft weiter mit dem alten Code. Von selbst neu zu
   laden würde mitten in einer Lektion die Sitzung zerreißen; deshalb
   wird gefragt. Wer "Später" wählt, bekommt die neue Fassung ohnehin
   beim nächsten Start. */
/* =========================================================
   NACH EINER NEUEN FASSUNG SEHEN
   =========================================================
   Rückmeldung vom 26.08.2026: "Einmal auf dem Home-Bildschirm bekomme
   ich kein Update." Das stimmte, und es lag an zwei Dingen:

   1. Eine vom Startbildschirm gestartete App wird meist nicht neu
      geladen, sondern aus dem Hintergrund geholt. Die Prüfung auf eine
      neue Fassung hing aber allein an der Registrierung — und die läuft
      nur beim echten Laden der Seite. Wer die App nie ganz schließt,
      prüfte also nie.
   2. Der Browser durfte sich sw.js selbst aus seinem Zwischenspeicher
      holen. Dann liest er dieselbe alte Datei und stellt fest, dass sich
      nichts geändert hat — obwohl auf dem Server längst etwas Neues
      liegt. Dagegen hilft updateViaCache:'none' bei der Registrierung.

   Die Prüfung selbst holt sw.js frisch vom Server und vergleicht die
   Prüfsumme darin mit der eigenen. Das ist eine klare Ja/Nein-Antwort,
   unabhängig davon, ob die Service-Worker-Mechanik gerade mitspielt —
   und sie erlaubt es, "du hast die neueste Fassung" ehrlich zu sagen,
   statt es nur zu vermuten.
   ========================================================= */
let lastUpdateCheck = 0;
const UPDATE_CHECK_INTERVAL = 15 * 60 * 1000;   // höchstens alle 15 Minuten
function updatesMoeglich(){
  return 'serviceWorker' in navigator && location.protocol.startsWith('http');
}
/* Liefert die Prüfsumme, die gerade auf dem Server liegt — oder null,
   wenn sich das nicht feststellen lässt (kein Netz, keine Adresse). */
async function serverBuild(){
  try{
    const res = await fetch('sw.js?stand=' + Date.now(), { cache:'no-store' });
    if(!res.ok) return null;
    const text = await res.text();
    const m = text.match(/const VERSION = '([^']+)'/);
    return m ? m[1] : null;
  }catch(e){ return null; }
}
/* still = automatische Prüfung im Hintergrund (meldet sich nur, wenn es
   etwas Neues gibt). Ohne still ist es der Knopf in den Einstellungen,
   der in jedem Fall Auskunft gibt. */
async function checkForUpdate(stillePruefung){
  if(!updatesMoeglich()){
    if(!stillePruefung) showChoiceDialog({
      title:'Keine Aktualisierung möglich',
      message:'Diese App läuft gerade als einzelne Datei und nicht über eine Adresse. '
        + 'Eine neue Fassung bekommst du hier nur, indem du die Datei ersetzt.',
      buttons:[{ label:'Verstanden', className:'btn-primary' }]
    });
    return;
  }
  lastUpdateCheck = Date.now();
  const draussen = await serverBuild();
  const reg = await navigator.serviceWorker.getRegistration().catch(() => null);
  if(reg) reg.update();

  if(draussen && draussen !== APP_BUILD){
    if(stillePruefung){ showUpdateBar(); return; }
    /* Wer selbst nachgesehen hat, bekommt die Antwort im Dialog — dann
       braucht es nicht zusätzlich die Leiste, die dasselbe sagt. */
    updateOffered = true;
    showChoiceDialog({
      title:'Neue Fassung gefunden',
      message:`Auf dem Server liegt <code>${draussen}</code>, du hast <code>${appBuildLabel()}</code>. `
        + 'Beim Neustart wird sie geladen — dein Fortschritt und eine offene Lektion bleiben erhalten.',
      buttons:[
        { label:'Jetzt neu starten', className:'btn-primary', onClick:() => applyUpdateAndReload(reg, draussen) },
        { label:'Später', className:'btn-gray' }
      ]
    });
    return;
  }
  if(stillePruefung) return;
  showChoiceDialog({
    title: draussen ? 'Alles aktuell' : 'Nicht erreichbar',
    message: draussen
      ? `Du hast die neueste Fassung: Version ${APP_VERSION} (<code>${appBuildLabel()}</code>).`
      : 'Der Server war gerade nicht erreichbar. Versuch es später noch einmal — '
        + 'die App läuft in der Zwischenzeit ganz normal weiter.',
    buttons:[{ label:'Gut', className:'btn-primary' }]
  });
}
/* Liegt im Speicher schon die erwartete Fassung? Genau das ist die
   Bedingung für einen sinnvollen Neustart — und sie lässt sich
   nachsehen, statt sie zu schätzen. */
async function cacheHatFassung(erwartet){
  if(!erwartet || !('caches' in window)) return false;
  try{
    for(const name of await caches.keys()){
      const c = await caches.open(name);
      const res = await c.match('./index.html');
      if(!res) continue;
      const text = await res.text();
      if(text.indexOf("APP_BUILD = '" + erwartet + "'") !== -1) return true;
    }
  }catch(e){ /* Speicher nicht lesbar — dann eben ohne Nachweis */ }
  return false;
}
/* Neu starten, aber erst, wenn die neue Fassung wirklich bereitliegt.
   Beim ersten Bauen wurde hier direkt im Moment des Wechsels neu
   geladen — das ist zu früh: Die Navigation wird dann noch aus dem
   alten Stand beantwortet, die App startet unverändert, und es sieht
   aus, als käme das Update nicht an. */
async function applyUpdateAndReload(reg, erwartet){
  try{
    if(reg) await reg.update();
    const frist = Date.now() + 10000;
    while(Date.now() < frist){
      if(await cacheHatFassung(erwartet)) break;
      await new Promise(r => setTimeout(r, 250));
    }
    /* Ohne bekannte Zielfassung (Server war nicht erreichbar) bleibt nur
       eine kurze Atempause. */
    if(!erwartet) await new Promise(r => setTimeout(r, 800));
  }catch(e){ /* trotzdem neu starten — schlimmstenfalls ändert sich nichts */ }
  if(exercises.length) saveOpenSession();
  location.reload();
}
/* Die App vom Startbildschirm wird aus dem Hintergrund geholt, nicht neu
   geladen — deshalb hier prüfen, wenn sie wieder nach vorn kommt. */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible') return;
  if(!updatesMoeglich()) return;
  if(Date.now() - lastUpdateCheck < UPDATE_CHECK_INTERVAL) return;
  checkForUpdate(true);
});

let updateOffered = false;
function showUpdateBar(){
  if(updateOffered) return;
  updateOffered = true;
  const bar = $('updateBar');
  if(!bar) return;
  bar.classList.add('show');
  $('updateReloadBtn').onclick = async () => {
    $('updateReloadBtn').disabled = true;
    $('updateReloadBtn').textContent = 'Moment …';
    /* Denselben Weg wie der Knopf in den Einstellungen: erst prüfen, ob
       die neue Fassung bereitliegt, dann neu starten. */
    const reg = await navigator.serviceWorker.getRegistration().catch(() => null);
    applyUpdateAndReload(reg, await serverBuild());
  };
  $('updateLaterBtn').onclick = () => bar.classList.remove('show');
}

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    /* Beim allerersten Besuch gibt es noch keinen Service Worker; wenn
       er dann übernimmt, ist das KEINE neue Fassung, sondern die erste.
       Ohne diese Merkung würde die Leiste jedem Neuling entgegenspringen. */
    const hatteSchonEinen = !!navigator.serviceWorker.controller;
    /* updateViaCache:'none' ist hier entscheidend: Ohne diese Angabe darf
       der Browser sw.js aus seinem eigenen Zwischenspeicher lesen und
       "keine Änderung" feststellen, obwohl auf dem Server längst eine
       neue Fassung liegt. */
    navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(reg => {
      lastUpdateCheck = Date.now();
      /* Zwei Wege führen zur neuen Fassung: Entweder wir sehen sie
         installieren (updatefound), oder ein anderer Tab hat sie schon
         aktiviert und wir bekommen nur den Wechsel mit. */
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', () => {
          if(sw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar();
        });
      });
    }).catch(() => {
      /* Kein Service Worker (z. B. privater Modus) — die App läuft weiter. */
    });
    if(hatteSchonEinen){
      navigator.serviceWorker.addEventListener('controllerchange', showUpdateBar);
    }
  });
}

</script>
</body>
